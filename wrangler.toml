# AE-Simulator · воркер редактора
# живе доки: редактор розгортається з репо, а не вставляється в дашборд
#
# ⚠ ІМʼЯ. "ae-edit" — окремий воркер. Збіг імені з ae-proxy перезаписав би
#   робочий проксі кодом редактора, і модель замовкла б без видимої причини.
# ⚠ ae-proxy тут НЕ описаний навмисно: він живе в дашборді й цим файлом
#   не керується. Опишеш його тут — наступний деплой затре дашбордну версію.
#
# Секрет AE_EDIT_CODE НЕ живе у цьому файлі і не перевстановлюється деплоєм.
# Кладеться один раз, обовʼязково як Encrypt (Secret), не Plain text.
# ⚠ Чому саме Encrypt: звичайні змінні (vars) належать ЦЬОМУ файлу — те, що
#   додане в дашборді й відсутнє тут, наступний деплой стирає. Секрети
#   wrangler не чіпає, вони переживають деплої. Саме на цьому згорів
#   AE_ORIGINS (S10→S11): покладений як Plain text, зметений першим же
#   деплоєм з CI, і воркер мовчки відмовляв усім.
# ⚠ AE_ORIGINS більше немає — перевірку домену знято свідомо, див. шапку
#   worker/ae-edit.js. Змінну треба видалити і з дашборда.

name = "ae-edit"
main = "worker/ae-edit.js"
compatibility_date = "2026-09-01"
