name: Перевірка даних

on:
  push:
    paths: ['data/**', 'config.json', 'tools/validate.js']
  pull_request:
    paths: ['data/**', 'config.json', 'tools/validate.js']
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Перевірка даних
        run: node tools/validate.js
