/* ── ПАНЕЛЬ ПЕРЕВІРКИ ДАНИХ (6а) ──────────────────────────────────
   Судить те, що застосунок реально завантажив: S.CAT і S.SCEN лягають
   у другу гілку нормалізації AE_RULES.validate, тож перевірка не коштує
   жодного запиту.

   ⚠ S.CAT втрачає label — boot() лишає самі items. Правила label не
   читають, тому вердикт мусить збігтися з командним рядком. Але «мусить»
   і «збігається» розходяться тихо, тому в tools/smoke_ui_v1.js стоїть
   звірка вердиктів браузера і диска. Вона, а не вигляд панелі, — гейт кроку.

   ⚠ Код куратора — НЕ безпека: він лежить у відкритому config.json і
   видимий кожному. Це захист від випадковості — щоб Оля не натрапила на
   технічний вивід, шукаючи поле ключа.

   ⚠ Рядки вердикту показуються ЯК Є, мовою правил. Людський переказ тут
   був би другою копією правил у мʼякій формі і розійшовся б так само. */
/* ── 6а-3 · РОЗБІР ФАЙЛУ, ВИБРАНОГО З ТЕЛЕФОНА ────────────────────
   Дві чисті функції лежать ЗЗОВНІ замикання панелі навмисно: гейт мусить
   викликати сам розбір, а не лише дивитись на DOM. Твердження, яке бачить
   тільки екран, про розбір мовчить, і зламаний розбір лишиться зеленим.

   ⚠ Вибраний файл НІКОЛИ не лягає в S.CAT / S.SCEN. Панель тільки читає:
   застосунок після перевірки працює на тих самих даних, що й до неї. */

/* Тип визначається ФОРМОЮ, не імʼям файлу: у Files на iPhone файл
   перейменовується одним дотиком, тож «catalog.json» нічого не гарантує. */
function classifyJson(v){
  if(Array.isArray(v)) return 'scen';
  if(!v || typeof v!=='object') return null;
  if(Array.isArray(v.scenarios)) return 'scen';
  if(v.categories && typeof v.categories==='object') return 'cat';
  const vals=Object.values(v);
  if(vals.length && vals.every(a=>Array.isArray(a))) return 'cat';
  return null;
}

/* Людський текст замість вбудованого повідомлення рушія, яке англійською
   називає зсув у символах. Зсув перекладається в рядок і позицію: той,
   хто піде правити файл у редакторі телефона, шукає рядок. */
function jsonErrorText(err, src){
  const m = /position (\d+)/.exec((err && err.message) || '');
  let where = '';
  if(m){
    const pos  = Math.min(+m[1], src.length);
    const head = src.slice(0, pos);
    where = ' Місце: рядок ' + head.split('\n').length +
            ', позиція ' + (pos - head.lastIndexOf('\n')) + '.';
  }
  return 'Файл не читається як JSON.' + where +
         ' Найчастіша причина — зайва або пропущена кома чи дужка.';
}

/* FileReader, а не Blob.text(): читається однаково на старіших iOS і в
   середовищі гейта, тобто обидва споживачі бачать той самий шлях. */
function readFileText(f){
  return new Promise((res, rej)=>{
    const r = new FileReader();
    r.onload  = ()=>res(String(r.result));
    r.onerror = ()=>rej(r.error || new Error('read'));
    r.readAsText(f);
  });
}

/* ── КУРАТОР: одні двері, які на кроці Д переїдуть уперед екрана ───
   Прапорець живе В ПАМʼЯТІ, не в localStorage: закритий застосунок =
   зачинені двері. Це стіна від випадковості, а не безпека — код лежить
   у відкритому config.json і видимий кожному, хто його відкриє. Право
   ПИСАТИ в репозиторій дає інший код (секрет воркера), і змішувати їх
   не можна: тоді запис у дані отримав би кожен, хто прочитав config.

   ⚠ Дім цього прапорця не міняється кроком Д. Міняється лише місце,
   де його питають: сьогодні — всередині екрана Налаштувань, після Д —
   перед ним. Тому підписники, а не render(): відімкнення посеред
   роботи не сміє змести вердикт, який людина щойно отримала. */
const CURATOR = {
  open:false,
  watch:[],                       // очищається на кожному render()
  unlock(code){
    if(String(code).trim() !== String(S.cfg.curatorCode||'')) return false;
    this.open = true;
    for(const fn of this.watch) try{ fn(); }catch(_){}
    return true;
  }
};

/* ── КЛЮЧ ДО ВОРКЕРА (Р-1в-2) ─────────────────────────────────────
   ДВА РІЗНІ КЛЮЧІ, і плутати їх не можна ні в коді, ні на екрані:
     curatorCode  — відмикає ЕКРАН редактора. Лежить у config.json,
                    тобто видимий кожному, хто відкриє файл.
     AE_EDIT_CODE — відмикає ЗАПИС. Секрет воркера, ніде в репозиторії
                    його немає, і сторінка його не знає, доки людина не
                    надрукує (worker/ae-edit.js:225–228).
   ⚠ ДІМ — ПАМʼЯТЬ МОДУЛЯ, не localStorage і не S. Код запису на диску
   телефона переживає власника: телефон лишають розблокованим на столі,
   передають, здають у сервіс. Памʼять гине з вкладкою, і це єдина
   властивість, заради якої цей об'єкт існує окремо від S — S тут ні до
   чого не зобов'язує, але сусідство з даними, які пишуться, притягує
   збереження «за компанію».
   ⚠ Не в CURATOR: там прапорець «екран відімкнено», і код, покладений
   поруч, з часом почав би читатись як частина того самого дозволу. */
const EDITKEY = { code:'' };

/* ЄДИНА точка виклику правил на сторінці. Другий виклик, написаний
   поруч, — це другий дім того самого суду: розійдуться вони мовчки й
   рівно тоді, коли аргументи знову зміняться (S21 §1.2 — саме так
   чотири споживачі роз'їхались на двох аргументах проти чотирьох).
   Носії беруться з застосунку ЗАВЖДИ, навіть коли дані підсунуті
   файлом: судиться файл, а не носій. */
function runRules(cat, scen){
  if(typeof AE_RULES==='undefined' || !AE_RULES.validate) return null;
  return AE_RULES.validate(cat || S.CAT, scen || S.SCEN, S.P.charsRaw, S.cfg);
}

/* ── ЧЕРНЕТКА ─────────────────────────────────────────────────────
   Запис = дані з файлу, накриті правками. Другого місця, де правка
   склеюється з записом, немає: і список, і картка, і вирок беруть
   рівно цю функцію, інакше екран показував би одне, а правила судили
   б інше — і розходження побачила б тільки людина, вже після запису.

   recOf працює й тоді, коли базового запису немає (правка без файлу):
   це майбутнє створення сценарію (Р-1д), і форма, написана на індекс
   у SCEN, туди не переїхала б без переписування. */
const recOf = id => {
  const base = S.SCEN.find(s=>String(s.id)===id) || null;
  const d = S.edraft[id];
  return base ? (d ? {...base, ...d} : base) : (d ? {...d} : null);
};
const scenAll = () => S.SCEN.map(s=>recOf(String(s.id)));
/* Правка, що збіглася з файлом, — не правка. Без цього повернення поля
   до вихідного тексту лишало б картку позначеною назавжди.

   ⚠ Масив порівнюється ВМІСТОМ (Р-1г-1). Для order · bv · bm значення —
   новий масив на кожен дотик, і тотожність (===) для нього хибна ЗАВЖДИ:
   поле лишалось би позначеним назавжди, а публікація везла б у тілі
   запиту поле, якого ніхто не міняв, — тобто mergeDraft мовчки затер би
   чужу правку рівно в цьому полі.
   Порядок значущий, а не випадковий: вибірник його зберігає (наявні коди
   лишаються на місці, нові йдуть у кінець), тому звірка по відсортованому
   казала б «не змінено» там, де послідовність у файлі інша. */
const sameVal = (a,b) => (Array.isArray(a) && Array.isArray(b))
  ? (a.length===b.length && a.every((x,i)=>x===b[i]))
  : a===b;
const setDraft = (id, field, value) => {
  const base = S.SCEN.find(s=>String(s.id)===id);
  const d = S.edraft[id] || {};
  if(base && sameVal(base[field], value)) delete d[field]; else d[field] = value;
  if(Object.keys(d).length) S.edraft[id] = d; else delete S.edraft[id];
};
const draftFields = id => Object.keys(S.edraft[id] || {});

/* Число в заголовку рахується з переліку, а не пишеться рукою. Написане
   рукою воно замерзає брехнею на кроці, який перенесе ще одне поле у
   форму: рядок стану, що каже неправду, гірший за відсутній рядок. */
const plural = (n, one, few, many) => {
  const a = n%100, b = n%10;
  return n + ' ' + (a>=11&&a<=14 ? many : b===1 ? one : (b>=2&&b<=4) ? few : many);
};

/* ── ПУБЛІКАЦІЯ · Р-1в ────────────────────────────────────────────────
   Три предмети, і кожен окремий: АДРЕСА (оголошена в config, не зашита),
   ЗВІРКА (істина береться з репозиторію, не з Pages) і ЗАПИС (воркер).

   ⚠ Чому звірка взагалі потрібна. commit() у worker/ae-edit.js бере sha
   сам, за мілісекунду до PUT, і тіла з sha не приймає — тобто гонки він
   не бачить: правка, зроблена кимось, поки форма була відкрита, буде
   затерта МОВЧКИ (S22 §1.3). Замок робиться тут, на клієнті: знімок при
   вході + перечитування перед записом. Серверний варіант (воркер приймає
   baseSha і чесно віддає 409) кращий, але це його код і його гейт.

   ⚠ Відмова читання = ЗУПИНКА, а не «схоже, що збіглось». Ліміт
   api.github.com без токена — 60 запитів/годину на IP; 403 по ліміту
   виглядає як звичайна помилка мережі, і поблажливе поводження з нею
   перетворило б замок на прикрасу. */
const pubReady = () => !!(S.cfg && S.cfg.editEndpoint && S.cfg.sourceApi);

/* base64 → текст. atob віддає байти по одному символу; кирилиця без
   декодування UTF-8 приїхала б кракозябрами, і звірка «файл не змінився»
   червоніла б завжди. */
const b64text = b64 => {
  const bin = atob(String(b64).replace(/\s+/g,''));
  if(typeof TextDecoder!=='undefined')
    return new TextDecoder('utf-8').decode(Uint8Array.from(bin,c=>c.charCodeAt(0)));
  return decodeURIComponent(escape(bin));
};

async function ghRead(path){
  const url = S.cfg.sourceApi + path + '?ref=' + (S.cfg.sourceBranch||'main');
  const r = await fetch(url,{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});
  if(!r.ok) throw new Error(r.status===403
    ? 'GitHub відмовив (403) — найімовірніше вичерпано 60 запитів на годину.'
    : 'GitHub відповів ' + r.status + ' на ' + path);
  const j = await r.json();
  return { sha:j.sha, obj:JSON.parse(b64text(j.content)) };
}

/* Знімок береться один раз на вхід у редактор і одразу звіряється з тим,
   що завантажила сторінка. Розбіжність тут означає не гонку, а застарілу
   сторінку — і лікується перезавантаженням, а не публікацією. */
async function loadSnap(){
  /* ⚠ Прапорець ставиться, а render() НЕ викликається: loadSnap стартує
     зсередини Editor(), до put(root,…). Перемальовування звідти пішло б
     рекурсією — внутрішній Editor малює сторінку, зовнішній дописує в неї
     свої вузли другим разом, і вердикт задвоюється. Смуга й так побачить
     'busy': прапорець виставлений синхронно, до першого await. */
  S.epub = {state:'busy', text:'Звіряємо з репозиторієм…'};
  try{
    const [scn,cat] = await Promise.all([
      ghRead('data/scenarios.json'), ghRead('data/catalog.json')]);
    S.esnap = {sha:scn.sha, scn:scn.obj, cat:cat.obj};
    const same = JSON.stringify(scn.obj.scenarios||scn.obj)
              === JSON.stringify((S.RAW&&S.RAW.scn&&S.RAW.scn.scenarios)||S.SCEN);
    S.epub = same
      ? {state:'ok', text:'Звірено з репозиторієм: дані сторінки збігаються з main.'}
      : {state:'stale', text:'Сторінка показує НЕ те, що лежить у репозиторії. '
          + 'Публікація зупинена: правка лягла б поверх чужої. Перезавантажте сторінку.'};
  }catch(e){
    S.esnap = null;
    S.epub = {state:'fail', text:'Не вдалося звірити з репозиторієм. '
      + String(e&&e.message||e) + ' Публікація зупинена.'};
  }
  render();
}

/* Чернетка накладається на СВІЖИЙ файл, а не на той, що в памʼяті:
   інакше публікація повертала б застарілі сусідні записи. */
const mergeDraft = base => {
  const out = JSON.parse(JSON.stringify(base));
  const arr = out.scenarios || out;
  for(const rec of arr){
    const d = S.edraft[String(rec.id)];
    if(d) Object.assign(rec, d);
  }
  return out;
};

async function publish(){
  if(!pubReady() || !S.esnap) return;
  /* ⚠ Сторож стоїть ДО перечитування, а не перед fetch воркера. Запит без
     ключа воркер відхилить однаково, але перечитування вже витратить один
     із 60 запитів на годину — той самий бюджет, з якого живе замок. */
  if(!EDITKEY.code.trim()){
    S.epub = {state:'code', text:'Введіть код редактора — без нього воркер '+
      'запису не приймає. Це інший ключ, ніж код куратора.'};
    return render();
  }
  S.epub = {state:'busy', text:'Перечитуємо файл перед записом…'};
  render();
  let fresh;
  try{ fresh = await ghRead('data/scenarios.json'); }
  catch(e){
    S.epub = {state:'fail', text:'Перед записом файл прочитати не вдалося. '
      + String(e&&e.message||e) + ' Не збережено.'};
    return render();
  }
  /* Замок. sha — це відбиток вмісту файлу в git; інший sha означає, що
     між входом у редактор і цією секундою файл змінили. */
  if(fresh.sha !== S.esnap.sha){
    const a = new Map((S.esnap.scn.scenarios||[]).map(s=>[String(s.id),JSON.stringify(s)]));
    const b = new Map((fresh.obj.scenarios||[]).map(s=>[String(s.id),JSON.stringify(s)]));
    const moved=[];
    for(const [k,v] of b) if(a.get(k)!==v) moved.push('#'+k+(a.has(k)?'':' (новий)'));
    for(const k of a.keys()) if(!b.has(k)) moved.push('#'+k+' (зник)');
    S.epub = {state:'conflict',
      text:'Файл змінився, поки картка була відкрита. Не збережено — інакше '
         + 'чужа правка зникла б мовчки. Перезавантажте сторінку.',
      lines: moved.length ? ['Розійшлись: '+moved.join(' · ')] : []};
    return render();
  }
  const n = Object.keys(S.edraft).length;
  let res, j;
  try{
    res = await fetch(S.cfg.editEndpoint,{method:'POST',
      /* ⚠ encodeURIComponent обовʼязковий: кирилиця в заголовку HTTP падає
         на «non ISO-8859-1 code point» — уже наступали в ae-proxy. Воркер
         розкодовує назад сам (ae-edit.js:226). Ключ їде заголовком, а не
         в тілі: тіло воркер записує в репозиторій, і секрет у ньому
         поїхав би в коміт. */
      headers:{'Content-Type':'application/json',
               'x-ae-edit-code':encodeURIComponent(EDITKEY.code.trim())},
      body:JSON.stringify({catalog:S.esnap.cat, scenarios:mergeDraft(fresh.obj),
        save:'scenarios', note:'редактор даних: сценаріїв '+n})});
    j = await res.json();
  }catch(e){
    S.epub = {state:'fail', text:'Воркер не відповів. '+String(e&&e.message||e)};
    return render();
  }
  /* Вердикт воркера показується як є. Переказ своїми словами був би
     другим домом того самого тексту (12.11). */
  /* 403 від ЦІЄЇ адреси воркер віддає рівно в одному місці — невідповідність
     коду (ae-edit.js:227). 403 від api.github.com (ліміт 60/год) сюди не
     доходить: він падає в ghRead вище й ловиться своїм catch. Тому
     розрізнення однозначне за адресою, а не за здогадом про текст. */
  if(res.status===403){
    S.epub = {state:'code', text:(j&&j.text)||'Код редактора не підходить.'};
    return render();
  }
  if(!res.ok || !j || j.saved===null || j.saved===undefined){
    S.epub = {state:'fail', text:(j&&(j.text||j.error))||('Воркер відповів '+res.status),
      lines:(j&&j.out||[]).filter(m=>m.lvl==='err').map(m=>'✗ '+m.msg)};
    return render();
  }
  S.edraft = {};
  S.epub = {state:'ok', text:(j.text||'Збережено.')
    + ' Сторінка ще показує стару версію: GitHub Pages оновиться за хвилину-дві.'};
  S.esnap = null;
  render();
}

/* Маршрут рядка вердикту на картку. Повідомлення правил починаються
   з '#'+id — рівно ті, що стосуються одного сценарію; агрегатні ✓
   («обов'язкові поля на місці») не називають нікого і на картку не
   лягають ніколи.
   ⚠ ТОКЕН, не префікс. startsWith('#1') зловив би і '#14': на живих
   даних id — числа 1…43, тобто пастка не гіпотетична, а гарантована.
   \S+ зупиняється на пробілі, а формат тега («#id «назва» — текст»,
   «#id mood — текст») пробіл після номера має завжди. */
const idOfMsg = msg => { const m=/^#(\S+)/.exec(String(msg)); return m ? m[1] : null; };

/* Розкладка вердикту: {byId:Map, general:[]}. Рядок з номером, якому
   не знайшлось картки (сценарій щойно видалили), НЕ зникає — він іде
   в «Загальні». Мовчазна втрата рядка виглядає точно як чисті дані. */
function spreadVerdict(out, ids){
  const byId=new Map(), general=[];
  for(const m of out){
    const id=idOfMsg(m.msg);
    if(id!==null && ids.has(id)){
      if(!byId.has(id)) byId.set(id,[]);
      byId.get(id).push(m);
    } else general.push(m);
  }
  return {byId, general};
}

function dataCheck(){
  const box = el('div',{class:'accbody',style:'display:none'});
  const head = el('p',{class:'sub',style:'margin:0'});
  const srcLine = el('p',{class:'sub',style:'margin:0 0 6px;font-size:12px'});
  const fileNote = el('p',{class:'sub',style:'margin:0 0 6px;font-size:12px;display:none'});
  let opened=false;
  /* Вибране людиною. Порожнє поле = бік береться з застосунку. */
  const picked = {cat:null, scen:null, catName:'', scenName:''};

  const run = ()=>{
    box.innerHTML='';
    if(typeof AE_RULES==='undefined' || !AE_RULES.validate){
      head.style.color='var(--loss)';
      head.textContent='✗ Правила не завантажились: tools/ae_rules.js не прочитано.';
      return;
    }
    /* Виклик стоїть один — у runRules(). Аргументи, які колись знову
       зміняться, міняються там і одразу для обох споживачів. */
    /* Джерело називається ЗАВЖДИ, навіть коли файл не вибирали. Вердикт
       без імені того, що судилось, читається як вердикт про застосунок —
       і саме так зелений прогін чужого файлу став би доказом ні про що. */
    srcLine.textContent = 'Судиться: каталог — ' + (picked.catName || 'дані застосунку') +
                          ' · сценарії — ' + (picked.scenName || 'дані застосунку');
    /* ⚠ ЧОТИРИ АРГУМЕНТИ, не два. На двох правила не мовчать — вони
       кажуть ⚠ «носій не переданий», і саме ті перевірки, заради яких
       робились S17 і S18 (рядок mood) та звірка character з носієм,
       стають інертними. Вердикт при цьому лишається зеленим і виглядає
       як перевірка. Носій характерів і config беруться З ЗАСТОСУНКУ
       навіть тоді, коли дані підсунуті файлом: судиться файл, а не
       носій, і підміняти носій разом із даними означало б судити
       вигадану пару. */
    const r = runRules(picked.cat, picked.scen);
    head.style.color = r.err ? 'var(--loss)' : 'var(--soft)';
    head.textContent = (r.err?'✗':'✓')+' підсумок: ✓'+r.ok+' · ⚠'+r.warn+' · ✗'+r.err;
    const SIGN={ok:'✓',warn:'⚠',err:'✗'};
    const TONE={ok:'var(--vtm)',warn:'var(--soft)',err:'var(--loss)'};
    for(const m of r.out) box.append(el('div',{class:'tapeline'},[
      el('span',{style:'color:'+TONE[m.lvl],text:SIGN[m.lvl]+' '+m.msg})]));
    box.style.display='';
  };

  let code='';
  const codeInput = el('input',{type:'text',placeholder:'код куратора',
    oninput:e=>code=e.target.value, onkeydown:e=>e.key==='Enter'&&unlock()});
  const gateRow = el('div',{style:'display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end'});
  const unlock = ()=>{
    /* Той самий код відмикає і панель, і вхід у редактор: двері одні.
       Вигляд панелі не змінився ані на піксель — змінилось лише те, що
       відімкнення тепер чути ще комусь (CURATOR.watch). */
    if(!CURATOR.unlock(code)){
      head.style.color='var(--loss)'; head.textContent='Код не підходить.'; return; }
    opened=true; gateRow.style.display='none';
    fileRow.style.display='flex'; run();
  };
  put(gateRow,
    el('label',{class:'field',style:'margin:0;flex:1 1 160px'},[
      el('span',{text:'Код куратора'}), codeInput]),
    el('button',{class:'btn ghost',text:'Перевірити дані',onclick:unlock}));

  /* ⚠ accept НЕ ставимо. У Files на iPhone фільтр за типом глушить файли,
     що лежать в iCloud, і людина бачить порожній список замість свого
     файлу. Тип усе одно перевіряється розбором, тобто надійніше. */
  const fileIn = el('input',{type:'file',multiple:true,style:'display:none',
    onchange:e=>takeFiles(e.target.files)});

  const takeFiles = async (list)=>{
    const files=[...list];
    /* Скидання значення: без нього повторний вибір ТОГО САМОГО файлу
       події не дає, і виправлений файл виглядає як невиправлений. */
    fileIn.value='';
    if(!files.length) return;
    const bad=[];
    for(const f of files){
      let src='';
      try{ src = await readFileText(f); }
      catch(_){ bad.push(f.name+' — файл не прочитався з пристрою.'); continue; }
      let v;
      try{ v = JSON.parse(src); }
      catch(err){ bad.push(f.name+' — '+jsonErrorText(err, src)); continue; }
      const kind = classifyJson(v);
      if(!kind){ bad.push(f.name+' — не схоже ні на каталог, ні на сценарії.'); continue; }
      if(kind==='cat'){ picked.cat=v; picked.catName=f.name; }
      else            { picked.scen=v; picked.scenName=f.name; }
    }
    fileNote.style.display = bad.length ? '' : 'none';
    fileNote.style.color='var(--loss)';
    fileNote.textContent = bad.join('  ·  ');
    run();
  };

  const fileRow = el('div',{style:'display:none;gap:8px;flex-wrap:wrap;margin:0 0 10px'},[
    fileIn,
    el('button',{class:'btn ghost',text:'Вибрати файл…',onclick:()=>fileIn.click()}),
    el('button',{class:'btn ghost',text:'Дані застосунку',onclick:()=>{
      picked.cat=null; picked.scen=null; picked.catName=''; picked.scenName='';
      fileNote.style.display='none'; fileNote.textContent=''; run();
    }})
  ]);

  return el('details',{class:'acc',style:'margin-top:24px'},[
    el('summary',{text:'Перевірка даних'}),
    el('div',{class:'accbody'},[
      el('p',{class:'sub',style:'margin:0 0 10px',text:
        'Прогін тих самих правил, що ганяються на кожен push у репозиторій. '+
        'Судяться дані, які цей застосунок зараз завантажив. Нічого не змінює.'}),
      gateRow, fileRow, fileNote, srcLine, head, box
    ])
  ]);
}

/* ── ВХІД У РЕДАКТОР ──────────────────────────────────────────────
   Блок мовчить, доки двері зачинені, і зʼявляється тим самим кодом,
   що відмикає панель перевірки — без render(), щоб не змести вердикт,
   який людина щойно отримала. */
function editEntry(){
  const box = el('div',{style:'margin-top:24px;max-width:520px'},[
    el('h2',{style:'margin:0 0 6px;font-size:17px',text:'Редактор даних'}),
    el('p',{class:'sub',style:'margin:0 0 10px',text:
      'Сценарії списком, з вердиктом правил на кожному. Читання: '+
      'нічого не змінює і нічого не надсилає.'}),
    el('button',{class:'btn ghost',text:'Відкрити редактор',
      onclick:()=>{ S.screen='edit'; render(); }})
  ]);
  box.style.display = CURATOR.open ? '' : 'none';
  CURATOR.watch.push(()=>{ box.style.display=''; });
  return box;
}

/* ── ЕКРАН РЕДАКТОРА · Р-1а: список і світлофор ───────────────────
   Судить ЛОКАЛЬНО, тим самим тілом правил, що й воркер на записі
   (S21 §2): відмову видно до кнопки, а не після мережі.

   ⚠ ЩО САМЕ ПОКАЗУЄ СВІТЛОФОР — названо вголос, бо це не очевидно.
   На чистих даних правила віддають 20 рядків, і рядків із номером
   сценарію серед них НУЛЬ: усі ✓ агрегатні («обовʼязкові поля на
   місці», «усі cats існують»). Номер несуть тільки ✗ і ⚠ про
   конкретний сценарій. Отже «чиста картка» означає «жодного рядка
   про неї не сказано», а не «правила її похвалили» — і напис на
   картці мусить казати саме це, інакше зелений читається як доказ.

   ⚠ Межа маршруту (12.12-и). Дефекти, що стосуються сценарію, але
   названі без номера — «пул порожній», «дублі кодів товару», —
   лягають у «Загальні» і на картці не видно. Сценарій, зламаний
   через каталог, лишиться чистим. Ця частка не спіймана тут; вона
   спіймана в «Загальних», але без адреси. */
function Editor(root){
  /* Пряме потрапляння на екран повз двері (S.screen ззовні, повернення
     назад у PWA) не пускається: двері мають значити те саме завжди. */
  if(!CURATOR.open){ S.screen='settings'; render(); return; }

  /* Звірка з репозиторієм стартує сама, один раз на вхід у редактор, і лише
     доки про неї нічого не сказано. Умова стоїть на epub, а не на esnap:
     після відмови знімка немає, і умова «немає знімка» крутила б спроби по
     колу на кожному render(). */
  if(pubReady() && S.epub===null) loadSnap();

  /* Судяться дані З ЧЕРНЕТКОЮ, а не з файлу: інакше список показував би
     вердикт про текст, якого на екрані вже немає. Саме заради цієї
     арності виклик правил зведено в одну точку (S22 §1.6). */
  const SC = scenAll();
  const r = runRules(null, SC);
  const ids = new Set(SC.map(s=>String(s.id)));
  const spread = r ? spreadVerdict(r.out, ids) : {byId:new Map(), general:[]};

  const SIGN={ok:'✓',warn:'⚠',err:'✗'};
  const TONE={ok:'var(--vtm)',warn:'var(--soft)',err:'var(--loss)'};
  const line = m => el('div',{class:'tapeline'},[
    el('span',{style:'color:'+TONE[m.lvl],text:SIGN[m.lvl]+' '+m.msg})]);

  /* Стан картки рахується з РОЗКЛАДЕНИХ рядків, а не з полів сценарію:
     другий підрахунок був би другим тілом правил у мʼякій формі. */
  const stateOf = id => {
    const ms = spread.byId.get(id) || [];
    return { err: ms.filter(m=>m.lvl==='err').length,
             warn: ms.filter(m=>m.lvl==='warn').length, all: ms };
  };

  const listBox = el('div',{class:'elist'});

  const counts = ()=>{
    let e=0,w=0;
    for(const s of SC){ const st=stateOf(String(s.id));
      if(st.err) e++; else if(st.warn) w++; }
    return {e,w};
  };
  const C = counts();

  const drawList = ()=>{
    listBox.innerHTML='';
    let shown=0;
    for(const s of SC){
      const id=String(s.id), st=stateOf(id), dr=draftFields(id);
      if(S.efilter==='err'  && !st.err) continue;
      if(S.efilter==='warn' && !(st.warn && !st.err)) continue;
      shown++;
      const badge = st.err  ? el('span',{class:'est',style:'color:'+TONE.err,
                                text:'✗ '+st.err+(st.warn?' · ⚠ '+st.warn:'')})
                  : st.warn ? el('span',{class:'est',style:'color:'+TONE.warn,text:'⚠ '+st.warn})
                            : el('span',{class:'est',style:'color:'+TONE.ok,text:'без зауважень'});
      const card = el('div',{class:'card ecard'},[
        el('div',{class:'ord',text:'#'+id+' · '+(s.grp||'—')}),
        el('h3',{text:s.title||'без назви'}),
        el('p',{text:[s.character||'характер не вказано', s.mode||'режим не вказано'].join(' · ')}),
        el('p',{class:'emood',text:s.mood||'рядок mood порожній'}),
        el('div',{class:'cardfoot'},[
          el('span',{class:'sub',style:'font-size:12.5px',
            text:(s.mood||'').length+' зн.'}),
          badge
        ]),
        /* Вхід у поля — окремою кнопкою, не натиском по картці: під
           карткою лежить <details>, і спільна зона відповідала б на
           два різні наміри одним жестом. */
        el('div',{style:'display:flex;gap:8px;align-items:center;margin-top:2px'},[
          el('button',{class:'btn ghost',style:'padding:6px 12px;font-size:13.5px',
            text:'Правити', onclick:()=>{ S.escen=id; S.screen='escen'; render(); }}),
          dr.length ? el('span',{class:'echip',
            text:'чернетка · '+dr.length+(dr.length===1?' поле':' поля/полів')}) : null
        ])
      ]);
      /* Рядки правил лежать під карткою, а не в спливному вікні: на
         телефоні вікно ховає те, заради чого його відкрили. */
      if(st.all.length){
        const det=el('details',{class:'acc',style:'margin:0'},[
          el('summary',{text:'Що сказали правила ('+st.all.length+')'}),
          el('div',{class:'accbody'}, st.all.map(line))
        ]);
        card.append(det);
      }
      listBox.append(card);
    }
    if(!shown) listBox.append(el('p',{class:'sub',text:'У цьому фільтрі порожньо.'}));
  };

  const chips = el('div',{class:'tabs'});
  const mkChip = (key,label)=>{
    const b=el('button',{text:label,'aria-pressed':String(S.efilter===key),
      onclick:()=>{ S.efilter=key;
        for(const x of chips.children) x.setAttribute('aria-pressed',String(x===b));
        drawList(); }});
    chips.append(b); return b;
  };
  mkChip('all','Усі ('+S.SCEN.length+')');
  mkChip('err','✗ ('+C.e+')');
  mkChip('warn','⚠ ('+C.w+')');

  const headLine = r
    ? el('p',{class:'eline',style:'color:'+(r.err?TONE.err:TONE.ok),
        text:(r.err?'✗':'✓')+' підсумок правил: ✓'+r.ok+' · ⚠'+r.warn+' · ✗'+r.err})
    : el('p',{class:'eline',style:'color:'+TONE.err,
        text:'✗ Правила не завантажились: tools/ae_rules.js не прочитано.'});

  put(root,
    el('div',{class:'top'},[
      el('div',{class:'toprow'},[backBtn('назад',()=>{S.screen='settings';render()})]),
      el('h1',{class:'toptitle',text:'Редактор даних'})
    ]),
    el('p',{class:'sub',style:'margin:0 0 4px',text:
      'Судяться дані, які застосунок зараз завантажив, разом із незбереженими '+
      'правками. Збірка '+(S.cfg.build||'—')+'.'}),
    headLine,
    /* Стан чернетки називається на самому екрані, а не тільки на картках:
       людина мусить бачити, що вердикт угорі порахований НЕ по файлу. */
    Object.keys(S.edraft).length
      ? el('p',{class:'eline',style:'color:var(--soft)',text:
          'Незбережених правок: сценаріїв '+Object.keys(S.edraft).length+'.'})
      : null,
    PubBar(),
    el('p',{class:'sub',style:'margin:6px 0 14px;font-size:12.5px',text:
      'Картка називає тільки проблеми. Рядки ✓ стосуються всіх даних '+
      'разом, тому лежать у «Загальних» — «без зауважень» на картці '+
      'означає, що про неї не сказано нічого.'}),
    chips,
    el('details',{class:'acc'},[
      el('summary',{text:'Загальні рядки ('+spread.general.length+')'}),
      el('div',{class:'accbody'}, spread.general.map(line))
    ]),
    listBox
  );
  drawList();
}

/* ── КАРТКА СЦЕНАРІЮ · Р-1б + Р-2 ─────────────────────────────────
   Поля одного сценарію з живим вироком правил. Форма НІЧОГО НЕ ПИШЕ:
   ані у файл, ані в localStorage. Правка лягає в S.edraft (памʼять),
   публікація — окремий крок Р-1в, і доти екран мусить казати це
   словами, а не мовчати.

   ⚠ ЩО ТУТ НЕ ПРАВИТЬСЯ І ЧОМУ (12.12-и). Після Р-1г-1 read-only лишились
   чотири поля: id · no · cats · main. Коди (order · bv · bm) правляться
   вибором із пулу чинних cats — текстове поле дало б висячий код і ✗ у
   правилах. cats і main показані, але не правляться: зміна категорії
   рухає пул під уже обраними кодами, і це окремий предмет (Р-1г-2).
   Показані вони тому, що картка без них виглядала б повною, не
   будучи такою.

   goal лежить поза REQ: правила про нього мовчать. Підписано на
   екрані — інакше порожній вирок читався б як схвалення тексту. */
/* ── СМУГА ПУБЛІКАЦІЇ ─────────────────────────────────────────────────
   Один рядок стану й не більше однієї дії. Кнопка запису зʼявляється
   ТІЛЬКИ на зеленій звірці: кнопка, яка стоїть завжди й іноді відмовляє,
   вчить тиснути її наосліп. */
function PubBar(){
  const box = el('div',{class:'pubbar'});
  if(!pubReady()){
    box.append(el('p',{class:'publine',style:'color:var(--soft)',text:
      'Публікація недоступна: у config.json не оголошено editEndpoint або '+
      'sourceApi. Адреса не вгадується — це навмисно.'}));
    return box;
  }
  const st = S.epub || {state:'busy', text:'Звіряємо з репозиторієм…'};
  /* 'code' — запису не сталось через ключ (порожній або відхилений
     воркером). Не 'fail': після fail пропонують звірити ще раз, а тут
     звірка ні до чого — вона зелена, і зайве перечитування палить
     ліміт 60/год, з якого живе замок. */
  const TONE = {ok:'var(--vtm)', busy:'var(--soft)', stale:'var(--loss)',
                fail:'var(--loss)', conflict:'var(--loss)', code:'var(--loss)'};
  box.append(el('p',{class:'publine',style:'color:'+(TONE[st.state]||'var(--soft)'),
    text:(st.state==='ok'?'✓ ':st.state==='busy'?'… ':'✗ ')+st.text}));
  for(const l of (st.lines||[]))
    box.append(el('p',{class:'publine',style:'color:var(--soft)',text:l}));

  const n = Object.keys(S.edraft).length;
  /* Писати можна на зеленій звірці — і після відмови по ключу: звірка від
     неправильного коду не псується, псується тільки спроба запису. */
  const canWrite = (st.state==='ok' || st.state==='code') && S.esnap && n;

  /* Поле ключа зʼявляється рівно разом із кнопкою запису. Поле для секрету
     на екрані, який писати не може (stale · conflict · відмова читання),
     вчить вводити ключ наосліп — і саме такий ввід потім не мають куди
     подіти, крім збереження «щоб не набирати щоразу». */
  if(canWrite){
    box.append(el('label',{class:'field',style:'margin:8px 0 4px'},[
      el('span',{text:'Код редактора'}),
      /* ⚠ autocomplete:'off' і без name — щоб iOS не пропонував покласти
         ключ у Keychain. Диск телефона — це рівно те, від чого код тікає
         (див. EDITKEY). Пропозицію Safari все одно може показати; відмова
         від неї лишається рішенням людини, але просимо ми зберігати. */
      el('input',{type:'password', value:EDITKEY.code, autocomplete:'off',
        placeholder:'ключ запису', oninput:e=>{ EDITKEY.code=e.target.value; }})]));
    box.append(el('p',{class:'publine',style:'color:var(--soft);margin-bottom:8px',
      text:'Це НЕ код куратора. Код куратора відмикає екран, цей — запис '+
           'у репозиторій. Ніде не зберігається: закриєте вкладку — введете знову.'}));
  }

  const row = el('div',{style:'display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px'});
  if(canWrite)
    row.append(el('button',{class:'btn',style:'padding:8px 14px;font-size:14px',
      text:'Опублікувати правки ('+n+')', onclick:publish}));
  if(st.state==='fail'||st.state==='conflict'||st.state==='stale')
    row.append(el('button',{class:'btn ghost',style:'padding:8px 14px;font-size:14px',
      text:'Звірити ще раз', onclick:()=>{
        S.epub=null; S.esnap=null; loadSnap(); render(); }}));
  if(row.children.length) box.append(row);
  return box;
}

function ScenCard(root){
  /* Ті самі двері, що й у списку: екран за кодом куратора не має пускати
     повз себе через повернення назад у PWA. */
  if(!CURATOR.open){ S.screen='settings'; render(); return; }
  const id = S.escen;
  const rec = id===null ? null : recOf(id);
  /* Ключ без запису — не аварія, а вихід зі стану, якого вже немає
     (дані перезавантажились під відкритою карткою). */
  if(!rec){ S.screen='edit'; render(); return; }

  const SIGN={ok:'✓',warn:'⚠',err:'✗'};
  const TONE={ok:'var(--vtm)',warn:'var(--soft)',err:'var(--loss)'};
  const line = m => el('div',{class:'tapeline'},[
    el('span',{style:'color:'+TONE[m.lvl],text:SIGN[m.lvl]+' '+m.msg})]);

  /* Межа і перелік ознак приїжджають З ПРАВИЛ. Число 90 і вісім
     формулювань, переписані сюди, були б другим домом (12.11): вони
     розійшлися б із перевіркою рівно тоді, коли зʼявиться девʼята. */
  const LIMIT = (typeof AE_RULES!=='undefined') ? AE_RULES.MOOD_LIMIT : null;
  const SIGNS = ((typeof AE_RULES!=='undefined') && AE_RULES.MOOD_SIGNS) || [];

  const verdBox  = el('div',{class:'everd'});
  const countEl  = el('span',{class:'ecount'});
  const dirtyBox = el('div',{style:'display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 14px'});
  const marks = {};          // поле → значок «змінено»

  /* Один перерахунок на кожен ввід. Замір: повний прогін правил на 43
     сценаріях — близько 5 мс; дебаунс тут був би вікном, у якому екран
     показує вирок про попередню літеру. */
  const refresh = ()=>{
    const SC = scenAll();
    const r  = runRules(null, SC);
    const ids = new Set(SC.map(x=>String(x.id)));
    const my = r ? (spreadVerdict(r.out, ids).byId.get(id) || []) : null;

    verdBox.innerHTML='';
    if(!r){
      verdBox.append(el('p',{class:'eline',style:'color:'+TONE.err,
        text:'✗ Правила не завантажились: tools/ae_rules.js не прочитано.'}));
    } else if(!my.length){
      /* Не ✓: правила про цей сценарій не сказали нічого, і галочка була б
         підписом, якого ніхто не ставив (S22 §4.1). */
      verdBox.append(el('p',{class:'eline',style:'color:'+TONE.ok,
        text:'Без зауважень — про цей сценарій правила не сказали нічого.'}));
    } else {
      verdBox.append(el('p',{class:'sub',style:'margin:0 0 6px;font-size:12.5px',
        text:'Що правила кажуть про цей сценарій ('+my.length+'):'}));
      for(const m of my) verdBox.append(line(m));
    }

    const mood = String(recOf(id).mood||'');
    countEl.textContent = LIMIT===null || LIMIT===undefined
      ? 'межу не прочитано' : mood.length+' / '+LIMIT;
    countEl.className = 'ecount' + ((LIMIT && mood.length>LIMIT) ? ' over' : '');

    const dr = draftFields(id);
    for(const k of Object.keys(marks)) marks[k].style.display = dr.includes(k) ? '' : 'none';
    dirtyBox.innerHTML='';
    if(dr.length){
      dirtyBox.append(el('span',{class:'echip',text:'змінено: '+dr.join(' · ')}));
      dirtyBox.append(el('button',{class:'btn ghost',style:'padding:6px 12px;font-size:13.5px',
        text:'Скинути правки', onclick:()=>{ delete S.edraft[id]; render(); }}));
    }
  };

  /* Поле = підпис + значок «змінено» + сам ввід. Значок ставиться поруч
     із полем, а не тільки в підсумку внизу: людина, яка гортає форму,
     не бачить підсумку.

     ⚠ ОБГОРТКА — НЕ ЗАВЖДИ <label> (S26, девайс). <label> без for
     передає клік ПЕРШОМУ контролу всередині себе. Для поля з одним
     вводом це і є потрібна поведінка: тицьнув будь-де в рядок — потрапив
     у поле. Для вибірника з одинадцятьма чекбоксами той самий механізм
     означає, що дотик до порожнього місця праворуч від підпису знімає
     галку з першої позиції — при закритому списку, ніде її не показуючи.
     Плюс <label class=pickitem> всередині був би вкладеним label, чого
     HTML не дозволяє. Тому контейнер, що тримає більше одного контролу,
     приходить тегом 'div'. */
  const field = (key, label, node, hint, wrap)=>{
    const mark = el('span',{class:'echip',text:'змінено',style:'display:none'});
    marks[key]=mark;
    return el(wrap||'label',{class:'field'},[
      el('span',{class:'flab'},[el('b',{text:label}), mark]),
      node, hint||null ]);
  };
  const textField = (key,label,multi,hint,extraOnInput)=>{
    const n = el(multi?'textarea':'input', multi?{rows:'3'}:{type:'text'});
    n.value = rec[key]===undefined||rec[key]===null ? '' : String(rec[key]);
    n.addEventListener('input', e=>{ setDraft(id,key,e.target.value);
      if(extraOnInput) extraOnInput(e.target.value); refresh(); });
    return field(key,label,n,hint);
  };
  /* Вибір, а не текст: перелік характерів має один дім — носій
     prompts/characters.md, розібраний у boot(). Третього розбору тут
     немає (12.11-а). Те саме міркування слабше стосується grp: група,
     набрана руками, тихо розколює наявну на дві. */
  const selField = (key,label,values,hint)=>{
    const cur = rec[key]===undefined||rec[key]===null ? '' : String(rec[key]);
    const opts = values.includes(cur) ? values : [cur, ...values];
    const n = el('select',{}, opts.map(v=>el('option',{value:v,text:v||'—'})));
    n.value = cur;
    n.addEventListener('change', e=>{ setDraft(id,key,e.target.value); refresh(); });
    return field(key,label,n,hint);
  };

  /* ── ВИБІРНИК КОДІВ · Р-1г-1 ──────────────────────────────────────
     order · bv · bm — переліки кодів каталогу. Текстовий ввід тут дав би
     висячий код і ✗ у правилах (ae_rules.js:88), тому ввід ТІЛЬКИ вибором.

     Пул — позиції ЧИННИХ cats сценарію, і люка «взяти щось із чужої
     групи» немає свідомо: чесний спосіб узяти чужу позицію — додати
     категорію, а cats цим кроком ще не правиться. Екран каже цю межу
     словами замість того, щоб мовчки не мати потрібного рядка.

     ⚠ Обробник НЕ кличе render(). Повне перемальовування згорнуло б
     <details> і скинуло прокрутку списку: людина, що ставить другу
     галку, поверталась би на початок. Тому локальний draw() + refresh(),
     як у полів тексту. */
  const pool = (rec.cats||[]).flatMap(k => S.CAT[k] || []);
  const poolSet = new Set(pool.map(i=>i.c));
  const catNames = (rec.cats||[]).map(k => S.LABEL[k] || k).join(' · ');

  const codeField = (key, label) => {
    const box  = el('div',{class:'pick'});
    const sel  = el('div',{class:'picksel'});
    const list = el('div',{class:'picklist'});
    const cur  = () => { const v = recOf(id)[key]; return Array.isArray(v) ? v.slice() : []; };

    /* Набір рядків рахується ОДИН раз, на відкритті картки, і містить пул
       плюс уже обране, що в пул не входить. Без другої частини код, який
       у даних є, а в пулі його немає, не мав би чим зніматись — галки для
       нього просто не було б на екрані. Набір сталий: зняте не зникає з
       переліку, інакше зняти й повернути було б неможливо. */
    const extra = cur().filter(c => !poolSet.has(c))
      .map(c => S.ALL[c] || {c, n:'позиція не знайдена в каталозі', b:0});
    const rows = [...pool, ...extra];

    const boxes = [];
    for(const it of rows){
      const cb = el('input',{type:'checkbox'});
      cb.addEventListener('change', () => toggle(it.c, cb.checked));
      boxes.push([it.c, cb]);
      list.append(el('label',{class:'pickitem'},[
        cb,
        el('span',{class:'pn', text: it.n}),
        el('span',{class:'pc', text: it.c + (poolSet.has(it.c) ? '' : ' · поза cats')
          + ' · ' + uah(it.b) + ' ₴'})
      ]));
    }

    /* Число під bv/bm — ЧИСЛО, не вирок. Береться bonusOf, що вже живе на
       сторінці (розділ «Гроші»), другого дому арифметики тут немає. Вирок
       про приріст каже правило, і його рядок стоїть нижче у вердикті;
       підпис «мало/досить» тут був би другою оцінкою того самого. */
    const gain = key==='order' ? null : el('p',{class:'pickgain'});

    const draw = () => {
      const v = cur();
      sel.innerHTML = '';
      if(!v.length) sel.append(el('span',{class:'pickno',text:'нічого не обрано'}));
      for(const c of v)
        sel.append(el('span',{class:'echip', text: S.ALL[c] ? S.ALL[c].n : c}));
      for(const [c,cb] of boxes) cb.checked = v.includes(c);
      if(gain){
        const o = recOf(id).order || [];
        gain.textContent = 'бонус обраного ' + uah(bonusOf(v)) + ' ₴ · замовлення '
          + uah(bonusOf(o)) + ' ₴ · різниця ' + uah(bonusOf(v) - bonusOf(o)) + ' ₴';
      }
    };

    /* Порядок наявних кодів зберігається: нове дописується в кінець, зняте
       вирізається на місці. Якби обране писалось у порядку каталогу, то
       відкрити картку й торкнутись будь-чого означало б перетасувати
       масив у файлі — диф, якого ніхто не просив, у коміті з чужим ім'ям. */
    const toggle = (c, on) => {
      const v = cur();
      const i = v.indexOf(c);
      if(on && i < 0) v.push(c);
      if(!on && i >= 0) v.splice(i, 1);
      setDraft(id, key, v);
      draw(); refresh();
    };

    box.append(sel);
    /* ⚠ Смуга обраного ховається, доки список відкритий (S26, девайс).
       Вона стоїть НАД списком, і кожна нова галка додає їй рядок — тобто
       посуває вниз рівно те, у що людина цілиться пальцем. Поки список
       відкритий, стан обраного видно самими галками, і смуга дублювала б
       його ціною стрибка. Ховається на подію toggle, а не через :has():
       :has() у Safari молодший за пристрої, на яких це має працювати. */
    const det = el('details',{class:'acc',style:'margin:0'},[
      el('summary',{text:'Обрати — доступно ' + plural(rows.length,'позиція','позиції','позицій')}),
      el('div',{class:'accbody',style:'padding-bottom:6px'},[list])
    ]);
    det.addEventListener('toggle', ()=>{ sel.style.display = det.open ? 'none' : ''; });
    box.append(det);
    if(gain) box.append(gain);
    draw();
    return field(key, label, box, null, 'div');
  };

  const chars = Object.keys(S.P.chars||{});
  const grps  = [...new Set(S.SCEN.map(x=>x.grp).filter(Boolean))];

  /* ⚠ ШТОРКА (Р-1б-2). Вісім ознак читаються один раз, а місце займають
     щоразу — девайс-тест назвав екран правильним, але шумним. Складено під
     <details>, а НЕ прибрано: querySelectorAll бачить .ehint li і в
     згорнутому стані, тож твердження гейта про «ознаки дослівно з
     AE_RULES.MOOD_SIGNS» лишається чинним. Перевірено прогоном. */
  const moodHint = el('details',{class:'acc'},[
    el('summary',{text:'Що саме перевіряє правило ('+SIGNS.length+')'}),
    el('div',{class:'accbody'},[
      el('ul',{class:'ehint'}, SIGNS.map(t=>el('li',{text:t}))),
      SIGNS.length ? null : el('p',{class:'ehint',
        text:'Перелік ознак не прочитано з правил.'})
    ])
  ]);

  const ro = (label,val)=>el('div',{class:'tapeline'},[
    el('span',{text:label}), el('span',{text: val===undefined||val===null||val===''
      ? '—' : (Array.isArray(val)? (val.length?val.join(', '):'—') : String(val))})]);

  put(root,
    el('div',{class:'top'},[
      el('div',{class:'toprow'},[backBtn('до списку',()=>{S.screen='edit';render()})]),
      el('h1',{class:'toptitle',text:'#'+id+' · '+(rec.title||'без назви')})
    ]),
    el('p',{class:'enote',text:
      'Правки живуть у цій сесії. Публікація — у списку редактора, однією '+
      'кнопкою на всі змінені сценарії: файл пишеться цілком.'}),
    dirtyBox,

    textField('title','Назва',false),
    selField('grp','Група',grps,
      el('p',{class:'ehint',text:'Перелік — з наявних груп. Нову групу цією формою не завести.'})),
    selField('character','Характер',chars,
      el('p',{class:'ehint',text:'Перелік — з носія характерів. Значення поза ним зупиняє старт застосунку.'})),
    textField('who','Хто це (who)',false),
    textField('mode','Режим видачі (mode)',false),
    textField('open','Перша репліка (open)',true),
    textField('goal','Мета розмови (goal)',true,
      el('p',{class:'ehint',text:'Поза REQ: правила про це поле нічого не кажуть.'})),

    (()=>{ const f=textField('mood','Настрій дня (mood)',true,moodHint);
      f.querySelector('.flab').append(countEl); return f; })(),

    /* Межа названа один раз на всі три поля, а не тричі під кожним:
       причина в них спільна, і три копії одного пояснення читались би
       як три різні обмеження. */
    el('p',{class:'enote',text:
      'Три поля нижче беруть коди з категорій цього сценарію'+
      (catNames ? ' (' + catNames + ')' : '') + '. Щоб узяти позицію з іншої '+
      'групи, треба спершу додати категорію — cats цією формою поки не правиться.'}),
    codeField('order','Замовлення (order)'),
    codeField('bv','Ідеал ВТМ (bv)'),
    codeField('bm','Ідеал СТМ (bm)'),

    verdBox,

    (()=>{
      /* Перелік і число — з одного місця. Число, написане рукою, замерзне
         брехнею на кроці, який забере звідси cats і main (S25 §4.3). */
      const roRows = [
        ['id', rec.id],
        ['no (номер замовлення)', rec.no],
        ['cats', rec.cats],
        ['main', rec.main]
      ];
      return el('details',{class:'acc',style:'margin-top:18px'},[
        el('summary',{text:'Не правиться тут ('+plural(roRows.length,'поле','поля','полів')+')'}),
        el('div',{class:'accbody'},[
          el('p',{class:'enote',style:'margin-bottom:8px',text:
            'Номери й категорії. Категорія задає пул, з якого беруться коди, '+
            'тому її правка рухає вибір під трьома полями вище — це окремий крок.'}),
          el('div',{class:'ero'}, roRows.map(([l,v])=>ro(l,v)))
        ])
      ]);
    })()
  );
  refresh();
}

function Gate(root){
  let n='', a='';
  const go=()=>{
    if(!n.trim()||!a.trim())return;
    S.me={name:n.trim(),pharmacy:a.trim()};
    localStorage.setItem('ae_me',JSON.stringify(S.me));
    S.screen='picker'; render();
  };
  put(root,
    el('h1',{class:'lede',text:'Тренажер інтернет-замовлень'}),
    el('p',{class:'sub',text:'Перш ніж почати — представтесь. Це потрібно, щоб куратор бачив ваші результати.'}),
    el('label',{class:'field'},[el('span',{text:'Ім’я та прізвище'}),
      el('input',{oninput:e=>n=e.target.value, onkeydown:e=>e.key==='Enter'&&go()})]),
    el('label',{class:'field'},[el('span',{text:'Аптека'}),
      el('input',{placeholder:'напр. 67, Калинова 1', oninput:e=>a=e.target.value, onkeydown:e=>e.key==='Enter'&&go()})]),
    el('button',{class:'btn',onclick:go,text:'Далі'}),
    /* Марка збірки. Значення тільки з config.json: зашитий у код номер
       перестають оновлювати вже на другій видачі, і марка починає брехати. */
    el('p',{class:'sub',style:'margin-top:22px;font-size:12px',
      text:'Збірка '+(S.cfg.build||'—')})
  );
}

function Picker(root){
  const groups=['Усі',...new Set(S.SCEN.map(s=>s.grp))];
  const list = S.group==='Усі' ? S.SCEN : S.SCEN.filter(s=>s.grp===S.group);
  put(root,
    el('h1',{class:'lede',text:'Вітаю, '+S.me.name.split(' ')[0]}),
    el('p',{class:'sub',text:'Оберіть замовлення для тренування — або відпрацюйте цілу зміну з '+S.cfg.shiftSize+' замовлень поспіль.'}),
    (!MOCK && !KEY.get() && !S.cfg.model.workerReady)
      ? el('div',{class:'err',html:'<b>Модель не підключена.</b> Сервер ще не налаштований, '
          +'а ключа в браузері немає. Відкрийте «Налаштування».'}) : null,
    el('div',{style:'margin-bottom:20px;display:flex;gap:8px;flex-wrap:wrap'},[
      el('button',{class:'btn',text:'Почати зміну ('+S.cfg.shiftSize+' замовлень)',onclick:()=>{
        S.shift={queue:pickShift(S.cfg.shiftSize),i:0,rows:[]};
        openScenario(S.shift.queue[0]);
      }}),
      el('button',{class:'btn ghost',text:'Налаштування',onclick:()=>{S.screen='settings';render()}}),
      el('button',{class:'btn ghost',text:'Змінити ім’я',onclick:()=>{
        localStorage.removeItem('ae_me'); S.me=null; S.screen='gate'; render();
      }})
    ]),
    el('div',{class:'tabs'}, groups.map(g=>el('button',{
      'aria-pressed':String(g===S.group), onclick:()=>{S.group=g;render()},
      text: g+' ('+(g==='Усі'?S.SCEN.length:S.SCEN.filter(s=>s.grp===g).length)+')'
    }))),
    el('div',{class:'grid'}, list.map(s=>el('button',{class:'card',onclick:()=>{S.shift=null;openScenario(s)}},[
      el('span',{class:'ord',text: s.no ? 'Замовлення № '+s.no : 'Без номера — оформлення на місці'}),
      el('h3',{text:s.title}),
      el('p',{text:s.who+' · '+s.mode}),
      el('div',{class:'cardfoot'},[
        el('span',{text:(s.order.length||'—')+' поз. · орієнтир '+potential(s)+' ₴'}),
        s.trap?el('span',{class:'trap',text:'пастка'}):s.noSale?el('span',{class:'trap',text:'не міняти'}):null
      ])
    ])))
  );
}

function openScenario(sc){
  S.sc=sc; S.cart=sc.order.slice(); S.history=[]; S.ended=false; S.feedback=''; S.waiting=false;
  S.attempt=1; S.phrase=''; S.judging=false;
  S.screen='game'; render();
}

function Game(root){
  const sc=S.sc, pot=potential(sc);
  let draft='';

  const log = el('div',{class:'log'});
  const paint = ()=>{
    log.innerHTML='';
    log.append(el('div',{class:'turn client'},[el('span',{class:'who',text:'КЛІЄНТ'}),el('span',{text:sc.open})]));
    for(const m of S.history)
      log.append(el('div',{class:'turn '+(m.role==='user'?'me':'client')},[
        el('span',{class:'who',text:(m.role==='user'?'ВИ':'КЛІЄНТ')
          + (STEP && m.step ? ' · '+m.step : '')}),
        el('span',{text:m.content})]));
    if(S.waiting) log.append(el('div',{class:'turn client'},[
      el('span',{class:'who',text:'КЛІЄНТ'}),
      el('span',{class:'dots',html:'<i></i><i></i><i></i>'})]));
    if(S.ended){
      log.append(el('div',{class:'turn sys',text:'— розмову завершено —'}));
      /* Числа стоять у самій шапці розбору. Похвала поруч із «приріст 0
         з 21 ₴» видна одразу — і людині, і тому, хто читає скріншот. */
      const d0=bonusOf(S.cart)-bonusOf(sc.order);
      const head = sc.noSale
        ? 'РОЗБІР · правильна дія — не міняти'
        : 'РОЗБІР · приріст '+uah(d0)+' з '+pot+' ₴';
      if(S.judging) log.append(el('div',{class:'turn review'},[
        el('span',{class:'who',text:'РОЗБІР'}),
        el('span',{class:'dots',html:'<i></i><i></i><i></i>'})]));
      else if(S.feedback) log.append(el('div',{class:'turn review'},[
        el('span',{class:'who',text:head}),
        el('span',{text:S.feedback}),
        S.phrase ? el('span',{class:'phrase'},[
          el('b',{text:'Варто було сказати: '}), el('span',{text:'«'+S.phrase+'»'})]) : null
      ]));
    }
    hint.classList.toggle('hide', S.history.length>0 || S.ended);
    /* Після «розмову завершено» send() усе одно нічого не робив, але поле
       й кнопка виглядали робочими — людина пише репліку в нікуди. Орган
       керування, який нічого не робить, мусить це показувати. */
    ta.disabled = S.ended; btn.disabled = S.ended || S.waiting;
    ta.placeholder = S.ended ? 'Розмову завершено' : 'Що ви кажете клієнтові…';
    log.scrollIntoView({block:'end'});
  };
  const hint = el('p',{class:'chat-hint',
    text:'Відповідайте своїми словами — так, як сказали б за касою.'});

  const send = async ()=>{
    const line=draft.trim(); if(!line||S.ended)return;
    S.history.push({role:'user',content:line});
    draft=''; ta.value=''; btn.disabled=true; S.waiting=true; paint();
    try{
      const r = await engine.turn(sc, S.history);
      S.waiting=false;
      /* Щабель кладемо в сам елемент історії: у модель їдуть тільки
         role і content (engineLive.turn), тому зайвий ключ до промпта
         не потрапляє, а до рендера потрапляє. Окремий масив зайвий. */
      S.history.push({role:'assistant',content:r.reply,step:r.step||''});
      S.cart = r.cart;
      S.ended = r.ended; S.feedback = r.feedback||''; S.phrase='';
      paint(); tape();
      if(S.ended){
        showEnd(true);
        /* Розбір — окремий виклик. Кнопки кінця показуємо ОДРАЗУ, не чекаючи
           на суддю: людина не мусить сидіти замкненою, доки той думає. */
        if(engine.judge){
          S.judging=true; paint();
          try{
            const j = await engine.judge(sc, S.history, S.cart);
            S.feedback = j.feedback || S.feedback; S.phrase = j.phrase || '';
          }catch(e){
            /* Суддя мовчить — лишаємо те, що сказав клієнт, і кажемо чесно,
               що розбір не дійшов. Розмова й рахунок від цього не залежать. */
            if(!S.feedback) S.feedback = 'Розбір не вдався: '+e.message;
          }finally{ S.judging=false; paint(); }
        }
      }
    }catch(e){
      root.prepend(el('div',{class:'err',text:'Двигун відповів помилкою: '+e.message}));
    }finally{ btn.disabled=false; S.waiting=false; paint(); }
  };

  /* Enter надсилає — але тільки там, де є миша. На телефоні Enter у
     textarea — це новий рядок, і відібрати його означало б забрати
     єдиний спосіб написати дві фрази підряд.
     Shift+Enter лишає новий рядок скрізь: це той самий жест, що в
     месенджерах, і людина не мусить його вчити тут заново.
     ⌘/Ctrl+Enter працює всюди, як і працював, — на випадок, коли ознака
     вказівника промахнулась.
     ⚠ preventDefault обовʼязковий: без нього надіслана репліка лишає в
     полі порожній рядок, і наступна починається з переносу.
     ⚠ isComposing — Enter, яким підтверджують ієрогліф чи діакритику в
     системному вводі, не є надсиланням. */
  const ta = el('textarea',{placeholder:'Що ви кажете клієнтові…',oninput:e=>draft=e.target.value,
    onkeydown:e=>{
      if(e.key!=='Enter' || e.isComposing || e.shiftKey) return;
      if(e.metaKey || e.ctrlKey || POINTER_FINE){ e.preventDefault(); send(); }
    }});
  const btn = el('button',{class:'btn',text:'Сказати',onclick:send});

  /* ── стрічка чека ── */
  const tapeBox = el('div',{class:'tape'});
  const tape = ()=>{
    const base=bonusOf(sc.order), now=bonusOf(S.cart), delta=now-base;
    const dcol = delta<0?'var(--loss)':delta>0?'var(--vtm)':'var(--ink)';
    tapeBox.innerHTML='';
    tapeBox.append(el('h4',{text:'Чек'}));
    if(!S.cart.length) tapeBox.append(el('p',{class:'sub',style:'font-size:13px;margin:0 0 10px',text:'порожньо'}));
    for(const c of S.cart){
      const it=S.ALL[c]; if(!it)continue;
      tapeBox.append(el('div',{class:'tapeline'},[
        el('span',{html: it.n + '<span class="tag '+(it.k==='ВТМ'?'t-vtm':it.k==='ЗФ'?'t-zf':'t-none')+'">'+(it.k||'—')+'</span>'}),
        el('span',{class:'num',text:uah(it.b)})
      ]));
    }
    tapeBox.append(
      el('div',{class:'tapeline'},[el('span',{text:'Було в замовленні'}),el('span',{class:'num',text:uah(base)})]),
      el('div',{class:'tapeline total'},[el('span',{text:'Стало'}),el('span',{class:'num',text:uah(now)})]),
      el('div',{class:'tapeline total'},[
        el('span',{text:'Приріст розмови'}),
        el('span',{class:'num big',style:'color:'+dcol,text:(delta>0?'+':'')+uah(delta)+' ₴'})]),
      el('div',{class:'tapeline',style:'color:var(--soft)'},[
        el('span',{text:'Орієнтир'}),el('span',{class:'num',text:pot+' ₴'})])
    );
  };

  /* Розмову можна пройти ще раз, не виходячи в список. Без цього єдиний
     шлях повторити сценарій — вийти й зайти, і рахунок спроб губиться.
     Спроби рахуються: куратор має бачити «з другої», а не рівний результат. */
  const retryBtn = el('button',{class:'btn ghost hide',style:'margin-top:14px',
    text:'Пройти ще раз', onclick:()=>{
      S.history=[]; S.cart=sc.order.slice(); S.ended=false; S.feedback='';
      S.waiting=false; S.attempt++; S.phrase=''; S.judging=false;
      showEnd(false); paint(); tape();
    }});
  const showEnd = (on)=>{
    finishBtn.classList.toggle('hide', !on);
    retryBtn.classList.toggle('hide', !on);
  };

  const finishBtn = el('button',{class:'btn hide',style:'margin-top:14px',
    text: S.shift ? 'Наступне замовлення' : 'До списку', onclick:()=>{
      if(S.shift){
        const delta=bonusOf(S.cart)-bonusOf(sc.order);
        S.shift.rows.push({sc,delta,pot,fb:S.feedback,tries:S.attempt});
        S.shift.i++;
        if(S.shift.i<S.shift.queue.length) openScenario(S.shift.queue[S.shift.i]);
        else { S.screen='result'; render(); }
      } else { S.screen='picker'; render(); }
    }});

  /* ── ПАНЕЛЬ ПЕРЕВІРКИ (тільки крок 1, зникає на кроці 2) ── */
  const mock = !MOCK ? null : el('div',{class:'mock'},[
    el('h4',{text:'Панель перевірки · крок 1'}),
    el('p',{text:'Живої моделі ще немає. Тут ви руками складаєте чек так, ніби клієнт погодився — щоб перевірити, що приріст рахується правильно. На кроці 2 ця панель зникне.'}),
    el('div',{class:'mockcols'}, poolOf(sc).map(it=>{
      const id='m_'+it.c;
      return el('label',{for:id},[
        el('input',{type:'checkbox',id,...(S.cart.includes(it.c)?{checked:'checked'}:{}),
          onchange:e=>{
            S.cart = e.target.checked ? [...S.cart,it.c] : S.cart.filter(x=>x!==it.c);
            tape();
          }}),
        el('span',{text:' '+it.n+' · '+uah(it.b)+' ₴ · '+(it.k||'—')})
      ]);
    }))
  ]);

  /* Брифінг. Порядок рядків: спершу чотири однорядкові факти, у хвості —
     два довгі, «Настрій» і «Ціль». Вони сусіди навмисно: обидва згортані,
     і два керовані рядки поруч читаються як один блок, а не як два
     випадкові шеврони посеред таблиці. */
  const briefDl = el('dl',{},[
    el('dt',{text:'Номер'}), el('dd',{text: sc.no ? '№ '+sc.no : 'без номера, оформлення на місці'}),
    el('dt',{text:'Клієнт'}), el('dd',{text:sc.who}),
    el('dt',{text:'Умови'}), el('dd',{text:sc.mode}),
    el('dt',{text:'Категорії'}), el('dd',{text:sc.cats.map(k=>S.LABEL[k]||k).join(' · ')}),
    el('dt',{text:'Настрій'}), el('dd',{text:sc.mood}),
    el('dt',{text:'Ціль'}), el('dd',{text:sc.goal||'—'})
  ]);
  foldRows(briefDl,['Настрій','Ціль']);

  put(root,
    el('div',{class:'top'},[
      el('div',{class:'toprow'},[
        backBtn('до списку',()=>{S.shift=null;S.screen='picker';render()}),
        S.shift?el('span',{class:'ord',text:'замовлення '+(S.shift.i+1)+' з '+S.shift.queue.length}):null
      ]),
      el('h2',{class:'toptitle',text:sc.title})
    ]),
    el('div',{class:'stage'},[
      el('div',{},[
        el('div',{class:'brief'},[briefDl]),
        el('div',{class:'chat'},[
          el('div',{class:'chat-body'},[
            el('div',{class:'chat-h'},[el('span',{text:'Розмова'})]),
            log,
            hint
          ]),
          el('div',{class:'say'},[ta,btn])
        ]),
        el('div',{style:'display:flex;gap:8px;flex-wrap:wrap'},[finishBtn,retryBtn]),
        mock
      ]),
      tapeBox
    ])
  );
  paint(); tape();
}

function Result(root){
  const rows=S.shift.rows, scored=rows.filter(r=>!r.sc.noSale);
  const debriefBox = el('div',{class:'brief',style:'max-width:640px;margin-top:18px'},
    [el('p',{class:'sub',style:'margin:0',text: MOCK
      ? 'Заглушка: у робочому режимі тут зʼявиться розбір від наставника.'
      : 'Наставник читає вашу зміну…'})]);
  const bullets=(t,arr)=>(arr&&arr.length)?el('div',{style:'margin-top:14px'},[
      el('div',{class:'who',text:t}),
      el('ul',{style:'margin:4px 0 0;padding-left:20px'}, arr.map(x=>el('li',{text:x})))]):null;
  if(!MOCK) engineLive.debrief(rows).then(d=>{
    debriefBox.innerHTML='';
    debriefBox.append(
      el('p',{style:'margin:0 0 4px',text:d.overall}),
      bullets('ЩО ПОВТОРЮЄТЬСЯ', d.mistakes),
      bullets('ЩО ВИЙШЛО', d.strengths),
      bullets('НА НАСТУПНИЙ РАЗ', d.rules));
    S.shift.curatorNote = d.curator;
  }).catch(e=>{
    debriefBox.innerHTML='';
    debriefBox.append(el('p',{style:'margin:0;color:var(--loss)',
      text:'Розбір не вдався: '+e.message+' Результат зміни збережено — його видно вище.'}));
  });
  const got=scored.reduce((a,r)=>a+r.delta,0);
  const pot=scored.reduce((a,r)=>a+r.pot,0)||1;
  const pct=Math.max(0,Math.min(100,Math.round(got/pot*100)));
  const slips=rows.filter(r=>r.delta<0||(r.sc.noSale&&r.delta>0));
  const retries=rows.reduce((a,r)=>a+((r.tries||1)-1),0);
  put(root,
    el('h1',{class:'lede',text:'Зміну завершено'}),
    el('p',{class:'sub',text:S.me.name+' · аптека '+S.me.pharmacy}),
    el('div',{class:'brief',style:'max-width:420px'},[
      el('div',{class:'bignum',style:'color:'+(got>0?'var(--vtm)':'var(--ink)'),
        text:(got>0?'+':'')+uah(got)+' ₴'}),
      el('div',{class:'tapeline'},[el('span',{text:'Орієнтир зміни'}),el('span',{class:'num',text:uah(pot)+' ₴'})]),
      el('div',{class:'tapeline total'},[el('span',{text:'Виконано'}),el('span',{class:'num',text:pct+'%'})]),
      el('div',{class:'tapeline'},[el('span',{text:'Замовлень'}),el('span',{class:'num',text:rows.length})]),
      slips.length?el('div',{class:'tapeline'},[el('span',{class:'trap',text:'Промахів'}),
        el('span',{class:'num trap',text:slips.length})]):null,
      retries?el('div',{class:'tapeline',style:'color:var(--soft)'},[
        el('span',{text:'Повторних спроб'}),el('span',{class:'num',text:retries})]):null
    ]),
    debriefBox,
    el('button',{class:'btn',style:'margin-top:16px',text:'До списку',
      onclick:()=>{S.shift=null;S.screen='picker';render()}})
  );
}

/* Відкриваємо стан назовні: потрібно для смоук-тестів і зручно для дебагу
   (у консолі браузера можна подивитись S.cart, S.sc, S.cfg). */
/* PIN і LIVE віддані назовні навмисно: без них гейт міг би судити пін лише
   грепом по джерелу, а це перевірка тексту, не поведінки. */
window.PIN = PIN; window.LIVE = LIVE;
window.S = S; window.render = render; window.ENGINE = engine;
window.engineLive = engineLive; window.KEY = KEY; window.buildSystem = buildSystem;
window.buildJudge = buildJudge;

/* iOS Safari не застосовує :active, доки на сторінці немає жодного
   слухача дотику. Порожній слухач на документі — умова вмикання:
   без нього весь прес на кнопках і картках мовчить саме на телефоні,
   а на десктопі при цьому працює. Passive — щоб не гальмувати скрол. */
document.addEventListener('touchstart',()=>{},{passive:true});

boot();
</script>
