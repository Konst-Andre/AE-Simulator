<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AE-Simulator">
<meta name="format-detection" content="telephone=no">
<title>AE-Simulator</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F6B4A">
<style>
/* ── Палітра і шрифт. Під брендбук АНЦ міняються лише ці значення. ── */
:root{
  --paper:#F1F4F1; --ink:#16211C; --soft:#5E6E66; --line:#C9D2CB;
  --vtm:#0F6B4A; --zf:#A0761B; --loss:#A8402B; --tape:#FBFCFA;

  /* Радіуси — шкалою, не літералами. Три ролі: велика поверхня,
     орган керування, бульбашка розмови. Підкрутити вигляд усього
     застосунку = змінити тут три числа. */
  --r-lg:16px;   /* картки, brief, чек, помилка, жовта панель */
  --r-md:12px;   /* кнопки, поля, textarea, «назад» */
  --r-bub:14px;  /* репліки в розмові */
  --chat:#E7ECE8;   /* фон панелі розмови: темніший за сторінку й за бульбашку */

  /* Прес. Натиск різкий і короткий, повернення довше і з пружиною —
     тому дві різні тривалості, а не одна. */
  --press-in:90ms; --press-out:280ms;
  --press-ease:cubic-bezier(.34,1.5,.64,1);
}
*{box-sizing:border-box}

/* ── АНТИ-ВЕБ-ПАТЕРН ──────────────────────────────────────────────
   Щоб застосунок не видавав себе за веб-сторінку: без виділення
   тексту пальцем, без меню по довгому натисканню, без сірого
   спалаху по тапу, без гумового відскоку сторінки, без зуму
   подвійним тапом. Поля вводу — виняток, там усе це потрібне. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;overscroll-behavior:none}
body{
  -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
input,textarea{
  -webkit-user-select:text; user-select:text;
  -webkit-touch-callout:default;
}
img{-webkit-user-drag:none;user-drag:none;pointer-events:none}
/* Текст, який має сенс копіювати руками — розбір і репліки клієнта */
.turn,.brief dd,.tape{-webkit-user-select:text;user-select:text}
body{font-family:"Inter","Segoe UI",-apple-system,system-ui,sans-serif;color:var(--ink);
  background:var(--paper);min-height:100dvh;font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:24px 18px calc(60px + env(safe-area-inset-bottom,0px))}
.num{font-family:"SFMono-Regular","Consolas",monospace;font-variant-numeric:tabular-nums}
.hide{display:none !important}

.lede{max-width:60ch;margin:0 0 6px;font-size:27px;font-weight:620;letter-spacing:-.02em}
.sub{max-width:64ch;color:var(--soft);margin:0 0 22px}

button{font:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
/* Ряд фільтрів — один рядок із горизонтальним скролом, а не три абзаци.
   Від'ємні поля прорізають падінг .wrap, щоб ряд ішов від краю екрана
   до краю: інакше він обривається всередині сторінки і читається як
   помилка верстки. Маска гасить чипи саме на краях. */
.tabs{display:flex;flex-wrap:nowrap;gap:6px;margin:0 -18px 16px;padding:2px 18px 4px;
  overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
  /* Снапу тут свідомо НЕМАЄ. На iOS scroll-snap вимикає інерцію скролу
     (WebKit 243582): кожен свайп зупиняється на найближчому чипі, і ряд
     з 7 фільтрів доводиться гортати трьома рухами замість одного кидка.
     Снап доречний каруселі, де кадр мусить стати рівно; список фільтрів
     гортають, а не гортають по кадру. */
  scrollbar-width:none;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%);
          mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;white-space:nowrap;
  font-size:13.5px;padding:6px 13px;border:1px solid var(--line);
  background:#fff;border-radius:20px;cursor:pointer;color:var(--soft);
  transition:transform var(--press-out) var(--press-ease)}
.tabs button:active{transform:scale(.92);transition:transform var(--press-in) ease-out}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#EEF2EF;border-color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px 16px;
  text-align:left;cursor:pointer;color:inherit;display:flex;flex-direction:column;gap:7px;
  transition:transform var(--press-out) var(--press-ease)}
/* Картка велика — натиск має бути ледь помітним. Що більший елемент,
   то меншу частку розміру він втрачає під пальцем. */
.card:active{transform:scale(.985);transition:transform var(--press-in) ease-out}
/* hover лише там, де є миша: на iOS він «залипає» після тапу */
@media(hover:hover){.card:hover{border-color:var(--ink)}}
.card:focus-visible{outline:2px solid var(--vtm);outline-offset:2px}
.ord{font-size:12.5px;color:var(--soft);letter-spacing:.03em}
.card h3{margin:0;font-size:16.5px;font-weight:600}
.card p{margin:0;color:var(--soft);font-size:13.5px}
.cardfoot{margin-top:auto;padding-top:9px;border-top:1px dashed var(--line);
  font-size:13px;display:flex;justify-content:space-between;gap:10px}
.trap{color:var(--loss)}

/* Шапка екрана — завжди дві сходинки: ряд керування, під ним заголовок.
   Раніше кнопка й заголовок стояли в одному рядку з переносом, тому
   довга назва сценарію штовхала верстку і шапка стрибала між одним
   і двома рядками залежно від довжини тексту. Довжина назви не має
   керувати розкладкою. */
.top{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.toptitle{margin:0;font-size:20px;font-weight:620;letter-spacing:-.01em;
  max-width:34ch;line-height:1.25}
/* «Назад» — орган керування, а не посилання в тексті: у застосунку
   підкреслений текст читається як веб-сторінка. Шеврон — інлайновий
   SVG, не символ і не емодзі: гліф ← у різних шрифтах різного розміру. */
.back{display:inline-flex;align-items:center;gap:5px;
  background:#fff;border:1px solid var(--line);color:var(--soft);cursor:pointer;
  border-radius:var(--r-md);padding:6px 12px 6px 9px;font-size:13.5px;line-height:1;
  text-decoration:none;transition:transform var(--press-out) var(--press-ease)}
.back:active{transform:scale(.94);transition:transform var(--press-in) ease-out}
.back svg{width:14px;height:14px;flex:0 0 auto;display:block}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 302px;gap:22px;align-items:start}
/* minmax(0,1fr), а не 1fr. У CSS Grid колонка `1fr` має min-width:auto —
   тобто вона роздувається під найширшу дитину і тягне за собою всю
   сторінку. Десктопне правило вище це враховує, мобільне — ні, тому
   будь-яка дитина, ширша за колонку, робила сторінку ширшою за екран:
   з'являвся горизонтальний скрол, і все «прилипало» до правого краю. */
@media(max-width:880px){.stage{grid-template-columns:minmax(0,1fr)}}

.brief{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:13px 16px;margin-bottom:14px;font-size:13.5px}
.brief dl{display:grid;grid-template-columns:96px 1fr;gap:3px 12px;margin:0}
.brief dt{color:var(--soft)}
.brief dd{margin:0}

/* Згортання довгих рядків брифінгу («Настрій», «Ціль»).
   ⚠ Згорнуте — це max-height:0, а НЕ display:none. dl тут grid у дві
   колонки, елементи лягають потоком: зникла dd звільняє другу колонку,
   і наступний dt заїжджає в неї — розкладка розсипається. Нульова
   висота лишає dd у сітці, колонка зайнята. */
.brief dt.fold{display:flex;align-items:center;gap:5px;cursor:pointer;
  padding:6px 0;margin:-6px 0;user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent}
.brief dt.fold .chev{flex:0 0 auto;transition:transform 240ms cubic-bezier(.32,.72,0,1)}
.brief dt.fold[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.brief dd.fold-b{max-height:340px;overflow:hidden;
  transition:max-height 240ms cubic-bezier(.32,.72,0,1),opacity 150ms linear}
.brief dd.fold-b[data-open="0"]{max-height:0;opacity:0}
@media(prefers-reduced-motion:reduce){
  .brief dt.fold .chev,.brief dd.fold-b{transition:none}
}

/* ── ПАНЕЛЬ РОЗМОВИ ───────────────────────────────────────────────
   Репліки й поле вводу жили просто на сторінці, тому екран читався як
   «текст, поле і кнопка», а не як переписка. Тепер вони в одній
   заглибленій панелі: фон трохи темніший за сторінку, поле вводу —
   білою смугою, притиснутою до низу панелі. Це та сама форма, яку
   людина щодня бачить у месенджері, і впізнає без пояснень.
   Фон панелі мусить бути ТЕМНІШИЙ за білу бульбашку клієнта — інакше
   репліки зникають у ньому. */
.chat{background:var(--chat);border:1px solid var(--line);border-radius:var(--r-lg);
  margin-bottom:14px;overflow:hidden}
/* Від'ємних полів усередині панелі немає свідомо: смуга вводу притиснута
   до країв не витягуванням себе за батька, а тим, що падінг живе на
   внутрішньому блоці. Дитина, ширша за батька, — це те, що ламало сітку. */
.chat-body{padding:12px 12px 0}
.chat-h{display:flex;align-items:center;gap:8px;padding:2px 3px 10px;
  font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--soft)}
.chat-h::after{content:'';flex:1;height:1px;background:var(--line)}
.chat-hint{font-size:12.5px;color:var(--soft);text-align:center;padding:2px 12px 4px}
.log{display:flex;flex-direction:column;gap:12px;margin-bottom:12px;min-height:88px}

/* Крапки «клієнт друкує». Раніше очікування показувала тільки кнопка,
   яка ставала «…» — тобто відповідь готувалась не там, де вона зʼявиться. */
.dots{display:inline-flex;gap:4px;align-items:center;height:14px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--soft);
  animation:dot 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
@media(prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.5}}
.turn{max-width:82%;padding:10px 14px;border-radius:var(--r-bub);white-space:pre-wrap;
  overflow-wrap:anywhere}
.client{background:#fff;border:1px solid var(--line);align-self:flex-start}
.me{background:var(--ink);color:#EEF2EF;align-self:flex-end}
/* РОЗБІР писав наставник, а не клієнт — але виглядав він як репліка
   клієнта, у такій самій білій бульбашці. Читалось так, ніби це клієнт
   раптом заговорив про «принцип лаконічності». Даємо йому власну форму:
   на всю ширину, без хвоста бульбашки, з зеленою межею збоку. */
.review{align-self:stretch;max-width:100%;background:#fff;
  border:1px solid var(--line);border-left:3px solid var(--vtm);
  border-radius:var(--r-bub)}
.review .who{color:var(--vtm)}
.phrase{display:block;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);
  font-size:13.5px}
.phrase b{color:var(--soft);font-weight:600}
.sys{align-self:center;color:var(--soft);font-size:13px;font-style:italic;text-align:center;max-width:90%}
.who{display:block;font-size:11.5px;letter-spacing:.04em;color:var(--soft);margin-bottom:3px}
.me .who{color:#93A79B}

.say{display:flex;gap:8px;align-items:flex-end;
  padding:10px 12px;background:#fff;border-top:1px solid var(--line)}
.say textarea{flex:1;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-md);
  resize:vertical;min-height:62px;background:#fff;color:inherit}
.btn{padding:10px 18px;border:1px solid var(--ink);background:var(--ink);color:#EEF2EF;
  border-radius:var(--r-md);cursor:pointer;
  transition:transform var(--press-out) var(--press-ease)}
.btn:active{transform:scale(.96);transition:transform var(--press-in) ease-out}
.btn[disabled]:active{transform:none}
.btn[disabled]{opacity:.45;cursor:default}
.btn.ghost{background:#fff;color:var(--ink)}

.tape{background:var(--tape);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;
  position:sticky;top:16px;font-size:13.5px}
.tape h4{margin:0 0 10px;font-size:12.5px;letter-spacing:.05em;color:var(--soft);text-transform:uppercase}
.tapeline{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.tapeline.total{border-top:1px solid var(--line);margin-top:8px;padding-top:8px;font-weight:600}
.big{font-size:19px}
.bignum{font-size:32px;font-weight:640;letter-spacing:-.02em}
.tag{font-size:10.5px;padding:1px 5px;border-radius:2px;margin-left:6px;vertical-align:1px}
.t-vtm{background:var(--vtm);color:#fff}
.t-zf{background:var(--zf);color:#fff}
.t-none{background:var(--line);color:var(--ink)}

/* ── Редактор даних (крок Р-1а) ───────────────────────────────────
   Картка САМА не клікається й після Р-1б: усередині неї живе <details>
   із рядками правил, і натиск по всій площі зʼїдав би акордеон — тобто
   одна зона відповідала б на два різні наміри. Вхід у поля — окремою
   кнопкою в підвалі картки. Тому cursor і натиск .card перебиваються. */
.elist{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:12px}
.ecard{cursor:default}
.ecard:active{transform:none}
/* Стан картки — той самий словник кольорів, що й у панелі перевірки
   (✓ зелений · ⚠ приглушений · ✗ втрата). Другої палітри для того
   самого вердикту не заводимо: два кольори одного ✗ читались би як
   два різні ✗. */
.est{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.emood{margin:0;color:var(--soft);font-size:13px;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.eline{margin:0;font-size:13.5px;line-height:1.45}
/* Смуга публікації має ВЛАСНИЙ клас, хоч виглядає так само, як рядок
   вердикту. .eline — це рядок, сказаний правилами; гейт рахує їх і звіряє
   суму з вердиктом. Смуга стану, одягнена в той самий клас, додалась би
   до цієї суми й почервонила б твердження про зовсім інший предмет. */
.publine{margin:0;font-size:13.5px;line-height:1.45}
.pubbar{margin:0 0 4px}

.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;color:var(--soft);margin-bottom:4px}
/* 16px на полях — не смак: Safari на iOS підʼїжджає зумом до будь-якого
   поля, дрібнішого за 16, і повернути масштаб назад користувач мусить
   руками. Тому те саме число стоїть на input, textarea і select. */
.field input,.field textarea,.field select{width:100%;max-width:420px;font:inherit;font-size:16px;
  padding:9px 12px;border:1px solid var(--line);
  border-radius:var(--r-md);background:#fff;color:inherit}
.field textarea{resize:vertical;min-height:64px;line-height:1.4}
/* Рідний вигляд select на iOS — сірий прямокутник системного кольору;
   appearance:none знімає його, шеврон домальовується фоном. */
.field select{-webkit-appearance:none;appearance:none;padding-right:34px;
  background-image:linear-gradient(45deg,transparent 50%,var(--soft) 50%),
    linear-gradient(135deg,var(--soft) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.field .flab{display:flex;justify-content:space-between;align-items:baseline;gap:10px;max-width:420px}
.field .flab b{font-weight:600;color:var(--ink)}

/* Підказка правила — під полем, а не в спливному вікні: на телефоні
   вікно ховає рівно те поле, заради якого його відкрили. */
.ehint{max-width:420px;margin:6px 0 0;padding:0 0 0 16px;font-size:12.5px;
  line-height:1.5;color:var(--soft)}
.ehint li{margin:0 0 1px}
.ecount{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--soft)}
.ecount.over{color:var(--loss)}
/* Рядки, які правити не можна, і причина цього — поруч, а не мовчки. */
.ero{max-width:420px;margin:0 0 14px}
.ero .tapeline span:last-child{color:var(--ink);text-align:right;word-break:break-word}
.enote{max-width:520px;margin:0 0 14px;font-size:13px;line-height:1.5;color:var(--soft)}
.everd{max-width:520px;margin:0 0 14px}
.echip{display:inline-block;font-size:12px;padding:1px 7px;border-radius:999px;
  border:1px solid var(--line);color:var(--soft);white-space:nowrap}

/* ── ВИБІРНИК КОДІВ (Р-1г-1) ───────────────────────────────────────
   Обране показується НАЗВАМИ: у файлі живе код, у голові людини —
   назва товару. Код лишається поруч дрібним, бо саме ним говорять
   правила, і людина мусить упізнати рядок вироку. */
.pick{max-width:420px}
.picksel{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
/* Назва обраного НЕ обрізається. «Стрепсілс інтенсив 8,75 мг №16» —
   дозування й кількість стоять у хвості рядка, і обрізана назва в
   аптечному каталозі це інший товар. Тому white-space тут скинутий,
   хоч .echip його й тримає. */
.picksel .echip{white-space:normal;text-align:left}
.pickno{font-size:12.5px;color:var(--soft)}
/* Пул під cats буває до 52 позицій. Без власної прокрутки три вибірники
   розтягли б картку на кілька екранів, і вирок правил унизу перестав би
   бути видимим разом із вибором. */
.picklist{max-height:38dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  margin:0 0 4px;border-top:1px dashed var(--line)}
.pickitem{display:flex;gap:9px;align-items:flex-start;padding:8px 2px;
  border-bottom:1px dashed var(--line);cursor:pointer}
.pickitem:last-child{border-bottom:none}
.pickitem input{flex:0 0 auto;width:19px;height:19px;margin:1px 0 0;accent-color:var(--vtm)}
.pickitem .pn{flex:1;min-width:0;font-size:14px;color:var(--ink);line-height:1.35}
.pickitem .pc{flex:0 0 auto;font-size:12px;color:var(--soft);
  font-variant-numeric:tabular-nums;text-align:right;padding-top:1px}
/* Рядок сум під bv/bm. Це ЧИСЛО, а не вирок: вирок про приріст каже
   правило, і його рядок стоїть нижче у вердикті. Тому кольору тут
   немає — пофарбоване число стало б другою оцінкою того самого. */
.pickgain{max-width:420px;margin:2px 0 0;font-size:12.5px;color:var(--soft);
  font-variant-numeric:tabular-nums}

/* Акордеон. Технічний текст потрібен рідко, а місця на телефоні їсть
   багато: тримаємо його згорнутим. Нативний <details> — щоб не писати
   свій перемикач; дефолтний трикутник Safari гаситься окремим правилом,
   інакше маркерів буде два. */
.acc{border:1px solid var(--line);border-radius:var(--r-md);background:#fff;
  padding:0 14px;margin:0 0 14px;max-width:520px}
.acc summary{list-style:none;cursor:pointer;padding:11px 0;font-size:13.5px;
  color:var(--soft);display:flex;align-items:center;justify-content:space-between;gap:10px}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:'';width:7px;height:7px;flex:0 0 auto;margin-right:2px;
  border-right:1.6px solid var(--soft);border-bottom:1.6px solid var(--soft);
  transform:rotate(45deg) translate(-2px,-2px);transition:transform .18s ease}
.acc[open] summary::after{transform:rotate(-135deg) translate(-2px,-2px)}
.acc .accbody{padding:0 0 13px;font-size:13.5px;color:var(--soft)}
.acc .accbody p{margin:0 0 8px}
.acc .accbody p:last-child{margin:0}
.acc .tapeline{font-size:13px}

.mock{margin-top:22px;border:1px dashed var(--zf);border-radius:var(--r-lg);padding:12px 14px;background:#FFFDF6}
.mock h4{margin:0 0 4px;font-size:12.5px;letter-spacing:.05em;color:var(--zf);text-transform:uppercase}
.mock p{margin:0 0 10px;font-size:12.5px;color:var(--soft)}
.mock label{display:block;font-size:13px;padding:2px 0;cursor:pointer}
.mockcols{columns:2;column-gap:20px}
@media(max-width:640px){.mockcols{columns:1}}

.err{background:#FDF3F1;border:1px solid var(--loss);color:var(--loss);
  border-radius:var(--r-lg);padding:10px 14px;margin-bottom:14px;font-size:13.5px}
</style>
</head>
<body>
<div class="wrap" id="app">
  <p class="sub">Завантаження…</p>
</div>

<!-- Правила цілісності даних. Єдине тіло на командний рядок, цю сторінку і
     (крок «в») воркер: розходження копій — те, від чого проєкт тікає з S7 §3.
     ⚠ jsdom зовнішні скрипти за атрибутом src НЕ вантажить. tools/smoke_ui_v1.js
     підставляє вміст цього файлу замість тега перед парсингом — знімеш тег,
     підстановка не спрацює і AE_RULES стане undefined, смоук почервоніє.
     ⚠ У коментарях тут НЕ писати відкривальний тег скрипта літерами: текстові
     інструменти (Lens_validate --html) ловлять його як справжній і витягують
     сміття замість коду. -->
<script src="tools/ae_rules.js"></script>

<script>
/* ═══════════════════════════════════════════════════════════════════
   AE-Simulator · крок 1: скелет без AI
   живе доки: рушій розмови не підключено до Groq (крок 2)

   Двигун розмови — ЗАМІННА ДЕТАЛЬ. Уся гра ходить через engine.turn().
   На кроці 2 сюди стане Groq, і більше нічого міняти не треба.
   ═══════════════════════════════════════════════════════════════════ */

const $ = (s,r=document)=>r.querySelector(s);
const el = (tag,attrs={},kids=[])=>{
  const n=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k==='class')n.className=v;
    else if(k==='html')n.innerHTML=v;
    else if(k==='text')n.textContent=v;
    else if(k.startsWith('on'))n.addEventListener(k.slice(2),v);
    else if(v!==null&&v!==false)n.setAttribute(k,v);
  }
  for(const c of [].concat(kids)) if(c) n.append(c);
  return n;
};

/* ⚠ Мишачий вказівник, не «не-мобільний». Ширина екрана тут ні до чого:
   iPad із клавіатурою широкий, але пальцем; вузьке вікно на ноутбуці
   вузьке, але мишею. Питаємо рівно те, що потрібно — чи є наведення й
   точний вказівник. Читається ОДИН раз при завантаженні: перечитувати
   нема заради чого, а живий запит у кожному натисканні клавіші — це
   робота в найгарячішому місці.
   matchMedia у частині середовищ (jsdom) — заглушка, що завжди каже «ні»;
   try тут не заради jsdom, а тому що відсутній matchMedia не має права
   вбити ввід репліки. */
const POINTER_FINE = (()=>{ try{
  return matchMedia('(hover:hover) and (pointer:fine)').matches;
}catch(_){ return false; } })();

/* Нативний root.append(null) НЕ пропускає порожнє повз себе — він робить
   з null текстовий вузол «null», і той друкується на екрані. Саме так
   на списку замовлень зʼявлялось слово «null» над кнопкою «Почати зміну».
   el() своїх дітей фільтрує, тому екрани збираємо тільки через put(). */
const put = (root,...kids)=>{ for(const c of kids) if(c) root.append(c); };

/* Шеврон «назад». Інлайновий SVG, а не символ ← : гліф у різних шрифтах
   різного розміру й ваги, а тут він мусить збігатися з текстом поруч. */
const CHEVRON = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true">'
  + '<path d="M10 3 5 8l5 5" stroke="currentColor" stroke-width="1.7" '
  + 'stroke-linecap="round" stroke-linejoin="round"/></svg>';
const backBtn = (label,onclick)=>el('button',{class:'back',onclick,
  'aria-label':label, html:CHEVRON+'<span>'+label+'</span>'});

/* Шеврон згортання — окремий, дивиться вниз, повертається вбік.
   Малюється в SVG-просторі імен: createElement('svg') віддає HTML-елемент
   із таким іменем, а не графіку, і нічого не намалює. */
const foldChev = ()=>{
  const NS='http://www.w3.org/2000/svg';
  const s=document.createElementNS(NS,'svg');
  s.setAttribute('class','chev'); s.setAttribute('width','11');
  s.setAttribute('height','11'); s.setAttribute('viewBox','0 0 12 12');
  s.setAttribute('fill','none'); s.setAttribute('aria-hidden','true');
  const p=document.createElementNS(NS,'path');
  p.setAttribute('d','M2.5 4.5 6 8l3.5-3.5');
  p.setAttribute('stroke','currentColor'); p.setAttribute('stroke-width','1.6');
  p.setAttribute('stroke-linecap','round'); p.setAttribute('stroke-linejoin','round');
  s.append(p); return s;
};

/* Робить названі рядки брифінгу згортаними.
   ⚠ Це ПОСТ-ПРОХІД по вже зібраному dl, а не переписані рядки складання.
   Рядок складання пари dt/dd для «Настрою» дослівно збігається з третьою
   ін'єкцією smoke_ui_v1 (цитувати його тут НЕ можна: String.replace бере
   перше входження, і ін'єкція вирізала б коментар): переписати його — зняти
   сторожа, поставленого проти повторної втрати mood (S7 §2.2). Тому текст
   рядків недоторканий, поведінка домальовується зверху.
   dt лишається носієм тексту мітки: шеврон — SVG без текстового вмісту,
   тож dt.textContent і далі рівний «Настрій», а dd не отримує ані символу
   зайвого тексту — обидва твердження смоуку читають те саме, що читали. */
function foldRows(dl, labels){
  const kids=[...dl.children];
  for(let i=0;i<kids.length-1;i++){
    const dt=kids[i], dd=kids[i+1];
    if(dt.tagName!=='DT' || dd.tagName!=='DD') continue;
    const key=dt.textContent.trim();
    if(!labels.includes(key)) continue;
    dt.classList.add('fold'); dd.classList.add('fold-b');
    dt.append(foldChev());
    dt.setAttribute('role','button'); dt.setAttribute('tabindex','0');
    if(S.fold[key]===undefined) S.fold[key]=true;   // за замовчуванням відкрито
    const set=open=>{ S.fold[key]=open;
      dt.setAttribute('aria-expanded',String(open));
      dd.setAttribute('data-open',open?'1':'0'); };
    set(S.fold[key]);
    dt.addEventListener('click',()=>set(!S.fold[key]));
    dt.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){ e.preventDefault(); set(!S.fold[key]); }});
  }
}

/* ── СТАН ────────────────────────────────────────────────────────── */
const S = {
  cfg:null, CAT:null, ALL:{}, SCEN:[], LABEL:{},
  me:null,            // {name, pharmacy}
  screen:'gate',
  group:'Усі',
  sc:null,            // поточний сценарій
  history:[],         // [{role:'user'|'assistant', content}]
  cart:[],
  fold:{},            // {'Настрій':true,…} — згорнуті рядки брифінгу.
                      // Живе в S, а не в локальній змінній: між замовленнями
                      // зміни викликається render(), і без пам'яті рядок
                      // розгортався б назад на кожному новому замовленні.
  ended:false, feedback:'',
  waiting:false,      // чи чекаємо відповідь моделі — малює крапки в стрічці
  attempt:1,          // яка це спроба цієї розмови; >1 їде в підсумок зміни
  phrase:'',          // репліка, яку варто було сказати — від судді
  judging:false,      // суддя ще думає
  shift:null,         // {queue:[…], i:0, rows:[…]}

  /* ── РЕДАКТОР ДАНИХ ──────────────────────────────────────────────
     efilter — фільтр списку. Живе тут, а не локальною змінною в Editor():
     повернення з картки викликає render(), і фільтр скидався б на «Усі»
     щоразу, коли людина закриває сценарій. Той самий урок, що й fold.
     edraft — чернетка: {id: {поле:значення}}. У ПАМʼЯТІ, не в localStorage:
     сховище на диску тягне за собою звірку зі знімком перед публікацією
     (S22 §1.3) і власний гейт — це крок Р-1в, не цей.
     escen — ключ відкритого запису. Саме КЛЮЧ, а не індекс у SCEN: ключ
     може вказувати на запис, якого в SCEN ще немає (створення, Р-1д). */
  efilter:'all', edraft:{}, escen:null,

  /* ── ПУБЛІКАЦІЯ (Р-1в) ───────────────────────────────────────────
     RAW — сирі обʼєкти файлів, як вони лежать на диску, разом з
     обгорткою (version · note). S.SCEN — це scn.scenarios, тобто
     нутрощі; публікувати треба ФАЙЛ, і обгортка, викинута при
     завантаженні, зникла б із репозиторію разом із version.
     esnap — знімок істини з репозиторію: {sha, scn, cat}. Не з тієї
     адреси, звідки прийшла сторінка: Pages відстає від репо на час
     деплою і кешується CDN, тож «те, що показує екран» і «те, що
     лежить у main» — різні речі, і публікація мусить спиратись на
     друге (S22 §1.3).
     epub — стан звірки й запису: {state, text, lines}. */
  RAW:null, esnap:null, epub:null,
};

/* ── ЗАВАНТАЖЕННЯ ────────────────────────────────────────────────── */
async function boot(){
  try{
    const [cfg,cat,scn,pClient,pParts,pChars,pDebrief,pJudge] = await Promise.all([
      fetch('config.json').then(r=>r.json()),
      fetch('data/catalog.json').then(r=>r.json()),
      fetch('data/scenarios.json').then(r=>r.json()),
      fetch('prompts/client.md').then(r=>r.text()),
      fetch('prompts/client.parts.md').then(r=>r.text()),
      fetch('prompts/characters.md').then(r=>r.text()),
      fetch('prompts/debrief.md').then(r=>r.text()),
      fetch('prompts/judge.md').then(r=>r.text()),
    ]);
    S.cfg=cfg;
    const CH = parseChars(stripComments(pChars));
    S.P = {
      client: stripComments(pClient),
      debrief: stripComments(pDebrief),
      judge: stripComments(pJudge),
      withNumber: (pParts.match(/## with_number\s*([\s\S]*?)(?=\n## |$)/)||[,''])[1].trim(),
      withoutNumber: (pParts.match(/## without_number\s*([\s\S]*?)(?=\n## |$)/)||[,''])[1].trim(),
      chars: CH.chars, risks: CH.risks,
      /* Сирий текст носія лишається поруч із розібраним: правила беруть
         носій ТЕКСТОМ і розбирають його самі (12.11-а — перелік має один
         дім). Розібрана мапа для них не годиться, а другого розбору тут
         бути не може. */
      charsRaw: pChars,
    };
    if(!S.P.client || !S.P.withNumber || !S.P.judge) throw new Error('Файли промптів прочитались порожніми');
    S.CAT={}; S.LABEL={};
    for(const [k,v] of Object.entries(cat.categories)){
      S.CAT[k]=v.items; S.LABEL[k]=v.label;
      for(const it of v.items) S.ALL[it.c]={...it,cat:k};
    }
    S.SCEN=scn.scenarios;
    /* Обгортки лишаються цілими: публікація пише файл, а не масив. */
    S.RAW={cat, scn};
    /* Дані і носій характерів мусять сходитись. Порожній {{character}} — це
       тихий дефект: промпт збереться, модель відповість, і клієнт просто
       буде ніяким. Тому розходження зупиняє старт так само, як порожній
       файл промпта: краще видимий екран помилки, ніж непомітно сірий клієнт. */
    const noChar = S.SCEN.filter(s=>!S.P.chars[s.character]).map(s=>'#'+s.id+' («'+(s.character||'поле порожнє')+'»)');
    if(noChar.length) throw new Error('Характер сценарію не знайдено в prompts/characters.md: '+noChar.join(', '));
    /* Той самий клас дефекту, але з боку судді: запис у носії є, блоку
       «ризик» у ньому немає — промпт судді збереться з порожнім прицілом,
       і помітити це можна лише зіставивши два розбори. Перелік окремий,
       бо причина інша: тут винен носій, а не дані сценарію. */
    const noRisk = [...new Set(S.SCEN.map(s=>s.character))].filter(c=>S.P.chars[c] && !S.P.risks[c]);
    if(noRisk.length) throw new Error('У prompts/characters.md немає блоку «### ризик» для характеру: '+noRisk.join(', '));
    S.me = JSON.parse(localStorage.getItem('ae_me')||'null');
    S.screen = S.me ? 'picker' : 'gate';
    render();
  }catch(e){
    $('#app').innerHTML='';
    $('#app').append(
      el('div',{class:'err',html:
        '<b>Дані не завантажились.</b><br>'+e.message+
        '<br><br>Найчастіша причина: файл відкрито подвійним кліком з диска. '+
        'Браузер забороняє читати сусідні файли так. Потрібен GitHub Pages або локальний сервер.'}));
  }
}

/* ── ГРОШІ І ПІДРАХУНОК ──────────────────────────────────────────── */
const uah = n => (Math.round(n*100)/100).toFixed(2).replace('.',',');
const bonusOf = cs => cs.reduce((s,c)=>s+(S.ALL[c]?S.ALL[c].b:0),0);
const idealOf = sc => S.cfg.rule==='vtm' ? (sc.bv||[]) : (sc.bm||[]);
const potential = sc => Math.max(1, Math.round(bonusOf(idealOf(sc)) - bonusOf(sc.order)));
const poolOf = sc => sc.cats.flatMap(k=>S.CAT[k]||[]);

/* Добірка зміни: одна пастка/noSale, одне багатопозиційне, одне
   рецептурне, решта — випадково. Так само, як в оригіналі. */
function pickShift(n){
  const NET = S.SCEN.filter(x=>x.no);
  const mix = a => a.slice().sort(()=>Math.random()-0.5);
  const take = (pool,used) => mix(pool.filter(x=>!used.has(x.id)))[0]||null;
  const out=[], used=new Set();
  [ NET.filter(x=>x.trap||x.noSale),
    NET.filter(x=>x.order.length>1),
    NET.filter(x=>x.grp==='Рецептурні') ].forEach(p=>{
      const x=take(p,used); if(x){out.push(x);used.add(x.id)}
    });
  while(out.length<n){ const x=take(NET,used); if(!x)break; out.push(x); used.add(x.id); }
  return mix(out).slice(0,n);
}

/* ═══ ПРОМПТИ ════════════════════════════════════════════════════
   Тексти лежать у prompts/*.md і читаються при старті. {{отак}} —
   віконця, куди підставляються дані сценарію. */
const fill = (tpl,vars) => tpl.replace(/\{\{(\w+)\}\}/g, (m,k)=> k in vars ? vars[k] : m);
const stripComments = t => t.replace(/<!--[\s\S]*?-->/g,'').trim();

/* Носій характерів. Запис — це «## назва», і назва є значенням поля
   `character` у сценарії. З кожного запису беремо ТІЛЬКИ блок «для клієнта».
   Блок «ризик» лишається у файлі й нікуди звідси не йде: він написаний для
   людини і для судді, а клієнтові знати власну типову помилку нема чого —
   знаючи її, він перестане її провокувати. */
function parseChars(t){
  const chars = {}, risks = {};
  const slice = (rec,head) =>
    (rec.match(new RegExp('### '+head+'\\s*([\\s\\S]*?)(?=\\n### |$)'))||[,''])[1].trim();
  for(const m of ('\n'+t).matchAll(/\n## (.+?)\n([\s\S]*?)(?=\n## |$)/g)){
    const name = m[1].trim();
    const forClient = slice(m[2],'для клієнта');
    const risk      = slice(m[2],'ризик');
    if(forClient) chars[name] = forClient;
    if(risk)      risks[name] = risk;
  }
  return {chars, risks};
}

function pluralPos(n){ return n+' '+(n===1?'позиція':n<5?'позиції':'позицій'); }

function buildSystem(sc){
  const pot = potential(sc);
  const catalog = poolOf(sc).map(i=>i.c+' | '+i.n).join('\n');
  const order = sc.order.length
    ? sc.order.map((c,i)=>(i+1)+'. '+S.ALL[c].n).join('\n')
    : 'нічого, замовлення ще не оформлене';
  const numLine = sc.no
    ? fill(S.P.withNumber, {no:sc.no})
    : S.P.withoutNumber;
  return fill(S.P.client, {
    who:sc.who, mood:sc.mood, mode:sc.mode, numLine,
    character: S.P.chars[sc.character],
    orderCount: pluralPos(sc.order.length), order, open:sc.open,
    catalog, pot, initialCart: JSON.stringify(sc.order)
  });
}

/* Промпт СУДДІ збирається окремою функцією з тієї самої причини, що й
   промпт клієнта: інакше він існує тільки всередині живого виклику, і
   ні гейт, ні майбутнє «Приміряти» не мають що подивитись. Двигун
   відправляє, він не збирає. */
function buildJudge(sc, history, cart){
  const nameOf = cs => cs.map(c=>S.ALL[c]&&S.ALL[c].n).filter(Boolean).join('; ') || 'нічого';
  const base = bonusOf(sc.order), now = bonusOf(cart);
  const ideal = (S.cfg.rule==='stm' ? sc.bm : sc.bv) || [];
  const transcript = ['КЛІЄНТ: '+sc.open]
    .concat(history.map(m=>(m.role==='user'?'ФАРМАЦЕВТ: ':'КЛІЄНТ: ')+m.content))
    .join('\n');
  return fill(S.P.judge, {
    who: sc.who, mode: sc.mode, goal: sc.goal||'—',
    /* Два зрізи ОДНОГО запису носія, розведені по адресатах. Клієнтові
       їде опис і не їде ризик; судді — навпаки: назва характеру, щоб
       знати, з ким мав справу фармацевт, і рядок ризику, щоб знати, яку
       саме помилку тут шукати. Порожнього запасу тут немає навмисно:
       відсутній ризик зупиняє старт у boot(), і мовчазне '' сховало б
       рівно той дефект, який там ловиться. */
    character: sc.character, risk: S.P.risks[sc.character],
    transcript,
    /* Суддя досі не бачив асортименту: він міг радити тільки те, що ми
       самі назвали ідеалом. Той самий пул, що й у клієнта (категорії
       сценарію), плюс мітка й бонус — суддя оцінює гроші, клієнт про
       них не знає і в його промпті їх немає. */
    catalog: poolOf(sc).map(i=>i.c+' | '+i.n+' | '+(i.k||'—')+' | '+i.b+' ₴').join('\n'),
    orderList: nameOf(sc.order), cartList: nameOf(cart),
    baseSum: uah(base), nowSum: uah(now),
    delta: uah(now-base), pot: potential(sc),
    idealList: nameOf(ideal),
    noSaleLine: sc.noSale
      ? 'УВАГА: у цьому сценарії правильна дія — нічого не міняти. Приріст тут НЕ мета.'
      : ''
  });
}

/* ═══ ЗВ'ЯЗОК З МОДЕЛЛЮ ═══════════════════════════════════════════
   Два режими:
     ключ у браузері → прямо на Groq (крок 2, для тесту)
     ключа немає     → на Cloudflare Worker (крок 3, для роботи)
   ═════════════════════════════════════════════════════════════════ */
const KEY = {
  get: ()=>localStorage.getItem('ae_groq_key')||'',
  set: v=>v?localStorage.setItem('ae_groq_key',v.trim()):localStorage.removeItem('ae_groq_key')
};

/* Кодове слово мережі. Одне на всіх, вводиться раз. Це не пароль людини —
   це «свій-чужий» для воркера, щоб адресу не використав хтось сторонній. */
const NET = {
  get: ()=>localStorage.getItem('ae_net_code')||'',
  set: v=>v?localStorage.setItem('ae_net_code',v.trim()):localStorage.removeItem('ae_net_code')
};

/* Яка модель відповіла НАСПРАВДІ. Пишеться з заголовка воркера, не з config:
   config каже, що ми просили, заголовок каже, що ми отримали (wsd 1.10).
   role — теж із заголовка. Відколи клієнт і суддя стартують із різних
   сходинок, «остання модель на дроті» без ролі стала двозначною: після
   розбору тут стоїть модель судді, і без підпису екран виглядав би так,
   ніби клієнта підмінили. */
const LIVE = { model:'', rung:0, role:'' };

/* ── ПІН СХОДИНКИ · режим перевірки ────────────────────────────────
   Браузер називає НОМЕР сходинки заголовком x-ae-pin. Назву моделі він не
   називає ніколи — назви живуть у драбині воркера, і копії тут немає.

   Тому підписи чипів не оголошені, а ВИВЧЕНІ: після кожної відповіді
   ім'я з заголовка x-ae-model лягає під номер із x-ae-rung. До першої
   відповіді чип каже «сходинка 2», після — назву моделі. Оголошений
   перелік назв був би другою копією закритого переліку і розійшовся б
   із драбиною мовчки, коли в неї додадуть сходинку.

   Ім'я запиту (x-ae-pin) НЕ збігається з іменем відповіді (x-ae-rung)
   навмисно: інакше екран легко почав би показувати те, що ми просили,
   замість того, що відповіло, — і перевірка підтверджувала б сама себе.

   RUNGS — єдине число, що дублює драбину. Ціна названа: зайвий чип
   попросить неіснуючу сходинку, воркер віддасть звичайну драбину, і
   екран покаже «просив 5 — відповіла 0». Розбіжність видима, не мовчазна. */
const RUNGS = 4;
const PIN = {
  get: ()=>localStorage.getItem('ae_pin')||'',
  set: v=>v===''?localStorage.removeItem('ae_pin'):localStorage.setItem('ae_pin',String(v)),
  names(){ try{ return JSON.parse(localStorage.getItem('ae_rung_names')||'{}'); }
           catch{ return {}; } },
  learn(rung, model){
    if(!model) return;
    const n = PIN.names();
    if(n[rung]===model) return;
    n[rung] = model;
    localStorage.setItem('ae_rung_names', JSON.stringify(n));
  },
  /* Коротка назва для чипа: постачальник у підписі не потрібен, а рядок
     «openai/gpt-oss-120b» рве ряд на телефоні. */
  short: m => String(m||'').split('/').pop()
};

/* Роль ('client' | 'judge') не міняє того, ЩО ми просимо — вона міняє,
   скільки моделі дозволено думати. Через проксі значення призначає воркер
   зі свого списку; браузер лише називає роль заголовком. У прямому режимі
   (ключ у браузері) значення беруться з config — там сервера немає. */
async function callModel(messages, schema, role){
  const m = S.cfg.model, key = KEY.get();
  const judge = role==='judge';
  const url = key ? m.directEndpoint : m.endpoint;
  const headers = {'Content-Type':'application/json'};
  if(role) headers['x-ae-role'] = role;
  if(key) headers['Authorization'] = 'Bearer '+key;
  /* Заголовки HTTP несуть тільки латиницю (ISO-8859-1). Кодове слово може бути
     кирилицею — тому кодуємо у %-послідовність. Воркер декодує назад.
     Без цього fetch падає ще до виходу в мережу: «non ISO-8859-1 code point». */
  else if(NET.get()) headers['x-ae-code'] = encodeURIComponent(NET.get());
  /* Пін має сенс тільки через воркер: у прямому режимі драбини немає взагалі,
     модель там одна і названа в config. Тому заголовок іде разом із кодовим
     словом, а не разом із ключем. */
  if(!key && PIN.get()!=='') headers['x-ae-pin'] = PIN.get();

  const body = {
    model: m.name,
    messages,
    temperature: m.temperature,
    top_p: m.top_p,
    presence_penalty: m.presence_penalty,
    reasoning_format: m.reasoning_format,
    response_format: { type:'json_schema', json_schema: schema }
  };
  /* ОДНА СТЕЛЯ, ОДИН ДІМ. Через воркер стелю і роздуми призначає драбина —
     браузер їх не називає взагалі. Раніше він усе-таки називав, а воркер
     брав Math.min зі своєю: config просив 1100 при драбині на 1200, і
     мовчки вигравала нижча. Коментар у config при цьому казав «через
     проксі стелю призначає воркер» — тобто документація і код розійшлись,
     а побачити це можна було тільки в чужому логу, по виходу рівно 1100.
     У прямому режимі (ключ у браузері) воркера немає — там значення
     беруться з config, і це єдине місце, де вони чинні. */
  if(key){
    body.max_completion_tokens = judge ? (m.judgeMaxTokens||1100) : m.max_completion_tokens;
    body.reasoning_effort      = judge ? (m.judgeReasoning||'low') : m.reasoning_effort;
  }

  let r;
  try{ r = await fetch(url,{method:'POST',headers,body:JSON.stringify(body)}); }
  catch(e){ throw new Error('Немає зв’язку з моделлю. Перевірте інтернет. ('+e.message+')'); }

  if(!key){
    LIVE.model = r.headers.get('x-ae-model') || '';
    LIVE.rung  = Number(r.headers.get('x-ae-rung') || 0);
    LIVE.role  = r.headers.get('x-ae-role') || '';
    PIN.learn(LIVE.rung, LIVE.model);
  } else { LIVE.model = m.name; LIVE.rung = 0; LIVE.role = role || ''; }

  let d;
  try{ d = await r.json(); }
  catch(e){ throw new Error('Відповідь не читається, код '+r.status); }

  if(!r.ok || d.error){
    const msg = (d.error && (d.error.message||d.error.type)) || ('код '+r.status);
    if(r.status===401) throw new Error(key
      ? 'Ключ Groq не прийнято. Перевірте його в налаштуваннях.'
      : 'Кодове слово мережі не підходить. Виправте його в налаштуваннях.');
    if(r.status===429) throw new Error('Забагато запитів поспіль. Зачекайте хвилину.');
    if(r.status===403) throw new Error('Застосунок відкрито з адреси, якої сервер не знає.');
    /* 422 — свій код воркера: розбір не вмістився у стелю навіть після
       повтору без роздумів. Текст уже український і вже пояснює, що
       робити, тому показуємо його як є — так само, як 503. */
    if(r.status===422) throw new Error(msg);
    if(r.status===503) throw new Error(msg);
    if(r.status===404) throw new Error('Модель «'+m.name+'» недоступна на цьому акаунті. '+msg);
    throw new Error('Модель повернула помилку: '+msg);
  }

  /* finish_reason:'length' — це НЕ поламана відповідь, це обрізана стеля.
     Раніше обидва випадки читались як «відповідь не читається», і причина
     ховалась. Роздуми судді рахуються в ту саму стелю, тому тепер це
     реальний сценарій, а не теорія. */
  const fin = d.choices && d.choices[0] && d.choices[0].finish_reason;
  if(fin==='length') throw new Error('Відповідь не влізла у відведений розмір. '
    + (judge ? 'Розбір вийшов задовгим — скажіть про це розробнику.' : 'Спробуйте коротшу репліку.'));

  const txt = d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content;
  if(!txt) throw new Error('Модель відповіла порожньо');

  /* Схема гарантує JSON, але страхуємось: якщо модель усе-таки
     обгорнула відповідь у ```json — знімаємо обгортку. */
  const clean = txt.replace(/^```(?:json)?/,'').replace(/```$/,'').trim();
  try{ return JSON.parse(clean); }
  catch(e){ throw new Error('Відповідь не схожа на очікувану: '+clean.slice(0,120)); }
}

/* ═══ ДВИГУН РОЗМОВИ ══════════════════════════════════════════════
   Контракт: turn(sc, history) → {reply, cart, ended, endReason, feedback}
   Заглушка лишилась під адресою ?mock=1 — на ній перевіряють екрани
   й арифметику, не витрачаючи токенів.
   ═════════════════════════════════════════════════════════════════ */
const MOCK = new URLSearchParams(location.search).has('mock');

/* Щабель відкритості (Р2) — службовий канал, не навчальний. Учневі його
   під час розмови не показують: прочитати клієнта самому і є вправою, а
   індикатор її скасовує. Адреса ?step=1 відкриває щабель тому, хто
   НАЛАШТОВУЄ клієнта, — інакше динаміка невидима й крутити нема чого. */
const STEP = new URLSearchParams(location.search).has('step');

const engineMock = {
  name:'заглушка',
  async turn(sc, history){
    await new Promise(r=>setTimeout(r,260));
    const n = history.filter(m=>m.role==='user').length;
    const lines = [
      'Угу. А це те саме, що мені виписали?',
      'Ну не знаю… а дешевше нічого немає?',
      'Добре, давайте спробуємо. Тільки швидше, будь ласка.',
      'Скільки з мене?'
    ];
    const ended = n>=4;
    /* Заглушка схеми не проходить, тому щабель складає сама: без нього
       ?mock=1 віддавав би undefined там, де решта коду чекає рядок. */
    const steps = ['насторожений','слухає','цікавиться','погоджується'];
    return {
      reply: ended ? 'Дякую. Гарного дня.' : lines[(n-1)%lines.length],
      cart: S.cart.slice(),
      ended, endReason: ended?'paid':'',
      step: steps[Math.min(n,steps.length)-1] || 'закритий',
      feedback: ended ? 'Це заглушка розбору. Орієнтир — приріст близько '+potential(sc)+' ₴.' : ''
    };
  },
  async judge(sc, history, cart){
    await new Promise(r=>setTimeout(r,120));
    const d = bonusOf(cart)-bonusOf(sc.order);
    return {
      feedback:'Заглушка судді. Приріст '+uah(d)+' ₴ з орієнтира '+potential(sc)+' ₴.',
      phrase: d>0 ? '' : 'А до цього зазвичай беруть ще одну позицію — показати?'
    };
  }
};

const engineLive = {
  name:'Groq · '+'',
  async turn(sc, history){
    const messages = [
      {role:'system', content: buildSystem(sc)},
      ...history.map(m=>({role:m.role, content:m.content}))
    ];
    const r = await callModel(messages, S.cfg.schemas.turn, 'client');
    /* Модель бачить лише коди зі свого асортименту, але підстрахуємось:
       чужий код у чеку зламав би підрахунок. */
    const pool = new Set(poolOf(sc).map(i=>i.c));
    return { ...r, cart: (r.cart||[]).filter(c=>pool.has(c)) };
  },
  async debrief(rows){
    const body = rows.map((r,i)=>{
      const head = 'Замовлення '+(i+1)+'. «'+r.sc.title+'»'+(r.sc.no?', № '+r.sc.no:'')+'. '
        + 'У списку: '+(r.sc.order.map(c=>S.ALL[c].n).join('; ')||'нічого')+'. ';
      const res = r.sc.noSale
        ? 'Правильна дія — нічого не міняти. Фармацевт '+(r.delta>0?'усе-таки змінив чек':'чек не змінив')+'. '
        : 'Приріст '+uah(r.delta)+' ₴ з орієнтира '+r.pot+' ₴. ';
      return head+res+'Розбір розмови: '+(r.fb||'—');
    }).join('\n\n');
    const prompt = fill(S.P.debrief, {shiftSize:rows.length, body});
    return callModel([{role:'user',content:prompt}], S.cfg.schemas.debrief, 'judge');
  },

  /* СУДДЯ. Окремий виклик після завершення розмови. Бачить стенограму
     І числа: що було, що стало, приріст, орієнтир, ідеальний чек.
     Доти оцінку писала та сама модель, у тому самому проході, що й грала
     клієнта, і результату не бачила — приріст рахує застосунок ПІСЛЯ неї.
     Тому вона хвалила будь-що: розмова скінчилась швидко, отже добре. */
  async judge(sc, history, cart){
    return callModel([{role:'user',content:buildJudge(sc,history,cart)}],
                     S.cfg.schemas.judge, 'judge');
  },
  async ping(){
    const r = await callModel(
      [{role:'user',content:'Поверни reply="працює", cart=[], ended=true, endReason="paid", feedback="", step="слухає".'}],
      S.cfg.schemas.turn, 'client');
    return r.reply;
  }
};

const engine = MOCK ? engineMock : engineLive;


/* ── ЕКРАНИ ──────────────────────────────────────────────────────── */
function render(){
  const app=$('#app'); app.innerHTML='';
  /* Підписники куратора живуть рівно один рендер: екран, який їх ставив,
     щойно знищено, і його елементи більше нікому не показувати. Без цього
     рядка кожен перехід додавав би ще одну функцію на мертвий DOM. */
  CURATOR.watch.length = 0;
  ({gate:Gate, picker:Picker, game:Game, result:Result, settings:Settings,
    edit:Editor, escen:ScenCard}[S.screen])(app);
  window.scrollTo(0,0);
}

function Settings(root){
  /* Кодового слова мережі тут більше немає: змінної AE_CODE у Cloudflare
     не заведено, тож поле нічого не вмикало. Константа NET у коді ЛИШАЄТЬСЯ —
     воркер уміє її читати, якщо колись повернемо стіну перед дверима. */
  let val = KEY.get();
  const status = el('p',{class:'sub',style:'margin:12px 0 0'});
  /* Поле ключа тримаємо посиланням. Раніше «Стерти ключ» шукало
     root.querySelector('input') — тобто ПЕРШИЙ інпут на екрані, а першим
     було чуже поле. Порядок елементів не має керувати логікою. */
  const keyInput = el('input',{type:'password', value:val, placeholder:'gsk_…',
    oninput:e=>val=e.target.value, onkeydown:e=>e.key==='Enter'&&test()});

  /* Ряд сходинок і підпис під ним перемальовуються після кожного пінгу:
     саме там з'являється вивчена назва моделі. Перемальовуємо ВСЕРЕДИНІ
     екрана, а не через render(), бо render() зібрав би Settings заново і
     стер рядок результату — тобто відповідь зникла б у мить, коли її
     треба читати. */
  const chipsBox = el('div',{class:'tabs',style:'margin-bottom:6px'});
  const pinNote  = el('p',{class:'sub',style:'margin:0 0 14px;font-size:13px'});

  const drawRungs = ()=>{
    const names = PIN.names(), cur = PIN.get();
    chipsBox.textContent = '';
    chipsBox.append(el('button',{'aria-pressed':cur===''?'true':'false',text:'авто',
      onclick:()=>{ PIN.set(''); drawRungs(); }}));
    for(let i=0;i<RUNGS;i++){
      chipsBox.append(el('button',{'aria-pressed':cur===String(i)?'true':'false',
        text: names[i] ? PIN.short(names[i]) : 'сходинка '+i,
        onclick:()=>{ PIN.set(i); drawRungs(); }}));
    }
    pinNote.textContent = cur===''
      ? 'Авто: воркер бере першу увімкнену сходинку і сходить нижче лише на вичерпаній квоті.'
      : ('Режим перевірки: всі запити йдуть на сходинку '+cur+
         ', запасу немає. Поверніть «авто» перед роботою з людьми.');
    pinNote.style.color = cur==='' ? 'var(--soft)' : 'var(--loss)';
  };
  drawRungs();

  const test = async ()=>{
    KEY.set(val);
    status.style.color='var(--soft)';
    status.textContent='Перевіряю зв’язок…';
    try{
      const t0=Date.now();
      const r = await engineLive.ping();
      const sec = ((Date.now()-t0)/1000).toFixed(1);
      status.style.color='var(--vtm)';
      /* Називаємо те, що ВІДПОВІЛО (заголовок), а не те, що просили (пін).
         Репліка моделі йде останньою: вона доводить, що схема жива, але
         питання ходу — яка саме модель на дроті. */
      status.textContent='✓ '+(LIVE.model||'модель не назвалась')+
        ' — сходинка '+LIVE.rung+', '+sec+' с. Відповіла: «'+r+'».';
      drawRungs();
    }catch(e){
      status.style.color='var(--loss)';
      status.textContent='✗ '+e.message;
    }
  };

  put(root,
    el('div',{class:'top'},[
      el('div',{class:'toprow'},[backBtn('назад',()=>{S.screen=S.me?'picker':'gate';render()})]),
      el('h2',{class:'toptitle',text:'Налаштування'})
    ]),
    el('h1',{class:'lede',text:'Технічне'}),
    /* До першої відповіді назвати модель нічим: config.model.name — це
