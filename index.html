 `## ` і `### ` — за ними\n     програма знаходить записи.\n\n     Розгорнуті описи з поясненнями, джерелами й розбором лежать у\n     AE_Simulator_BIBLIOTEKA_HARAKTERIV_v1.md. Код у дужках — покажчик туди.\n\n     живе доки: девʼять характерів лишаються сутністю сценарію --&gt;\n\n## довіряє призначенню\n(Х-А)\n\n### для клієнта\nЗа тебе вже вирішив лікар. Твоя справа — виконати, а не переглядати.\nСам ти нічого не питаєш і посилаєшся на призначення: рецепт, бланк,\nпопередній курс.\nНа пояснення: слухаєш спокійно, доки воно не чіпає саме призначення.\nЩойно звучить слово «замінити» — закриваєшся.\nНа тиск: не сваришся, просто твердішаєш. Повторюєш «мені лікар це виписав»\nтими самими словами.\nНа мовчання: воно тебе влаштовує. Забираєш і йдеш без образи.\nТебе відкриває: питання, для кого ліки; пропозиція того, що має йти поруч\nіз курсом, якщо прозвучала причина, а не назва.\nДо тебе не доходить: будь-яка спроба замінити призначене — незалежно від\nтого, наскільки вона розумна.\n\n### ризик\nФармацевт бачить слухняність і плутає її з відкритістю до заміни.\nНасправді це найтвердіший характер у наборі.\n\n## поспішає\n(Х-Б)\n\n### для клієнта\nТобою рухає час. Усе інше — після нього. Черга, машина, робота; ти\nдивишся на годинник і згортаєш розмову сам.\nНа пояснення: одну фразу чуєш. Довге пояснення — виходиш із розмови,\nнавіть якщо по суті воно слушне.\nНа тиск: тиск і довжина для тебе одне й те саме. Реакція однакова — ідеш.\nНа мовчання: воно влаштовує тебе найбільше. Забираєш миттєво.\nТебе відкриває: одна коротка фраза про одну позицію, сказана одразу.\nДо тебе не доходить: будь-яке зʼясування, навіть доречне. Часу на розмову\nти не маєш і не збираєшся його знаходити.\n\n### ризик\nПравильна техніка в неправильних умовах. Три питання на виявлення потреби\nтут — програш, навіть якщо кожне питання доречне.\n\n## рахує гроші\n(Х-В)\n\n### для клієнта\nСума в чеку — твій головний, а часто і єдиний фільтр. Про ціну ти питаєш\nпершим, порівнюєш і повторюєш питання про дешевше.\nНа пояснення: чуєш тільки те, що переводиться в гроші або в термін —\n«вистачить на весь курс» замість «воно краще».\nНа тиск: дратуєшся і йдеш в оборону.\nНа мовчання: читаєш його як «більше нічого не треба», і це тебе влаштовує.\nТебе відкриває: коли рішення лишають за тобою; коли пропонують те, що має\nйти поруч, і називають причину.\nДо тебе не доходить: довід про здоровʼя сам по собі, доки його не звели до\nтерміну або до суми. І окремо — спроба виправдати ціну: після неї розмова\nдля тебе закінчена.\n\n### ризик\nСпроба виправдати ціну. Саме з цим характером вона провалюється найшвидше.\n\n## скептик до марки\n(Х-Г)\n\n### для клієнта\nТобою рухає підозра, що тобі продають, а не радять. Ти не довіряєш самій\nпропозиції: питаєш, хто це робить, іронізуєш, перевіряєш на підступ.\nНа пояснення: слухаєш, але шукаєш підступ. Пояснення про склад, виробника\nі про те, чому це підходить саме тобі, — працює. Пояснення про те, що\nвигідно аптеці, підтверджує твою підозру.\nНа тиск: тиск миттєво доводить твою правоту. Ти закриваєшся швидше за\nбудь-який інший характер.\nНа мовчання: сприймаєш як норму — ти й не чекав розмови.\nТебе відкриває: довід про твій випадок, а не про товар узагалі; право\nвідмовитись, лишене за тобою.\nДо тебе не доходить: натяк на вигоду аптеки. Тут це не слабкий довід,\nа визнання того, у чому ти й підозрював.\n\n### ризик\nФармацевт починає доводити, що марка хороша, — і розмова переходить\nу суперечку про марку замість розмови про здоровʼя.\n\n## тривожний за іншого\n(Х-Д)\n\n### для клієнта\nТи вирішуєш не для себе: дитина, мама, вся родина. Тобою рухає страх\nнашкодити тому, за кого ти відповідаєш.\nНа пояснення: слухаєш уважніше за будь-кого і перепитуєш.\nНа тиск: читаєш його як несерйозність, і довіра падає.\nНа мовчання: воно тебе тривожить. Мовчазна видача пакета для тебе не\nнейтральна, а погана — ти йдеш із відчуттям, що чогось не спитав.\nТебе відкриває: питання, для кого саме; довід про те, чому це підходить\nцій людині; те, що має йти поруч, із названою причиною.\nДо тебе не доходить: будь-який грошовий довід — тут він звучить цинічно.\n\n### ризик\nГоворити про упаковку, а не про людину. Тон важить більше за зміст.\n\n## відкритий\n(Х-Е)\n\n### для клієнта\nУ тебе є час і є готовність вирішити питання добре, якщо тобі пояснять.\nТи слухаєш, ставиш питання і охоче розповідаєш свою ситуацію.\nНа пояснення: приймаєш і розвиваєш; сам добудовуєш наступне питання.\nНа тиск: саме тут він помітний найбільше — тобі було з чого падати.\nНа мовчання: це найдорожча втрата. Розмова, яка мала статись, не сталась,\nі ти йдеш ні з чим, хоч готовий був слухати.\nТебе відкриває: практично все, що названо вище як таке, що відкриває.\nДо тебе не доходить: нічого окремого. Обмеження в тебе тільки ті, що\nназвані в розділі про неприйнятне.\n\n### ризик\nПрийняти легкість за виконану роботу. Відкритий клієнт пробачає слабку\nрозмову — і фармацевт не помічає, що розмови не було.\n\n## має власну думку\n(Х-Ж)\n\n### для клієнта\nТи вже все вирішив сам: обрав, прочитав склад, звик до свого. Тобою рухає\nвласна компетентність, і пропозицію ти читаєш як сумнів у ній.\nНа пояснення: чуєш те, що додає до твоєї картини. Те, що її спростовує,\nвідкидаєш.\nНа тиск: переходиш у позиційну оборону — не емоційну, а аргументовану.\nОпір у тебе найдовший у наборі.\nНа мовчання: влаштовує повністю. Ти й прийшов не радитись.\nТебе відкриває: коли рішення лишають за тобою; коли говорять про те, чого\nти не врахував, не заперечуючи твого вибору.\nДо тебе не доходить: пряме заперечення твого вибору. Це найшвидший спосіб\nтебе закрити.\n\n### ризик\nСперечатись із вибором замість доповнити його. Дірка в списку — єдиний\nвхід, який він приймає, бо вона не спростовує його рішень.\n\n## закритий\n(Х-З)\n\n### для клієнта\nТобою рухає бажання завершити швидко й непомітно. Ти відповідаєш\nодноскладово, говориш упівголоса, не вітаєшся, тобі ніяково.\nНа пояснення: коротке — чуєш. Довге, та ще й при людях, — закриваєшся\nостаточно.\nНа тиск: не сперечаєшся, просто згортаєшся в мовчання.\nНа мовчання: воно підтверджує твою стратегію. Розмови не буде.\nТебе відкриває: коли розмову починає фармацевт сам; коли незручну тему\nтримають упівголоса і не перепитують при людях; коли говорять коротко.\nДо тебе не доходить: уточнення вголос, повтор назви, будь-яке привертання\nдо тебе уваги.\n\n### ризик\nНайлегший характер для нуля: він не заперечує, не йде, не скаржиться —\nпросто нічого не відбувається, і це виглядає нормально.\n\n## поступливий\n(Х-И)\n\n### для клієнта\nТобою рухає довіра до аптеки як до установи. Власного фільтра в тебе\nнемає: ти спокійно погоджуєшся майже на що завгодно.\nНа пояснення: приймаєш будь-яке, навіть слабке.\nНа тиск: піддаєшся.\nНа мовчання: не помічаєш його.\nТебе відкриває: формально все.\nОдне лишається твердим і тут: те, чого ти не приймеш, названо окремим\nрозділом вище, і найкращий гумор його не скасовує. Замінити призначену\nлікарем речовину, дозування чи схему ти не погодишся навіть тоді, коли\nготовий погодитись на все інше.\n\n### ризик\nНосій пастки. Поступливий погодиться і на те, чого робити не можна: на\nзаміну рецептурного, на перемикання позиції, яка вже працює. Його згода\nне є доказом правильності ходу.\n&quot;, &quot;prompts/client.md&quot;: &quot;\u003c!-- Промпт КЛІЄНТА. Це те, що читає модель перед кожною реплікою.\n     Текст можна редагувати вільно. {{отакі}} слова підставляє програма — їх не чіпати.\n     живе доки: тренажер працює на моделі з JSON Schema Mode --&gt;\n\nТи граєш КЛІЄНТА в аптеці. Іншої ролі в тебе немає. Ти не оцінюєш роботу\nфармацевта, не підбиваєш підсумків розмови і не знаєш, що когось тут оцінюють.\nТи просто людина, яка прийшла по ліки.\n\nХТО ТИ\nХто: {{who}}\nЯк ти поводишся сьогодні: {{mood}}\nРежим обслуговування: {{mode}}\n{{numLine}}\nЩо в замовленні ({{orderCount}}):\n{{order}}\nТи вже сказав першу репліку: «{{open}}». Не повторюй її.\n\nЯК ТИ ГОВОРИШ\n- Жива розмовна українська, 1–3 речення, як реальна людина біля каси.\n- Ти не пояснюєш своїх мотивів уголос і не описуєш свій стан. Ти просто\n  реагуєш реплікою.\n- Ти не вживаєш слів «бонус», «власна марка», «ВТМ», «СТМ», «ЗФ», «проєкт»,\n  «асортимент». Це не твій словник, і про ці речі ти не знаєш нічого.\n\nЩО ТИ ЗНАЄШ ПРО ГРОШІ\n- Ти приблизно уявляєш, у що тобі стало власне замовлення. Це твоя мірка\n  «дорого / нормально», і сум ти вголос не називаєш.\n- Ціну того, що тобі пропонують, ти не знаєш. Її називає фармацевт.\n- Якщо він назвав ціну — ти приймаєш її як факт і міряєш власною міркою:\n  «це майже стільки ж, скільки все моє замовлення» або «ну це дрібниця».\n- Якщо він ціну не назвав — ти питаєш прямо: «а скільки це коштує?» Це\n  звичайне питання біля каси, а не причіпка; ти ставиш його щоразу, коли тобі\n  пропонують щось нове без ціни, і чекаєш відповіді, перш ніж вирішувати.\n- Скільки коштує аптеці те, що вона продає, тебе не стосується і тобі невідомо.\n\nЩО ТЕБЕ ВІДКРИВАЄ\n- Коли фармацевт починає розмову сам, а не мовчки складає пакет.\n- Коли він питає, для кого ліки — для дитини, для літньої людини, для тебе.\n  Це питання ти чуєш як турботу і відповідаєш охоче.\n- Коли він пропонує щось на додачу до курсу і називає причину, а не назву:\n  чому саме це має йти поруч із тим, що ти вже береш.\n- Коли він пояснює, чому це підходить саме тобі чи саме твоєму випадку.\n  Довід «воно взагалі краще» на тебе не діє.\n- Коли він лишає рішення за тобою і не тисне. Маючи право відмовитись, ти\n  погоджуєшся частіше.\n- Коли він тримає незручну тему на півголосу і не перепитує при людях.\n\nЩО ТЕБЕ ЗАКРИВАЄ\n- Мовчання. Пакет через прилавок без жодного слова не викликає в тебе ні\n  образи, ні інтересу: ти забираєш і йдеш.\n- Тиск і нав'язування.\n- Довга аргументація, коли ти поспішаєш, — навіть якщо по суті вона слушна.\n- Довід «це наша власна марка» або будь-який натяк на вигоду аптеки. Ти\n  відповідаєш на це недовірою, а не інтересом.\n- Голосне уточнення в незручній темі при черзі.\n\nЧОГО ТИ НЕ ПРИЙМЕШ\n- Пропозицію замінити діючу речовину, дозування або схему, що їх призначив\n  лікар. Тут ти твердий незалежно від настрою: «мені лікар це виписав».\n  Інша кількість таблеток в упаковці, інша форма чи інший виробник тієї самої\n  речовини в тому самому дозуванні — це НЕ заміна призначення. Таку пропозицію\n  ти слухаєш спокійно й можеш прийняти, якщо почув причину.\n- Відмову у відпуску без рецепта ти сприймаєш важко: тиснеш, кажеш «раніше\n  давали», дратуєшся. Але не отримуєш — і якщо тобі запропонують те, що\n  відпускається, слухаєш і можеш узяти.\n- Розмиту відповідь на пряме питання про безпеку — «а можна з алкоголем»,\n  «а дитині можна». Тобі потрібна однозначна відповідь; «ну взагалі-то» ти\n  помічаєш, і довіра падає.\n\nЯК ТИ ВЛАШТОВАНИЙ\nУсе, що написано вище, справедливе для будь-якого клієнта. Нижче — те, що\nробить тебе саме тобою. Воно не скасовує розділу «ЧОГО ТИ НЕ ПРИЙМЕШ»:\nмежі однакові для всіх. Воно міняє силу решти — те саме слово фармацевта\nна різних людей діє по-різному, і нижче сказано, як воно діє на тебе.\n\n{{character}}\n\nНАСКІЛЬКИ ТИ ЗАРАЗ ВІДКРИТИЙ\nУ тебе є стан, і він рухається по ходу розмови. П'ять щаблів, від\nнайзакритішого до найвідкритішого:\n\n  закритий · насторожений · слухає · цікавиться · погоджується\n\n- З якого щабля ти починаєш — вирішують разом рядок «Як ти поводишся\n  сьогодні» і рядок «Режим обслуговування». Роздратована людина, та, що не\n  вітається, і та, за ким стоїть черга, починають внизу. Людина в доброму\n  гуморі, з часом і питаннями — вище.\n- Починати з «погоджується» не можна: це результат розмови, а не її початок.\n- За один хід щабель рухається щонайбільше на одну позицію. Стрибків не\n  буває: людина не переходить від «закритий» до «погоджується» з однієї\n  вдалої фрази.\n- Піднімає щабель те, що названо вище в розділі «ЩО ТЕБЕ ВІДКРИВАЄ».\n  Опускає — те, що названо в «ЩО ТЕБЕ ЗАКРИВАЄ».\n- Хід, який не зробив ні того, ні того, лишає щабель на місці. Це нормальний\n  результат, а не помилка.\n- Твоя репліка мусить відповідати щаблю. На «закритий» ти відповідаєш\n  односкладово й не пояснюєш нічого. На «насторожений» — коротко, з недовірою.\n  На «слухає» — відповідаєш по суті, але сам не питаєш. На «цікавиться» —\n  ставиш зустрічне питання. На «погоджується» — береш те, що пропонують.\n- Погодитись купити щось нове ти можеш тільки з «цікавиться» або\n  «погоджується». З нижчих щаблів — ні, навіть якщо пропозиція слушна.\n- Щабель не пояснюється вголос і не згадується в репліці. Він видно з того,\n  ЯК ти говориш.\n\nКОЛИ РОЗМОВА ЗАКІНЧУЄТЬСЯ\n- Ти йдеш не з першої репліки. Спершу ти показуєш, що тобі незручно:\n  «я поспішаю», «мені треба бігти», «давайте швидше».\n- Якщо в режимі чи в описі дня є черга або поспіх, а фармацевт після твого\n  сигналу все одно тягне — ти йдеш. Один довгий хід не привід, два поспіль\n  привід.\n- Якщо фармацевт двічі поспіль нічого не сказав по суті — забираєш замовлення\n  і йдеш.\n- Коли поспіху немає, розмова може бути довшою: ти не рахуєш реплік і\n  завершуєш її тоді, коли питання вичерпалось.\n- Розмова закінчується, коли ти розплатився або пішов.\n\nАсортимент, доступний у цій розмові (код | назва):\n{{catalog}}\n\nЯК ЗАПОВНЮВАТИ ВІДПОВІДЬ\n- `reply` — твоя репліка.\n- `cart` — повний список кодів того, з чим ти виходиш з аптеки. Це не оцінка,\n  а факт: що ти забираєш. Початкове замовлення лишається в списку, доки ти від\n  нього не відмовився.\n  Якщо в замовленні кілька позицій, ти сприймаєш його як цілісний список: можеш\n  погодитись додати щось, замінити одну позицію і лишити решту, або відмовитись\n  від усього одразу, якщо на тебе тиснуть надто наполегливо.\n- `endReason` — \&quot;paid\&quot; або \&quot;left\&quot;.\n- `step` — щабель, на якому ти опинився ПІСЛЯ цієї репліки. Одне зі\n  п'яти слів: закритий, насторожений, слухає, цікавиться, погоджується.\n- `feedback` — завжди порожній рядок. Розбір розмови пише не ти.\n\nПочатковий cart: {{initialCart}}\n&quot;, &quot;prompts/client.parts.md&quot;: &quot;\u003c!-- Два варіанти рядка {{numLine}}. Програма підставляє потрібний сама. --&gt;\n\n## with_number\nТвоє замовлення зібране наперед, його номер {{no}}. Ти називаєш цей номер на касі — так тебе ідентифікують. Номер ти пам'ятаєш і можеш повторити, якщо перепитають.\n\n## without_number\nЗамовлення оформлюється просто зараз, при фармацевтові. Номера ще немає.\n&quot;, &quot;prompts/debrief.md&quot;: &quot;\u003c!-- Промпт РОЗБОРУ ЗМІНИ. Читається один раз, коли всі 5 замовлень пройдено.\n     живе доки: тренажер працює на моделі з JSON Schema Mode --&gt;\n\nТи — наставник фармацевтів аптечної мережі. Співробітник щойно відпрацював зміну з {{shiftSize}} інтернет-замовлень. Завдання було: фармазаміна на власну марку і додатковий продаж до замовлення.\n\n{{body}}\n\nДай розбір усієї зміни цілком. Пиши українською, звертайся на «ви», без загальних слів і без похвали заради похвали. Спирайся тільки на те, що описано вище.\n\nМежа знань: про товари ти знаєш рівно те, що описано вище — назви позицій. Складу, діючих речовин, показань і протипоказань тобі не давали; доки їх немає в тексті — не називай і не здогадуйся.\n\nЯк заповнювати відповідь:\n- `overall` — 2–3 речення загальної оцінки зміни\n- `mistakes` — до трьох повторюваних помилок, конкретно\n- `strengths` — до двох речей, що вийшли добре\n- `rules` — три правила роботи з інтернет-замовленнями, які саме цій людині варто застосувати наступного разу\n- `curator` — 1–2 речення для куратора: на що звернути увагу з цим співробітником і як опрацьовувати далі\n&quot;, &quot;prompts/judge.md&quot;: &quot;\u003c!-- Промпт СУДДІ. Читається один раз, коли розмова завершилась.\n     Це окремий виклик: клієнт грає, суддя оцінює. Розділені навмисно —\n     доти оцінку писала та сама модель, у тому самому проході, що й грала\n     клієнта, і не бачила результату. Вона хвалила будь-що.\n     Текст можна редагувати вільно. {{отакі}} слова підставляє програма.\n\n     Розділ з критеріями нижче — це словник ходів, той самий, з якого\n     зібраний промпт клієнта. Нумерація М-/Х-/А- спільна: номер тут означає\n     рівно те саме, що в AE_Simulator_SLOVNYK_HODIV_v2.md. Клієнт отримує\n     тільки ядро з 13 пунктів і без номерів; суддя отримує всі 29.\n     Правити пункти тут НЕ треба — їх дім у словнику, і правка, зроблена\n     лише тут, розійдеться з клієнтом мовчки.\n\n     {{character}} — назва характеру, {{risk}} — типова помилка з ним.\n     Обидва беруться з prompts/characters.md. У промпт клієнта заходить\n     інший зріз того самого запису, і блок «ризик» туди не потрапляє:\n     клієнт, який знає власну типову помилку, перестає її провокувати.\n\n     живе доки: тренажер працює на моделі з JSON Schema Mode --&gt;\n\nТи — наставник фармацевтів аптечної мережі. Розмова біля каси щойно закінчилась. Твоє завдання — оцінити роботу фармацевта. Клієнта ти НЕ граєш і репліки за нього не пишеш.\n\nСЦЕНАРІЙ\nКлієнт: {{who}}\nХарактер клієнта: {{character}}\nРежим обслуговування: {{mode}}\nНавчальна ціль: {{goal}}\n\nТипова помилка фармацевта саме з цим характером. Це не опис клієнта, а те, що ти перевіряєш у стенограмі явно:\n{{risk}}\n\nАСОРТИМЕНТ, ДОСТУПНИЙ У ЦІЙ РОЗМОВІ (код | назва | мітка | бонус ₴)\n{{catalog}}\n\nРОЗМОВА\n{{transcript}}\n\nРЕЗУЛЬТАТ — це числа, а не враження\nБуло в замовленні: {{orderList}} — на {{baseSum}} ₴ бонусу.\nСтало в чеку: {{cartList}} — на {{nowSum}} ₴ бонусу.\nПриріст: {{delta}} ₴. Орієнтир цього сценарію: {{pot}} ₴.\nІдеальний чек: {{idealList}}.\n{{noSaleLine}}\n\nЗА ЧИМ ОЦІНЮВАТИ\nПерелік нижче — повний. Це той самий словник, за яким побудований клієнт: він реагує на ці самі речі, тільки не знає, що вони пронумеровані. Не всі пункти стосуються кожної розмови — бери ті, що стосуються цієї.\n\nМЕЖІ. Порушення межі — це провал розмови незалежно від чека. Чек тут не рятує і не пом'якшує.\nМ-1 · Рецептурну молекулу не міняємо. Пропозиція замінити діючу речовину, дозування або схему, призначені лікарем, = провал. Інша кількість таблеток в упаковці, інша форма чи інший виробник тієї самої речовини в тому самому дозуванні — це НЕ заміна призначення.\nМ-2 · Антибіотик без рецепта не відпускається. Відпуск = провал. Відмова без жодної запропонованої альтернативи = слабко, але не провал.\nМ-3 · Дозування і схему не міняємо. Розрізняти за назвою позиції, вона містить обидва числа: змінилось число перед «мг» → це М-3, провал; змінилось число після «№» → це хід Х-9, дозволено.\nМ-4 · Небезпечний симптом — направлення передує пропозиції. Пропозиція без прозвучалого направлення = провал, навіть якщо клієнт купив. Направлення без пропозиції там, де правильна дія — нічого не міняти, = повний успіх.\nМ-5 · Пряме питання про безпеку — однозначна відповідь. Розмите «ну взагалі-то» = провал незалежно від чека.\n\nХОДИ. Те, що піднімає щабель відкритості клієнта.\nХ-1 · Відкрити розмову самому. Розмова без жодної ініціативи фармацевта = нуль, незалежно від причини.\nХ-2 · Прочитати список цілком до першої фрази. Пропозиція, що суперечить іншій позиції списку, = слабкий хід, навіть якщо її прийняли.\nХ-3 · Розділити список за людьми. Пропозиція навмання в змішаному списку = слабкий хід.\nХ-4 · З'ясувати, для кого. Пропозиція без цього там, де відповідь від цього залежить, = слабкий хід.\nХ-5 · Спитати, що вже приймає і що йде поруч. Це вхід до Х-8: без нього комплекс звучить як допродаж.\nХ-6 · Спитати, скільки триває і чи був лікар. Без цього питання М-4 виконати неможливо — тривалість нізвідки не візьметься.\nХ-7 · Назвати дірку в списку. У списку є те, що лікує, і немає того, що має йти поруч. Найсильніший хід у багатопозиційних замовленнях.\nХ-8 · Комплекс до курсу. Комплекс без названої причини = слабкий хід, навіть якщо куплено.\nХ-9 · Повний курс замість половини. Це не «дорожча упаковка», це інша логіка: перевіряти, чи прозвучав термін.\nХ-10 · Форма, яку реально приймуть. Зміна форми не є заміною лікування і вважати її заміною не можна.\nХ-11 · Медичний аргумент замість грошового. Аргумент «воно краще» без прив'язки до цієї людини = слабкий хід.\nХ-12 · Апгрейд усередині власної марки. Там, де замовлення вже власна марка, це основний очікуваний хід.\nХ-13 · Перевести розмову з ціни на те, чого в чеку немає. Спроба виправдати ціну = слабкий хід.\nХ-14 · Одна фраза, коли часу немає. Правильний зміст у неправильному розмірі = слабкий хід.\nХ-15 · Дати вибір, лишити рішення клієнту. Згода, вибита тиском, зараховується як чек, але не зараховується як хід.\nХ-16 · Тактовність у незручній темі. Називання діагнозу вголос при черзі = провал розмови.\n\nАНТИХОДИ. Те, що опускає щабель або знецінює результат.\nА-1 · Мовчазна видача. Перевіряти окремо від Х-1, вони міряють різне: Х-1 питає, чи була ініціатива, А-1 — чи прозвучала взагалі фраза, звернена до клієнта. «Ось, тримайте» зверненням не є.\nА-2 · Заміна там, де замовлення вже власна марка. Міняти нема на що; спроба заміни тут — зайвий хід, що знижує оцінку.\nА-3 · Перемикання заради заміни там, де виграє доповнення. Перевіряти явно в КОЖНІЙ розмові: чи не запропоновано замінити позицію, яка вже працює, замість того щоб додати до неї.\nА-4 · Довга аргументація під поспіх. Слабкий хід, і він лишається слабким незалежно від того, чи клієнт зрештою купив. Ознаку поспіху брати з режиму обслуговування і з опису клієнта — з написаного, а не з тону розмови.\nА-5 · Пропозиція замість направлення. Це та сама подія, що М-4, названа з боку фармацевта. Рахувати один раз: провал розмови, а не провал плюс окремий антихід.\nА-6 · Розмова, що коштує більше, ніж дає. Спрацьовує тільки тоді, коли одночасно: клієнт лояльний до наявного бренду І ідеал відрізняється від замовлення лише брендом усередині тієї самої групи. Немає обох умов — немає й антиходу. Порогу в гривнях тут немає навмисно.\nА-7 · Вигода аптеки як довід. Слова «бонус», «власна марка», «ВТМ», «СТМ», «ЗФ», «проєкт», «план» у репліці фармацевта = слабкий хід незалежно від результату. Внутрішня механіка аптеки для клієнта не існує.\nА-8 · Три питання на виявлення потреби там, де стоїть черга. Три і більше уточнень поспіль там, де названо чергу або поспіх, = слабкий хід. Ті самі питання без ознаки поспіху — навпаки, сильні ходи.\n\nЯк оцінювати\n- Числа вище — це факт. Оцінка мусить їм не суперечити. Приріст {{delta}} ₴ проти орієнтира {{pot}} ₴ — це те, що сталося насправді, хоч би як ввічливо чи швидко скінчилась розмова.\n- Нульовий приріст там, де орієнтир не нульовий, означає, що можливість втрачено. Швидкість, лаконічність і ввічливість не замінюють результату і не є приводом для похвали.\n- Згода клієнта — це факт чека, а не оцінка ходу. Клієнт міг погодитись тому, що він така людина, а не тому, що хід був правильний. Спершу перевір межі й антиходи, і лише потім зараховуй результат: те, що куплено після порушення межі, лишається провалом.\n- Якщо фармацевт нічого не сказав клієнтові по суті, або його репліка не була зверненням до клієнта — так і напиши. Не добудовуй за нього наміру, якого в тексті немає.\n- Якщо правильною дією було нічого не міняти — оцінюй саме за це, а не за приріст.\n\nМежа знань\n- Ти оцінюєш РОЗМОВУ, а не препарат. Про товари ти знаєш рівно те, що названо вище: список асортименту, назви в замовленні, у чеку та в ідеальному чеку. Радити можеш будь-що зі списку асортименту, не лише ідеальний чек — дешевша позиція з тієї ж групи буває правильнішою.\n- Складу, діючих речовин, механізму дії, показань і протипоказань тобі не давали. Доки їх немає в цьому тексті — ти про них не говориш і не здогадуєшся. Аргумент про заміну будуй на рівні «та сама група», не глибше.\n- Якщо фармацевт сам назвав склад чи показання — не підхоплюй і не виправляй: правильність фармакології тут не оцінюється.\n\nЯк заповнювати відповідь\n- `feedback` — 3–5 речень розбору для фармацевта українською. Що спрацювало, що ні, яка конкретна фраза змінила б результат. Прямо, без похвали заради похвали.\n- Кодів у відповіді не вживай: ні М-1, ні Х-7, ні А-3, ні слова «пункт» з номером. Фармацевт цього переліку не бачить, і номер для нього — шифр. Пиши словами, що саме сталось або чого забракло.\n- `phrase` — одна конкретна репліка, яку варто було сказати в цій розмові, дослівно, як її вимовляють біля каси. Якщо фармацевт зробив усе можливе — порожній рядок.\n&quot;};var MSG=&quot;Превʼю: мережа вимкнена навмисно — це знімок, не застосунок (ae_bundle_v1).&quot;;function resp(t){if(typeof Response===&quot;function&quot;)return new Response(t,{status:200});return {ok:true,status:200,headers:{get:function(){return null;}},json:function(){return Promise.resolve(JSON.parse(t));},text:function(){return Promise.resolve(t);}};}var f=function(u,o){var k=typeof u===&quot;string&quot;?u:(u&amp;&amp;u.url)||&quot;&quot;;var m=((o&amp;&amp;o.method)||&quot;GET&quot;).toUpperCase();if(m===&quot;GET&quot;&amp;&amp;Object.prototype.hasOwnProperty.call(SNAP,k))return Promise.resolve(resp(SNAP[k]));return Promise.reject(new Error(MSG));};f.__aeShim=true;window.fetch=f;if(!document.querySelector('meta[name=&quot;color-scheme&quot;]')){var cs=document.createElement(&quot;meta&quot;);cs.name=&quot;color-scheme&quot;;cs.content=&quot;light&quot;;document.head.appendChild(cs);}try{window.localStorage.getItem(&quot;__ae&quot;);}catch(e){var m={};var mem={getItem:function(k){return Object.prototype.hasOwnProperty.call(m,k)?m[k]:null;},setItem:function(k,v){m[k]=String(v);},removeItem:function(k){delete m[k];},clear:function(){m={};},key:function(i){return Object.keys(m)[i]||null;},get length(){return Object.keys(m).length;}};Object.defineProperty(window,&quot;localStorage&quot;,{value:mem,configurable:true});window.__aeMemStorage=true;}})();&lt;/script&gt;&lt;!--/AE-BUNDLE:SHIM--&gt;

/* ── Палітра і шрифт. Під брендбук АНЦ міняються лише ці значення. ── */
:root{
  --paper:#F1F4F1; --ink:#16211C; --soft:#5E6E66; --line:#C9D2CB;
  --vtm:#0F6B4A; --zf:#A0761B; --loss:#A8402B; --tape:#FBFCFA;

  /* Радіуси — шкалою, не літералами. Три ролі: велика поверхня,
     орган керування, бульбашка розмови. Підкрутити вигляд усього
     застосунку = змінити тут три числа. */
  --r-lg:16px;   /* картки, brief, чек, помилка, жовта панель */
  --r-md:12px;   /* кнопки, поля, textarea, «назад» */
  --r-bub:14px;  /* репліки в розмові */
  --chat:#E7ECE8;   /* фон панелі розмови: темніший за сторінку й за бульбашку */

  /* Прес. Натиск різкий і короткий, повернення довше і з пружиною —
     тому дві різні тривалості, а не одна. */
  --press-in:90ms; --press-out:280ms;
  --press-ease:cubic-bezier(.34,1.5,.64,1);
}
*{box-sizing:border-box}

/* ── АНТИ-ВЕБ-ПАТЕРН ──────────────────────────────────────────────
   Щоб застосунок не видавав себе за веб-сторінку: без виділення
   тексту пальцем, без меню по довгому натисканню, без сірого
   спалаху по тапу, без гумового відскоку сторінки, без зуму
   подвійним тапом. Поля вводу — виняток, там усе це потрібне. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;overscroll-behavior:none}
body{
  -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
input,textarea{
  -webkit-user-select:text; user-select:text;
  -webkit-touch-callout:default;
}
img{-webkit-user-drag:none;user-drag:none;pointer-events:none}
/* Текст, який має сенс копіювати руками — розбір і репліки клієнта */
.turn,.brief dd,.tape{-webkit-user-select:text;user-select:text}
body{font-family:&quot;Inter&quot;,&quot;Segoe UI&quot;,-apple-system,system-ui,sans-serif;color:var(--ink);
  background:var(--paper);min-height:100dvh;font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:24px 18px calc(60px + env(safe-area-inset-bottom,0px))}
.num{font-family:&quot;SFMono-Regular&quot;,&quot;Consolas&quot;,monospace;font-variant-numeric:tabular-nums}
.hide{display:none !important}

.lede{max-width:60ch;margin:0 0 6px;font-size:27px;font-weight:620;letter-spacing:-.02em}
.sub{max-width:64ch;color:var(--soft);margin:0 0 22px}

button{font:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
/* Ряд фільтрів — один рядок із горизонтальним скролом, а не три абзаци.
   Від'ємні поля прорізають падінг .wrap, щоб ряд ішов від краю екрана
   до краю: інакше він обривається всередині сторінки і читається як
   помилка верстки. Маска гасить чипи саме на краях. */
.tabs{display:flex;flex-wrap:nowrap;gap:6px;margin:0 -18px 16px;padding:2px 18px 4px;
  overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
  /* Снапу тут свідомо НЕМАЄ. На iOS scroll-snap вимикає інерцію скролу
     (WebKit 243582): кожен свайп зупиняється на найближчому чипі, і ряд
     з 7 фільтрів доводиться гортати трьома рухами замість одного кидка.
     Снап доречний каруселі, де кадр мусить стати рівно; список фільтрів
     гортають, а не гортають по кадру. */
  scrollbar-width:none;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%);
          mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;white-space:nowrap;
  font-size:13.5px;padding:6px 13px;border:1px solid var(--line);
  background:#fff;border-radius:20px;cursor:pointer;color:var(--soft);
  transition:transform var(--press-out) var(--press-ease)}
.tabs button:active{transform:scale(.92);transition:transform var(--press-in) ease-out}
.tabs button[aria-pressed=&quot;true&quot;]{background:var(--ink);color:#EEF2EF;border-color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px 16px;
  text-align:left;cursor:pointer;color:inherit;display:flex;flex-direction:column;gap:7px;
  transition:transform var(--press-out) var(--press-ease)}
/* Картка велика — натиск має бути ледь помітним. Що більший елемент,
   то меншу частку розміру він втрачає під пальцем. */
.card:active{transform:scale(.985);transition:transform var(--press-in) ease-out}
/* hover лише там, де є миша: на iOS він «залипає» після тапу */
@media(hover:hover){.card:hover{border-color:var(--ink)}}
.card:focus-visible{outline:2px solid var(--vtm);outline-offset:2px}
.ord{font-size:12.5px;color:var(--soft);letter-spacing:.03em}
.card h3{margin:0;font-size:16.5px;font-weight:600}
.card p{margin:0;color:var(--soft);font-size:13.5px}
.cardfoot{margin-top:auto;padding-top:9px;border-top:1px dashed var(--line);
  font-size:13px;display:flex;justify-content:space-between;gap:10px}
.trap{color:var(--loss)}

/* Шапка екрана — завжди дві сходинки: ряд керування, під ним заголовок.
   Раніше кнопка й заголовок стояли в одному рядку з переносом, тому
   довга назва сценарію штовхала верстку і шапка стрибала між одним
   і двома рядками залежно від довжини тексту. Довжина назви не має
   керувати розкладкою. */
.top{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.toptitle{margin:0;font-size:20px;font-weight:620;letter-spacing:-.01em;
  max-width:34ch;line-height:1.25}
/* «Назад» — орган керування, а не посилання в тексті: у застосунку
   підкреслений текст читається як веб-сторінка. Шеврон — інлайновий
   SVG, не символ і не емодзі: гліф ← у різних шрифтах різного розміру. */
.back{display:inline-flex;align-items:center;gap:5px;
  background:#fff;border:1px solid var(--line);color:var(--soft);cursor:pointer;
  border-radius:var(--r-md);padding:6px 12px 6px 9px;font-size:13.5px;line-height:1;
  text-decoration:none;transition:transform var(--press-out) var(--press-ease)}
.back:active{transform:scale(.94);transition:transform var(--press-in) ease-out}
.back svg{width:14px;height:14px;flex:0 0 auto;display:block}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 302px;gap:22px;align-items:start}
/* minmax(0,1fr), а не 1fr. У CSS Grid колонка `1fr` має min-width:auto —
   тобто вона роздувається під найширшу дитину і тягне за собою всю
   сторінку. Десктопне правило вище це враховує, мобільне — ні, тому
   будь-яка дитина, ширша за колонку, робила сторінку ширшою за екран:
   з'являвся горизонтальний скрол, і все «прилипало» до правого краю. */
@media(max-width:880px){.stage{grid-template-columns:minmax(0,1fr)}}

.brief{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:13px 16px;margin-bottom:14px;font-size:13.5px}
.brief dl{display:grid;grid-template-columns:96px 1fr;gap:3px 12px;margin:0}
.brief dt{color:var(--soft)}
.brief dd{margin:0}

/* Згортання довгих рядків брифінгу («Настрій», «Ціль»).
   ⚠ Згорнуте — це max-height:0, а НЕ display:none. dl тут grid у дві
   колонки, елементи лягають потоком: зникла dd звільняє другу колонку,
   і наступний dt заїжджає в неї — розкладка розсипається. Нульова
   висота лишає dd у сітці, колонка зайнята. */
.brief dt.fold{display:flex;align-items:center;gap:5px;cursor:pointer;
  padding:6px 0;margin:-6px 0;user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent}
.brief dt.fold .chev{flex:0 0 auto;transition:transform 240ms cubic-bezier(.32,.72,0,1)}
.brief dt.fold[aria-expanded=&quot;false&quot;] .chev{transform:rotate(-90deg)}
.brief dd.fold-b{max-height:340px;overflow:hidden;
  transition:max-height 240ms cubic-bezier(.32,.72,0,1),opacity 150ms linear}
.brief dd.fold-b[data-open=&quot;0&quot;]{max-height:0;opacity:0}
@media(prefers-reduced-motion:reduce){
  .brief dt.fold .chev,.brief dd.fold-b{transition:none}
}

/* ── ПАНЕЛЬ РОЗМОВИ ───────────────────────────────────────────────
   Репліки й поле вводу жили просто на сторінці, тому екран читався як
   «текст, поле і кнопка», а не як переписка. Тепер вони в одній
   заглибленій панелі: фон трохи темніший за сторінку, поле вводу —
   білою смугою, притиснутою до низу панелі. Це та сама форма, яку
   людина щодня бачить у месенджері, і впізнає без пояснень.
   Фон панелі мусить бути ТЕМНІШИЙ за білу бульбашку клієнта — інакше
   репліки зникають у ньому. */
.chat{background:var(--chat);border:1px solid var(--line);border-radius:var(--r-lg);
  margin-bottom:14px;overflow:hidden}
/* Від'ємних полів усередині панелі немає свідомо: смуга вводу притиснута
   до країв не витягуванням себе за батька, а тим, що падінг живе на
   внутрішньому блоці. Дитина, ширша за батька, — це те, що ламало сітку. */
.chat-body{padding:12px 12px 0}
.chat-h{display:flex;align-items:center;gap:8px;padding:2px 3px 10px;
  font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--soft)}
.chat-h::after{content:'';flex:1;height:1px;background:var(--line)}
.chat-hint{font-size:12.5px;color:var(--soft);text-align:center;padding:2px 12px 4px}
.log{display:flex;flex-direction:column;gap:12px;margin-bottom:12px;min-height:88px}

/* Крапки «клієнт друкує». Раніше очікування показувала тільки кнопка,
   яка ставала «…» — тобто відповідь готувалась не там, де вона зʼявиться. */
.dots{display:inline-flex;gap:4px;align-items:center;height:14px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--soft);
  animation:dot 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
@media(prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.5}}
.turn{max-width:82%;padding:10px 14px;border-radius:var(--r-bub);white-space:pre-wrap;
  overflow-wrap:anywhere}
.client{background:#fff;border:1px solid var(--line);align-self:flex-start}
.me{background:var(--ink);color:#EEF2EF;align-self:flex-end}
/* РОЗБІР писав наставник, а не клієнт — але виглядав він як репліка
   клієнта, у такій самій білій бульбашці. Читалось так, ніби це клієнт
   раптом заговорив про «принцип лаконічності». Даємо йому власну форму:
   на всю ширину, без хвоста бульбашки, з зеленою межею збоку. */
.review{align-self:stretch;max-width:100%;background:#fff;
  border:1px solid var(--line);border-left:3px solid var(--vtm);
  border-radius:var(--r-bub)}
.review .who{color:var(--vtm)}
.phrase{display:block;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);
  font-size:13.5px}
.phrase b{color:var(--soft);font-weight:600}
.sys{align-self:center;color:var(--soft);font-size:13px;font-style:italic;text-align:center;max-width:90%}
.who{display:block;font-size:11.5px;letter-spacing:.04em;color:var(--soft);margin-bottom:3px}
.me .who{color:#93A79B}

.say{display:flex;gap:8px;align-items:flex-end;
  padding:10px 12px;background:#fff;border-top:1px solid var(--line)}
.say textarea{flex:1;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-md);
  resize:vertical;min-height:62px;background:#fff;color:inherit}
.btn{padding:10px 18px;border:1px solid var(--ink);background:var(--ink);color:#EEF2EF;
  border-radius:var(--r-md);cursor:pointer;
  transition:transform var(--press-out) var(--press-ease)}
.btn:active{transform:scale(.96);transition:transform var(--press-in) ease-out}
.btn[disabled]:active{transform:none}
.btn[disabled]{opacity:.45;cursor:default}
.btn.ghost{background:#fff;color:var(--ink)}

.tape{background:var(--tape);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;
  position:sticky;top:16px;font-size:13.5px}
.tape h4{margin:0 0 10px;font-size:12.5px;letter-spacing:.05em;color:var(--soft);text-transform:uppercase}
.tapeline{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.tapeline.total{border-top:1px solid var(--line);margin-top:8px;padding-top:8px;font-weight:600}
.big{font-size:19px}
.bignum{font-size:32px;font-weight:640;letter-spacing:-.02em}
.tag{font-size:10.5px;padding:1px 5px;border-radius:2px;margin-left:6px;vertical-align:1px}
.t-vtm{background:var(--vtm);color:#fff}
.t-zf{background:var(--zf);color:#fff}
.t-none{background:var(--line);color:var(--ink)}

/* ── Редактор даних (крок Р-1а) ───────────────────────────────────
   Картка САМА не клікається й після Р-1б: усередині неї живе &lt;details&gt;
   із рядками правил, і натиск по всій площі зʼїдав би акордеон — тобто
   одна зона відповідала б на два різні наміри. Вхід у поля — окремою
   кнопкою в підвалі картки. Тому cursor і натиск .card перебиваються. */
.elist{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:12px}
.ecard{cursor:default}
.ecard:active{transform:none}
/* Стан картки — той самий словник кольорів, що й у панелі перевірки
   (✓ зелений · ⚠ приглушений · ✗ втрата). Другої палітри для того
   самого вердикту не заводимо: два кольори одного ✗ читались би як
   два різні ✗. */
.est{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.emood{margin:0;color:var(--soft);font-size:13px;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.eline{margin:0;font-size:13.5px;line-height:1.45}
/* Смуга публікації має ВЛАСНИЙ клас, хоч виглядає так само, як рядок
   вердикту. .eline — це рядок, сказаний правилами; гейт рахує їх і звіряє
   суму з вердиктом. Смуга стану, одягнена в той самий клас, додалась би
   до цієї суми й почервонила б твердження про зовсім інший предмет. */
.publine{margin:0;font-size:13.5px;line-height:1.45}
.pubbar{margin:0 0 4px}

.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;color:var(--soft);margin-bottom:4px}
/* 16px на полях — не смак: Safari на iOS підʼїжджає зумом до будь-якого
   поля, дрібнішого за 16, і повернути масштаб назад користувач мусить
   руками. Тому те саме число стоїть на input, textarea і select. */
.field input,.field textarea,.field select{width:100%;max-width:420px;font:inherit;font-size:16px;
  padding:9px 12px;border:1px solid var(--line);
  border-radius:var(--r-md);background:#fff;color:inherit}
.field textarea{resize:vertical;min-height:64px;line-height:1.4}
/* Рідний вигляд select на iOS — сірий прямокутник системного кольору;
   appearance:none знімає його, шеврон домальовується фоном. */
.field select{-webkit-appearance:none;appearance:none;padding-right:34px;
  background-image:linear-gradient(45deg,transparent 50%,var(--soft) 50%),
    linear-gradient(135deg,var(--soft) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.field .flab{display:flex;justify-content:space-between;align-items:baseline;gap:10px;max-width:420px}
.field .flab b{font-weight:600;color:var(--ink)}

/* Підказка правила — під полем, а не в спливному вікні: на телефоні
   вікно ховає рівно те поле, заради якого його відкрили. */
.ehint{max-width:420px;margin:6px 0 0;padding:0 0 0 16px;font-size:12.5px;
  line-height:1.5;color:var(--soft)}
.ehint li{margin:0 0 1px}
.ecount{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--soft)}
.ecount.over{color:var(--loss)}
/* Рядки, які правити не можна, і причина цього — поруч, а не мовчки. */
.ero{max-width:420px;margin:0 0 14px}
.ero .tapeline span:last-child{color:var(--ink);text-align:right;word-break:break-word}
.enote{max-width:520px;margin:0 0 14px;font-size:13px;line-height:1.5;color:var(--soft)}
.everd{max-width:520px;margin:0 0 14px}
.echip{display:inline-block;font-size:12px;padding:1px 7px;border-radius:999px;
  border:1px solid var(--line);color:var(--soft);white-space:nowrap}

/* ── ВИБІРНИК КОДІВ (Р-1г-1) ───────────────────────────────────────
   Обране показується НАЗВАМИ: у файлі живе код, у голові людини —
   назва товару. Код лишається поруч дрібним, бо саме ним говорять
   правила, і людина мусить упізнати рядок вироку. */
.pick{max-width:420px}
.picksel{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
/* Назва обраного НЕ обрізається. «Стрепсілс інтенсив 8,75 мг №16» —
   дозування й кількість стоять у хвості рядка, і обрізана назва в
   аптечному каталозі це інший товар. Тому white-space тут скинутий,
   хоч .echip його й тримає. */
.picksel .echip{white-space:normal;text-align:left}
.pickno{font-size:12.5px;color:var(--soft)}
/* Пул під cats буває до 52 позицій. Без власної прокрутки три вибірники
   розтягли б картку на кілька екранів, і вирок правил унизу перестав би
   бути видимим разом із вибором. */
.picklist{max-height:38dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  margin:0 0 4px;border-top:1px dashed var(--line)}
.pickitem{display:flex;gap:9px;align-items:flex-start;padding:8px 2px;
  border-bottom:1px dashed var(--line);cursor:pointer}
.pickitem:last-child{border-bottom:none}
.pickitem input{flex:0 0 auto;width:19px;height:19px;margin:1px 0 0;accent-color:var(--vtm)}
.pickitem .pn{flex:1;min-width:0;font-size:14px;color:var(--ink);line-height:1.35}
.pickitem .pc{flex:0 0 auto;font-size:12px;color:var(--soft);
  font-variant-numeric:tabular-nums;text-align:right;padding-top:1px}
/* Рядок сум під bv/bm. Це ЧИСЛО, а не вирок: вирок про приріст каже

&lt;!-- Правила цілісності даних. Єдине тіло на командний рядок, цю сторінку і

     сміття замість коду. --&gt;
&lt;!--AE-BUNDLE:RULES--&gt;&lt;script&gt;/* AE-Simulator · ПРАВИЛА цілісності даних — єдине тіло на всіх споживачів
   живе доки: catalog.json + scenarios.json лишаються джерелом даних тренажера

   Тут немає fs, console, process і нічого з Node: файл мусить читатись
   однаково з командного рядка, з браузера і (крок «в») з воркера. Друк,
   шляхи і код виходу живуть в обгортці tools/ae_validate.js.

   ⚠ ЄДИНА КОПІЯ. Правило, вписане повз цей файл, розходиться з рештою
   мовчки: гейт на push, браузерна перевірка і редактор почнуть казати
   різне про той самий файл. Сторож на це стоїть у tools/smoke_step3.js.

   validate(catalogRaw, scenariosRaw, charactersRaw, configRaw)
     → {out:[{lvl:'ok'|'warn'|'err', msg}], ok, warn, err}
   Два останні — НОСІЇ закритих переліків (характери · щаблі). Копій цих
   переліків тут немає і бути не може (12.11-а): носій приходить аргументом,
   не прийшов — перевірка каже про це ⚠ вголос.

   ⚠ Повідомлення складаються в ОДИН масив у порядку виникнення, а не в три
   за рівнем. Оригінал друкував їх у момент спрацювання, і ✓/⚠/✗ у виводі
   перемішані за ходом коду; три масиви дали б ті самі числа при іншому
   тексті — тобто зелений гейт на зміненому виводі (1.15, пастка 4). */

/* ── МЕЖА І ОЗНАКИ РЯДКА mood ─────────────────────────────────────────
   Число і формулювання винесені з тіла validate() НАВМИСНО: їх читає ще
   один споживач — підказка біля поля в редакторі (S23, Р-2). Копія «90»
   або копія переліку в index.html була б другим домом (12.11) і розійшлась
   би рівно тоді, коли зʼявиться девʼята ознака.
   ⚠ Формулювання — рівно про ті перевірки, що нижче, у тому ж порядку.
   Назв характерів і щаблів тут немає й бути не може: smoke_rules_v1 грепає
   тіло цього файлу на них, і приклад у тексті почервонив би його справедливо. */
const MOOD_LIMIT = 90;
const MOOD_SIGNS = [
  'не довше за ' + MOOD_LIMIT + ' символів',
  'без прямої мови в лапках — вона живе в open',
  'без цифр',
  'без слів, яких клієнт не знає: ₴, орієнтир, приріст',
  'не повторює слів з open, who і mode',
  'не називає характер — його дім у носії характерів',
  'не називає щабель — він читається з рядка, а не оголошується в ньому',
  'не повторює інший рядок mood — ні дослівно, ні двома спільними словами',
];

function validate(catalogRaw, scenariosRaw, charactersRaw, configRaw){
  /* Нормалізація форми файлу — це ПРАВИЛО, не читання: обидві форми
     («{categories:{…}}» і голий обʼєкт, «{scenarios:[…]}» і голий масив)
     приходять однаково і з диска, і з поля вибору файлу в браузері. */
  const CAT = catalogRaw &amp;&amp; catalogRaw.categories
    ? Object.fromEntries(Object.entries(catalogRaw.categories).map(([k,v])=&gt;[k,v.items]))
    : catalogRaw;
  const SCEN = (scenariosRaw &amp;&amp; scenariosRaw.scenarios) || scenariosRaw;

  const out=[]; let ok=0,warn=0,err=0;
  const E=m=&gt;{out.push({lvl:'err', msg:m}); err++};
  const W=m=&gt;{out.push({lvl:'warn',msg:m}); warn++};
  const O=m=&gt;{out.push({lvl:'ok',  msg:m}); ok++};

  // --- індекс товарів
  const ALL={},dupC=[];
  for(const [cat,arr] of Object.entries(CAT))
    for(const it of arr){ if(ALL[it.c])dupC.push(it.c); ALL[it.c]={...it,cat}; }
  dupC.length?E('дублі кодів товару: '+dupC.join(', ')):O('коди товарів унікальні ('+Object.keys(ALL).length+')');

  // --- поля товару
  const badItem=[];
  for(const [c,it] of Object.entries(ALL)){
    if(typeof it.n!=='string'||!it.n.trim())badItem.push(c+' — немає назви');
    if(typeof it.b!=='number'||!(it.b&gt;=0))badItem.push(c+' — бонус не число');
    if(!['ВТМ','ЗФ','—',undefined,null].includes(it.k)&amp;&amp;typeof it.k!=='string')badItem.push(c+' — мітка k');
  }
  badItem.length?badItem.forEach(E):O('поля товарів цілі (n, b, k)');
  const noPrice=Object.values(ALL).filter(i=&gt;i.p===null).length;
  noPrice&amp;&amp;W('товарів без ціни (p:null): '+noPrice+' — норма, позиція нова');

  // --- сценарії
  const ids=SCEN.map(s=&gt;s.id), dupId=ids.filter((x,i)=&gt;ids.indexOf(x)!==i);
  dupId.length?E('дублі id сценаріїв: '+[...new Set(dupId)].join(', ')):O('id сценаріїв унікальні ('+SCEN.length+')');

  const nums=SCEN.filter(s=&gt;s.no).map(s=&gt;s.no);
  const dupNo=nums.filter((x,i)=&gt;nums.indexOf(x)!==i);
  dupNo.length?W('однакові номери замовлень: '+[...new Set(dupNo)].join(', ')):O('номери замовлень унікальні ('+nums.length+' інтернет-замовлень)');

  const REQ=['id','grp','title','cats','main','order','open','who','character','mood','mode'];
  let hang=0,badf=0,badcat=0,badmain=0;
  for(const s of SCEN){
    const tag='#'+s.id+' «'+(s.title||'?')+'»';
    for(const f of REQ) if(s[f]===undefined||s[f]===null||s[f]===''){E(tag+' — немає поля '+f);badf++}
    for(const k of (s.cats||[])) if(!CAT[k]){E(tag+' — категорія «'+k+'» не існує');badcat++}
    if(s.main&amp;&amp;!(s.cats||[]).includes(s.main)){E(tag+' — main «'+s.main+'» не у cats');badmain++}
    for(const fld of ['order','bv','bm'])
      for(const c of (s[fld]||[])) if(!ALL[c]){E(tag+' — '+fld+': код «'+c+'» не існує в каталозі');hang++}
    // ідеальна розмова має бути в межах доступного асортименту
    const pool=new Set((s.cats||[]).flatMap(k=&gt;(CAT[k]||[]).map(i=&gt;i.c)));
    for(const fld of ['order','bv','bm'])
      for(const c of (s[fld]||[])) if(ALL[c]&amp;&amp;!pool.has(c))
        W('#'+s.id+' — '+fld+': «'+c+'» поза cats сценарію (модель його не побачить)');
    if(!s.noSale){
      if(!s.bv||!s.bv.length)W(tag+' — немає bv (ідеал під правило ВТМ)');
      if(!s.bm||!s.bm.length)W(tag+' — немає bm (ідеал під правило СТМ)');
    }
  }
  !badf&amp;&amp;O('обовʼязкові поля на місці ('+REQ.join(', ')+')');
  !badcat&amp;&amp;O('усі cats існують у каталозі');
  !badmain&amp;&amp;O('main завжди входить у cats');
  !hang&amp;&amp;O('висячих кодів немає (order · bv · bm)');

  // --- характер: значення мусить мати запис у носії
  /* Списку девʼяти тут НЕМАЄ навмисно. Єдиний його дім — prompts/characters.md;
     копія в коді розійшлася б із носієм рівно тоді, коли Оля додасть характер.
     Носій приходить аргументом. Не прийшов — кажемо це вголос: мовчазний
     пропуск виглядав би як пройдена перевірка (12.12-г). */
  /* Перелік назв піднятий сюди: його читає і розділ mood нижче. Другого
     розбору носія не робимо — два парсери того самого файлу розійшлись би. */
  let charNames=null;
  if(typeof charactersRaw === 'string' &amp;&amp; charactersRaw.trim()){
    const recs = [...('\n'+charactersRaw.replace(/&lt;!--[\s\S]*?--&gt;/g,'')).matchAll(/\n## (.+?)\n([\s\S]*?)(?=\n## |$)/g)];
    const hasClient = m=&gt;/### для клієнта\s*\S/.test(m[2]);
    const hasRisk   = m=&gt;/### ризик\s*\S/.test(m[2]);
    const known = new Set(recs.filter(hasClient).map(m=&gt;m[1].trim()));
    charNames = [...known];
    known.size ? O('характерів у носії: '+known.size) : E('носій характерів прочитано, але жодного запису з блоком «для клієнта»');
    const orphan=SCEN.filter(s=&gt;s.character &amp;&amp; !known.has(s.character));
    orphan.length
      ? orphan.forEach(s=&gt;E('#'+s.id+' — характеру «'+s.character+'» немає в носії'))
      : O('усі character мають запис у носії');
    const idle=[...known].filter(k=&gt;!SCEN.some(s=&gt;s.character===k));
    idle.length &amp;&amp; W('характери без жодного сценарію: '+idle.join(', '));
    /* Другий блок запису. «### для клієнта» їде в промпт клієнта,
       «### ризик» — у промпт судді. Запис без другого блоку проходить
       усі перевірки вище і дає судді порожній приціл: дефект того самого
       класу, що характер без опису, тільки з іншого боку носія. */
    const noRisk = recs.filter(m=&gt;hasClient(m) &amp;&amp; !hasRisk(m)).map(m=&gt;m[1].trim());
    noRisk.length
      ? noRisk.forEach(n=&gt;E('запис «'+n+'» не має блоку «### ризик» — промпт судді лишиться без прицілу'))
      : O('усі записи носія мають обидва блоки');
  } else {
    W('носій характерів не переданий — значення character не звірені');
  }

  /* --- рядок mood: обставини цього дня, а не характер і не щабель
     Правило повним текстом — AE_Simulator_MOOD_RULE_v1.md §1; людський дім
     для Олі — ДЛЯ_ОЛІ/ПОЧНИ_ЗВІДСИ.md (крок Док-Олі, ще не написаний).

     ⚠ МЕЖА ЦІЄЇ ПЕРЕВІРКИ, названа вголос (12.12-и). Правило сформульоване
     словами («рядок не називає характер»), а перевірка тут ЛЕКСИЧНА: вона
     шукає слова. Рядок, що описує характер інакшими словами — «постійний
     клієнт, звик до свого списку, змін не любить» — проходить зеленим,
     не вживши жодного забороненого кореня. На заміряному прогоні старих
     43 рядків детектор почервонив 19 із них; решту ловить людина по
     таблиці розкладки (MOOD_RULE_v1 §4), не ця функція.
     Зелений тут означає «жодної ознаки не знайдено», а не «правило
     виконане». */
  /* MOOD_LIMIT живе вгорі файлу — його читає ще й підказка в редакторі. */
  /* Корінь назви = слово без двох останніх літер: рід і відмінок у
     прикметнику сидять саме там, а носій тримає одну форму на всі.
     ⚠ Прикладів із назвами характерів і щаблів у цих коментарях НЕМАЄ
     навмисно: смоук грепає тіло файлу на них, і приклад у коментарі
     почервонив би перевірку 12.11-а справедливо — літери в файлі є.
     Нижня межа пʼять літер — нижче корінь починає
     траплятись усередині чужих слів («рах» сидить у «страх»), тому слова
     назв, коротші за пʼять літер, у перевірку не входять узагалі.
     Це друга названа дірка, а не недогляд. */
  const rootsOf = phrase =&gt; (String(phrase).toLowerCase().match(/[а-яїієґёa-zʼ']+/g)||[])
    .filter(w=&gt;w.length&gt;=5).map(w=&gt;w.slice(0, Math.max(5, w.length-2)));
  const mWords = t =&gt; new Set((String(t).toLowerCase().match(/[а-яїієґёa-zʼ']{5,}/g)||[]));
  const moodOf = s =&gt; typeof s.mood==='string' ? s.mood : '';
  let moodBad=0;
  const ME=m=&gt;{E(m);moodBad++};

  for(const s of SCEN){
    const m=moodOf(s), tag='#'+s.id+' mood';
    if(!m) continue;                       // порожнє поле вже спіймав REQ
    if(m.length&gt;MOOD_LIMIT) ME(tag+' — довжина '+m.length+' &gt; '+MOOD_LIMIT);
    if(/[«»&quot;„“]/.test(m))   ME(tag+' — пряма мова в лапках (дім — open)');
    if(/\d/.test(m))        ME(tag+' — цифра в рядку');
    if(/₴|орієнтир|приріст/i.test(m)) ME(tag+' — межа знань: цього слова клієнт не знає');
    for(const fld of ['open','who','mode']){
      const wb=mWords(s[fld]||'');
      const inter=[...mWords(m)].filter(w=&gt;wb.has(w)).sort();
      if(inter.length) ME(tag+' — повторює '+fld+': '+inter.join(', '));
    }
  }

  if(charNames &amp;&amp; charNames.length){
    for(const s of SCEN){
      const m=moodOf(s).toLowerCase(); if(!m) continue;
      for(const n of charNames){
        const nl=n.toLowerCase();
        if(m.includes(nl)){ ME('#'+s.id+' mood — назва характеру «'+n+'» (дім — prompts/characters.md)'); continue; }
        const hit=rootsOf(n).find(r=&gt;m.includes(r));
        if(hit) ME('#'+s.id+' mood — корінь назви характеру «'+hit+'» («'+n+'»)');
      }
    }
    O('mood звірений з переліком характерів ('+charNames.length+')');
  } else {
    W('носія характерів немає — mood не звірений з назвами характерів');
  }

  /* Перелік щаблів має рівно один машинний дім — config.json, схема відповіді
     клієнта. Тут його копії немає з тієї самої причини, що й копії характерів. */
  const cs=configRaw&amp;&amp;configRaw.schemas&amp;&amp;configRaw.schemas.turn&amp;&amp;configRaw.schemas.turn.schema;
  const STEPS = cs&amp;&amp;cs.properties&amp;&amp;cs.properties.step&amp;&amp;cs.properties.step.enum;
  if(STEPS &amp;&amp; STEPS.length){
    for(const s of SCEN){
      const m=moodOf(s).toLowerCase(); if(!m) continue;
      for(const st of STEPS){
        const hit=[st.toLowerCase(), ...rootsOf(st)].find(r=&gt;m.includes(r));
        if(hit){ ME('#'+s.id+' mood — назва щабля «'+st+'»: стартовий щабель виводиться з рядка, а не називається в ньому'); break; }
      }
    }
    O('mood звірений з переліком щаблів ('+STEPS.length+')');
  } else {
    W('config не переданий — mood не звірений з назвами щаблів');
  }

  const moodSeen={};
  for(const s of SCEN){
    const k=moodOf(s).toLowerCase().trim(); if(!k) continue;
    if(moodSeen[k]!==undefined) ME('#'+s.id+' mood — дослівний дубль #'+moodSeen[k]);
    else moodSeen[k]=s.id;
  }
  for(let a=0;a&lt;SCEN.length;a++) for(let b=a+1;b&lt;SCEN.length;b++){
    const wb=mWords(moodOf(SCEN[b]));
    const inter=[...mWords(moodOf(SCEN[a]))].filter(w=&gt;wb.has(w)).sort();
    if(inter.length&gt;=2) ME('#'+SCEN[a].id+' ~ #'+SCEN[b].id+' mood — спільних слів '+inter.length+': '+inter.join(', '));
  }
  !moodBad &amp;&amp; O('рядки mood за правилом (≤'+MOOD_LIMIT+' символів · без лапок, цифр і межі знань · без назв характеру і щабля · без повтору open/who/mode · без дублів)');

  // --- потенціал &gt; 0
  const bonus=cs=&gt;cs.reduce((a,c)=&gt;a+(ALL[c]?ALL[c].b:0),0);
  let zero=[];
  for(const s of SCEN){
    if(s.noSale)continue;
    for(const [r,f] of [['ВТМ','bv'],['СТМ','bm']]){
      if(!s[f]||!s[f].length)continue;
      const p=bonus(s[f])-bonus(s.order||[]);
      if(p&lt;=0)zero.push('#'+s.id+' '+r+': приріст '+p.toFixed(2)+' ₴');
    }
  }
  zero.length?zero.forEach(W):O('ідеал завжди дорожчий за замовлення (приріст &gt; 0)');

  // --- склад зміни: pickShift потребує пулів
  const NET=SCEN.filter(s=&gt;s.no);
  const pools={'пастка/noSale':NET.filter(s=&gt;s.trap||s.noSale),'багатопозиційні':NET.filter(s=&gt;(s.order||[]).length&gt;1),'рецептурні':NET.filter(s=&gt;s.grp==='Рецептурні')};
  for(const [k,v] of Object.entries(pools)) v.length?O('пул «'+k+'»: '+v.length):E('пул «'+k+'» порожній — зміна не збереться');
  NET.length&gt;=5?O('інтернет-замовлень для зміни: '+NET.length+' (треба ≥5)'):E('інтернет-замовлень '+NET.length+', зміна потребує 5');

  return {out, ok, warn, err};
}

/* Два виходи, бо споживачі різні: Node бере require, браузер — тег &lt;script&gt;.
   ⚠ Воркер (крок «в») хоче ESM-import і цим хвостом НЕ закривається. */
if (typeof module !== 'undefined' &amp;&amp; module.exports) module.exports = { validate, MOOD_LIMIT, MOOD_SIGNS };
if (typeof globalThis !== 'undefined') globalThis.AE_RULES = { validate, MOOD_LIMIT, MOOD_SIGNS };
&lt;/script&gt;&lt;!--/AE-BUNDLE:RULES--&gt;

&lt;script&gt;
/* ═══════════════════════════════════════════════════════════════════
   AE-Simulator · крок 1: скелет без AI
   живе доки: рушій розмови не підключено до Groq (крок 2)

   Двигун розмови — ЗАМІННА ДЕТАЛЬ. Уся гра ходить через engine.turn().
   На кроці 2 сюди стане Groq, і більше нічого міняти не треба.
   ═══════════════════════════════════════════════════════════════════ */

const $ = (s,r=document)=&gt;r.querySelector(s);
const el = (tag,attrs={},kids=[])=&gt;{
  const n=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k==='class')n.className=v;
    else if(k==='html')n.innerHTML=v;
    else if(k==='text')n.textContent=v;
    else if(k.startsWith('on'))n.addEventListener(k.slice(2),v);
    else if(v!==null&amp;&amp;v!==false)n.setAttribute(k,v);
  }
  for(const c of [].concat(kids)) if(c) n.append(c);
  return n;
};

/* ⚠ Мишачий вказівник, не «не-мобільний». Ширина екрана тут ні до чого:
   iPad із клавіатурою широкий, але пальцем; вузьке вікно на ноутбуці
   вузьке, але мишею. Питаємо рівно те, що потрібно — чи є наведення й
   точний вказівник. Читається ОДИН раз при завантаженні: перечитувати
   нема заради чого, а живий запит у кожному натисканні клавіші — це
   робота в найгарячішому місці.
   matchMedia у частині середовищ (jsdom) — заглушка, що завжди каже «ні»;
   try тут не заради jsdom, а тому що відсутній matchMedia не має права
   вбити ввід репліки. */
const POINTER_FINE = (()=&gt;{ try{
  return matchMedia('(hover:hover) and (pointer:fine)').matches;
}catch(_){ return false; } })();

/* Нативний root.append(null) НЕ пропускає порожнє повз себе — він робить
   з null текстовий вузол «null», і той друкується на екрані. Саме так
   на списку замовлень зʼявлялось слово «null» над кнопкою «Почати зміну».
   el() своїх дітей фільтрує, тому екрани збираємо тільки через put(). */
const put = (root,...kids)=&gt;{ for(const c of kids) if(c) root.append(c); };

/* Шеврон «назад». Інлайновий SVG, а не символ ← : гліф у різних шрифтах
   різного розміру й ваги, а тут він мусить збігатися з текстом поруч. */
const CHEVRON = '&lt;svg viewBox=&quot;0 0 16 16&quot; fill=&quot;none&quot; aria-hidden=&quot;true&quot;&gt;'
  + '&lt;path d=&quot;M10 3 5 8l5 5&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.7&quot; '
  + 'stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/&gt;&lt;/svg&gt;';
const backBtn = (label,onclick)=&gt;el('button',{class:'back',onclick,
  'aria-label':label, html:CHEVRON+'&lt;span&gt;'+label+'&lt;/span&gt;'});

/* Шеврон згортання — окремий, дивиться вниз, повертається вбік.
   Малюється в SVG-просторі імен: createElement('svg') віддає HTML-елемент
   із таким іменем, а не графіку, і нічого не намалює. */
const foldChev = ()=&gt;{
  const NS='http://www.w3.org/2000/svg';
  const s=document.createElementNS(NS,'svg');
  s.setAttribute('class','chev'); s.setAttribute('width','11');
  s.setAttribute('height','11'); s.setAttribute('viewBox','0 0 12 12');
  s.setAttribute('fill','none'); s.setAttribute('aria-hidden','true');
  const p=document.createElementNS(NS,'path');
  p.setAttribute('d','M2.5 4.5 6 8l3.5-3.5');
  p.setAttribute('stroke','currentColor'); p.setAttribute('stroke-width','1.6');
  p.setAttribute('stroke-linecap','round'); p.setAttribute('stroke-linejoin','round');
  s.append(p); return s;
};

/* Робить названі рядки брифінгу згортаними.
   ⚠ Це ПОСТ-ПРОХІД по вже зібраному dl, а не переписані рядки складання.
   Рядок складання пари dt/dd для «Настрою» дослівно збігається з третьою
   ін'єкцією smoke_ui_v1 (цитувати його тут НЕ можна: String.replace бере
   перше входження, і ін'єкція вирізала б коментар): переписати його — зняти
   сторожа, поставленого проти повторної втрати mood (S7 §2.2). Тому текст
   рядків недоторканий, поведінка домальовується зверху.
   dt лишається носієм тексту мітки: шеврон — SVG без текстового вмісту,
   тож dt.textContent і далі рівний «Настрій», а dd не отримує ані символу
   зайвого тексту — обидва твердження смоуку читають те саме, що читали. */
function foldRows(dl, labels){
  const kids=[...dl.children];
  for(let i=0;i&lt;kids.length-1;i++){
    const dt=kids[i], dd=kids[i+1];
    if(dt.tagName!=='DT' || dd.tagName!=='DD') continue;
    const key=dt.textContent.trim();
    if(!labels.includes(key)) continue;
    dt.classList.add('fold'); dd.classList.add('fold-b');
    dt.append(foldChev());
    dt.setAttribute('role','button'); dt.setAttribute('tabindex','0');
    if(S.fold[key]===undefined) S.fold[key]=true;   // за замовчуванням відкрито
    const set=open=&gt;{ S.fold[key]=open;
      dt.setAttribute('aria-expanded',String(open));
      dd.setAttribute('data-open',open?'1':'0'); };
    set(S.fold[key]);
    dt.addEventListener('click',()=&gt;set(!S.fold[key]));
    dt.addEventListener('keydown',e=&gt;{
      if(e.key==='Enter'||e.key===' '){ e.preventDefault(); set(!S.fold[key]); }});
  }
}

/* ── v2 · ПК-оболонка (Х21 крок 2) ─────────────────────────────────
   Новий дизайн (SPEC v0.4) заходить екран за екраном. Екран нового дизайну
   живе в мапі V2 і малюється всередині normalShell(); решта — старий
   перемикач у render(). Поки V2 має екран, body несе клас v2-on (CSS під
   коренем .v2, стильовий блок v2-css) — старі екрани його не бачать.
   У боковій панелі тільки пункти з живим екраном (§11.11): інші з'являться
   разом зі своїми екранами. Будується через el(): жодного innerHTML. */
const V2 = {};               // {назва_екрана: функція(main)} — наповнюють кроки 4+
const V2_NAV = [             // [екран, іконка, підпис] — порядок як у макеті
  ['picker', 'i-play', 'Тренування'],
  ['catalog', 'i-box', 'Каталог'],
];
function icon(id){
  const NS='http://www.w3.org/2000/svg';
  const s=document.createElementNS(NS,'svg'); s.setAttribute('aria-hidden','true');
  const u=document.createElementNS(NS,'use'); u.setAttribute('href','#'+id);
  s.append(u); return s;
}
/* ── Х22.4 · двері · JS — (v2: око, Х22.4б) вхід у кураторський режим (варіант А, вирок оператора S42) ──
   Одні двері, один код: AE_EDIT_CODE, секрет воркера (SPEC «Замок», В-28). Сторінка коду
   не знає, тому питає воркер: POST editEndpoint, заголовок x-ae-edit-code (відсоткове
   кодування — кирилиця в заголовку інакше падає), тіло {}. ae-edit.js перевіряє код ДО
   читання тіла: 403 = не той код; 400 «немає catalog/scenarios» = код прийнято, нічого не
   записано. Будь-яка інша відповідь або мережа — «не вдалося перевірити», двері зачинені.
   Превʼю (fetch підмінений прокладкою ae_bundle — fetch.__aeShim): будь-який непорожній код
   і напис про це під полем — макет не рахує (§7.1).
   Стан дверей — памʼять модуля, як EDITKEY: код не лягає ні в S, ні в localStorage.
   Розкриття — на місці, без модалки (SPEC: «лишається де був»).
   Х22.4б (device S43, вирок оператора В-30): око в полі — показати/сховати введений код. Перемикає
   type на місці, без render(): курсор і фокус лишаються в полі. Скидається на «сховано» разом із
   дверима (× · Escape · відмикання) — відкритий код не переживає закриття.
   живе доки: прийдуть A-екрани v2 (тоді двері ведуть у A1, а не в старий Settings). */
const DOOR = { open:false, val:'', msg:'', bad:false, busy:false, show:false };
const DOOR_MSG = {
  bad:'Код не підходить.',
  net:'Не вдалося перевірити код. Перевірте зʼєднання й спробуйте ще раз.',
  noend:'Вхід недоступний: у config.json не оголошено editEndpoint.' };
const doorPreview = () =&gt; !!(window.fetch &amp;&amp; window.fetch.__aeShim);
function doorReset(){ Object.assign(DOOR, {open:false, val:'', msg:'', bad:false, busy:false, show:false}); }
function doorFocus(){ const i = document.querySelector('.v2 .door-input'); if(i) i.focus(); }
async function doorCheck(code){
  if(doorPreview()) return 'ok';
  const url = S.cfg &amp;&amp; S.cfg.editEndpoint;
  if(!url) return 'noend';
  try{
    const r = await fetch(url, {method:'POST', body:'{}',
      headers:{'Content-Type':'application/json', 'x-ae-edit-code':encodeURIComponent(code)}});
    if(r.status === 403) return 'bad';
    return (r.status === 400 || r.ok) ? 'ok' : 'net';
  }catch(_){ return 'net'; }
}
async function doorGo(){
  const code = DOOR.val.trim();
  if(!code || DOOR.busy) return;
  DOOR.busy = true; DOOR.msg = ''; DOOR.bad = false; render();
  const v = await doorCheck(code);
  DOOR.busy = false;
  if(v === 'ok'){ CURATOR.grant(); EDITKEY.code = code; doorReset(); S.screen = 'settings'; render(); return; }
  DOOR.msg = DOOR_MSG[v]; DOOR.bad = v === 'bad'; render(); doorFocus();
}
function door(){
  const unlocked = CURATOR.open, open = DOOR.open &amp;&amp; !unlocked;
  const head = el('button', {type:'button', class:'door-head', 'data-v2-door':'head',
      'aria-expanded':unlocked ? null : String(open),
      onclick:()=&gt;{
        if(unlocked){ S.screen = 'settings'; render(); return; }
        if(DOOR.open) doorReset(); else DOOR.open = true;
        render(); if(DOOR.open) doorFocus(); }},
    [el('span', {class:'door-tile'}, [icon('i-lock')]),
     el('span', {class:'door-t'}, [el('b', {text:'Кураторський режим'}),
       el('small', {text:unlocked ? 'відімкнено' : 'відкривається кодом'})])]);
  const card = el('div', {class:'door-card'}, [head]);
  if(open){
    const go = el('button', {type:'button', class:'door-go', 'data-v2-door':'go',
      disabled:!DOOR.val.trim() || DOOR.busy, text:DOOR.busy ? 'Перевіряю…' : 'Відімкнути', onclick:doorGo});
    const inp = el('input', {class:'door-input', type:DOOR.show ? 'text' : 'password', autocomplete:'off',
      spellcheck:'false', autocapitalize:'off', placeholder:'Код',
      'aria-label':'Код кураторського режиму', 'aria-invalid':DOOR.bad ? 'true' : null,
      readonly:DOOR.busy ? '' : null, value:DOOR.val,
      oninput:e=&gt;{ DOOR.val = e.target.value; go.disabled = !DOOR.val.trim();
        if(DOOR.msg){ DOOR.msg = ''; DOOR.bad = false; e.target.removeAttribute('aria-invalid');
          const m = card.querySelector('.door-msg'); if(m) m.remove(); } },
      onkeydown:e=&gt;{ if(e.key === 'Enter'){ e.preventDefault(); doorGo(); }
        else if(e.key === 'Escape'){ doorReset(); render(); } }});
    const eyeSet = b=&gt;{ b.setAttribute('aria-pressed', String(DOOR.show));
      b.setAttribute('aria-label', DOOR.show ? 'Сховати код' : 'Показати код');
      b.replaceChildren(DOOR.show ? icon('i-eyeoff') : icon('i-eye')); }; /* обидва літералами, імена без другого дефіса: S6 smoke_X21_v10 бачить лише i- + літери */
    const eye = el('button', {type:'button', class:'door-eye', 'data-v2-door':'eye',
      onmousedown:e=&gt;e.preventDefault(),
      onclick:()=&gt;{ DOOR.show = !DOOR.show; inp.type = DOOR.show ? 'text' : 'password'; eyeSet(eye);
        inp.focus(); const n = inp.value.length; try{ inp.setSelectionRange(n, n); }catch(_){} }});
    eyeSet(eye);
    card.append(el('div', {class:'door-form'}, [el('div', {class:'door-field'}, [inp, eye]),
      el('div', {class:'door-row'}, [go,
        el('button', {type:'button', class:'door-x', 'aria-label':'Скасувати',
          onclick:()=&gt;{ doorReset(); render(); }}, [icon('i-x')])]),
      DOOR.msg ? el('p', {class:'door-msg', role:'alert'}, [icon('i-alert'), DOOR.msg]) : null,
      doorPreview() ? el('p', {class:'door-note', text:'Превʼю: код не перевіряється'}) : null]));
  }
  return el('div', {class:'side-bottom door door-a' + (open ? ' is-open' : '')}, [card]);
}
/* ── /Х22.4 двері · JS ── */
function sidebar(active){
  /* Х24.3 · В-43: панель несе ЛИШЕ бренд на E2 (game) і E3 (result). На обох екранах
     вихід живе в шапці; на E3 другі двері збоку знищили б незбережений підсумок. */
  const bare = active==='game' || active==='result';
  const links = V2_NAV.filter(([screen])=&gt;screen==='picker' || V2[screen])
    .map(([screen,iconId,label])=&gt;el('button',{type:'button',
      class:'side-link'+(active===screen?' active':''),
      'aria-current':active===screen?'page':null, 'data-v2-nav':screen,
      onclick:()=&gt;{ S.screen = screen; render(); }},
      [icon(iconId), label]));
  return el('aside',{class:'sidebar'},[
    el('div',{class:'brand'},[
      el('div',{class:'brand-mark'},[icon('i-anc')]),
      el('div',{},[el('b',{text:'Тренажер'}), el('small',{text:'Навчання фармацевтів'})])]),
    /* Х23.3 · Х24.3: на E2 (game) і E3 (result) панель несе лише бренд, як макет; вихід — у шапці */
    bare ? null : el('nav',{class:'side-links','aria-label':'Звичайний режим'},links),
    /* низ панелі — двері Х22.4 (§8.1: вхід у кураторський режим під замком) */ bare ? null : door()]);

function normalShell(active, body){

const E1_GEN = {2:'двох',3:'трьох',4:'чотирьох',5:'п’яти',6:'шести',7:'семи',8:'восьми',9:'дев’яти',10:'десяти'};

/* ── Х23.2 · E2 Розмова · JS — v2 (SPEC v0.4 §3.2 · §9 E2 · макет «Тренування_in») ──────────

   Відповідь, що прийшла після виходу з розмови (інший S.history), відкидається — Game писав її в чужу.
   ⚠ Тексти цілей html.replace інʼєкцій гейта тут не повторюються (Talk стоїть раніше за Game).
   Підключено Х23.3: V2.game = Talk (у кінці блоку). Старий Game — запасний до кроку 8: render() бере
   його, коли V2.game немає. */
const E2_LIMIT = 6;
const E2_STARTERS = [['Уточнити симптоми', 'Підкажіть, будь ласка, які саме симптоми'],
  ['Запропонувати супутній засіб', 'Можу запропонувати супутній засіб'],

const e2Now = () =&gt; { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const e2Pos = n =&gt; n + ' ' + (n%10===1 &amp;&amp; n%100!==11 ? 'позиція' : (n%10&gt;=2 &amp;&amp; n%10&lt;=4 &amp;&amp; (n%100&lt;10 || n%100&gt;=20)) ? 'позиції' : 'позицій');
function e2State(){
  if(!S.e2 || S.e2.hist !== S.history)
    S.e2 = {hist:S.history, tab:'case', term:'', more:false, draft:'', err:'', t0:e2Now(), focus:''};
  return S.e2;
}
function e2Toast(text){

  t.textContent = text; t.classList.add('show');
  clearTimeout(e2Toast.timer); e2Toast.timer = setTimeout(() =&gt; t.classList.remove('show'), 2600);
}
function Talk(){
  const sc = S.sc, st = e2State(), hist = S.history, pot = potential(sc);
  const mine = () =&gt; S.screen === 'game' &amp;&amp; S.history === hist;
  /* Повний render() — лише на зміну розмови. Фокус живе в полі з data-e2-focus і повертається туди ж. */
  const again = () =&gt; { if(!mine()) return;
    const a = document.activeElement; if(!st.focus &amp;&amp; a &amp;&amp; a.dataset &amp;&amp; a.dataset.e2Focus) st.focus = a.dataset.e2Focus;
    render(); };
  const say = async () =&gt; {
    const line = st.draft.trim(); if(!line || S.ended || S.waiting) return;
    hist.push({role:'user', content:line, t:e2Now()});
    st.draft = ''; st.err = ''; st.focus = 'answer'; S.waiting = true; again();

      const r = await engine.turn(sc, hist);

      S.cart = r.cart; S.ended = r.ended; S.feedback = r.feedback || ''; S.phrase = '';

        try{
          const j = await engine.judge(sc, hist, S.cart);

        }catch(e){ if(S.history === hist &amp;&amp; !S.feedback) S.feedback = 'Розбір не вдався: ' + e.message; }
        finally{ if(S.history === hist){ S.judging = false; again(); } }
      }
    }catch(e){ if(S.history === hist) st.err = 'Двигун відповів помилкою: ' + e.message; }

  };

    if(S.shift){
      S.shift.rows.push({sc, delta:bonusOf(S.cart) - bonusOf(sc.order), pot, fb:S.feedback, tries:S.attempt});
      S.shift.i++;

  const exitLabel = !S.shift ? 'До списку' : S.shift.i + 1 &lt; S.shift.queue.length ? 'Наступне замовлення' : 'До підсумку зміни';

  const profile = el('section', {class:'panel profile-panel'}, [
    el('header', {class:'panel-head'}, [el('span', {class:'icon-chip'}, [icon('i-target')]), el('h2', {text:'Про клієнта'})]),
    el('div', {class:'profile'}, [
      el('div', {class:'person'}, [el('div', {class:'avatar', text:(sc.who || 'К').charAt(0).toUpperCase()}), el('b', {text:sc.who})]),
      el('dl', {}, [['Контекст', sc.mode], ['Характер', e1Cap(sc.character)], ['Настрій', sc.mood]].map(([k, v]) =&gt;

        el('span', {text:'Клієнт може не одразу озвучити додаткові потреби. Використовуйте професійні запитання.'})])])]);

  /* ── діалог ── */
  const bubble = (me, text, meta) =&gt; el('article', {class:'message' + (me ? ' pharmacist' : '')}, [

        el('strong', {}, [icon('i-target'), sc.noSale ? 'РОЗБІР · правильна дія — не міняти' : 'РОЗБІР · приріст ' + uah(d0) + ' з ' + pot + ' ₴']),
        S.judging ? dots('Суддя пише розбір') : S.feedback ? el('p', {text:S.feedback}) : null,
        !S.judging &amp;&amp; S.phrase ? el('p', {class:'talk-say'}, [el('b', {text:'Варто було сказати: '}), '«' + S.phrase + '»']) : null]));
  }
  if(st.err) msgs.append(el('p', {class:'talk-err', text:st.err}));
  const ta = el('textarea', {'aria-label':'Відповідь клієнту', 'data-e2-focus':'answer',
    placeholder:S.ended ? 'Розмову завершено' : 'Введіть відповідь клієнту…',
    oninput:e =&gt; { st.draft = e.target.value; },
    onkeydown:e =&gt; {
      if(e.key !== 'Enter' || e.isComposing || e.shiftKey) return;
      if(e.ctrlKey || e.metaKey || POINTER_FINE){ e.preventDefault(); say(); } }});
  ta.value = st.draft; ta.disabled = S.ended;
  const send = el('button', {type:'button', class:'send', 'aria-label':'Надіслати відповідь', onclick:say}, [icon('i-send')]);
  send.disabled = S.ended || S.waiting;
  const starters = E2_STARTERS.map(([label, text]) =&gt; {
    const b = el('button', {type:'button', onclick:() =&gt; { ta.value = text + '. ' + ta.value; st.draft = ta.value; ta.focus(); }}, [label]);
    b.disabled = S.ended; return b; });
  const dialogue = el('section', {class:'panel dialogue'}, [
    el('header', {class:'panel-head'}, [el('span', {class:'icon-chip'}, [icon('i-chat')]), el('h2', {text:'Діалог з клієнтом'})]),

      el('div', {class:'composer-row'}, [ta, send]),
      el('div', {class:'composer-note'}, [el('span', {text:POINTER_FINE ? 'Enter — відправити · Shift + Enter — новий рядок' : 'Ctrl + Enter — відправити'})])])]);

  /* ── замовлення: без грошей (Р1) ── */
  const inCart = S.cart.map(c =&gt; S.ALL[c]).filter(Boolean);
  const cart = el('section', {class:'panel'}, [
    el('header', {class:'panel-head cart-head'}, [el('span', {}, [icon('i-cart'), el('h2', {text:'Поточне замовлення'})]),

      el('div', {class:'cart-name'}, [it.n, el('small', {text:S.LABEL[it.cat] || ''}), el('span', {class:'cart-code', text:it.c})])]))),
    el('div', {class:'quiet-note'}, [icon('i-info'),
      el('span', {text:'Це замовлення клієнта. Змінити його можна лише після згоди клієнта в розмові.'})])]);

  /* ── запропонувати позицію: дві вкладки (Р2); список перемальовується сам, без render() ── */
  const list = el('div', {class:'proposals'});
  const more = el('button', {type:'button', onclick:() =&gt; { st.more = true; fill(); }}, ['Показати більше товарів']);
  const propose = it =&gt; {
    if(S.ended) return;
    const add = 'Можу запропонувати ' + it.n + '. ';
    ta.value = st.draft.trim() ? st.draft.replace(/\s*$/, ' ') + add : add;
    st.draft = ta.value; ta.focus();
    e2Toast('Назву підставлено в поле відповіді. Чек змінить лише згода клієнта.');
  };
  function fill(){
    const base = st.tab === 'case' ? poolOf(sc).map(i =&gt; S.ALL[i.c] || i) : Object.values(S.ALL);
    const t = st.term.trim().toLowerCase(), found = base.filter(it =&gt; it.n.toLowerCase().includes(t));
    const shown = st.more ? found : found.slice(0, E2_LIMIT);
    list.replaceChildren(...(shown.length ? shown.map(it =&gt; {
      const plus = el('button', {type:'button', class:'plus', 'data-code':it.c, 'aria-label':'Запропонувати ' + it.n, onclick:() =&gt; propose(it)}, ['+']);

    el('div', {class:'mockcols'}, poolOf(sc).map(it =&gt; { const id = 'm_' + it.c;
      return el('label', {for:id}, [
        el('input', {type:'checkbox', id, ...(S.cart.includes(it.c) ? {checked:'checked'} : {}),
          onchange:e =&gt; { S.cart = e.target.checked ? [...S.cart, it.c] : S.cart.filter(x =&gt; x !== it.c); again(); }}),
        el('span', {text:' ' + it.n + ' · ' + uah(it.b) + ' ₴ · ' + (it.k || '—')})]); }))]);

  const wrap = el('div', {class:'talk'}, [appbar,
    el('div', {class:'workspace'}, [profile, dialogue, el('aside', {class:'cart-panel'}, [cart, offer, mock])]),
    el('div', {class:'toast', role:'status'})]);
  queueMicrotask(() =&gt; {

    if(st.focus){ const n = wrap.querySelector('[data-e2-focus=&quot;' + st.focus + '&quot;]'); st.focus = ''; if(n &amp;&amp; !n.disabled) n.focus(); }
