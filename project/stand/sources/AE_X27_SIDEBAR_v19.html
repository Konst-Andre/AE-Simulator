  v16 проти v15 (x60_apply_v1.py): Л-регістр важелів 1 -> 7 ключів (Л-01…Л-07) ·

  судиться на шести пунктах кураторського режиму (SPEC §8.2, П56) · канва

  blur знято як мертвий за версткою (§8.7-б) · підказки й заглушки перенесено

  база: AE/index.html md5 4c1a6a64468ee514b4ca37cd9b8bbed3 (дерево S53 §5, ланцюг із дев'яти рецептів);
        зліпок = outerHTML вузла «.v2 .shell > main», екрани picker + catalog,
        знято Chromium 1920×1080, 12.09.2026; CSS продукту — чотири теги «style»
        дослівно, єдина правка ":root" -> ":host" (одне входження, грепом).
  Зліпок нічого не вирішує (П50): власних кольорів, тіней і тонів не вносить,

  ВИРОК В-33 (оператор, ПК, 12.09.2026) зашитий дефолтами: острівець · штрихпунктир · радіус 28 ·
  відступ 16 · blur 0 · тінь 0 3px 2px 1px #1C1E242e · шапка plate · тіло canvas · низ як тіло · головна canvas
  Що тут Є: реальне лого АНЦ, керовані токени матеріальності, вісь оболонки, вісь розділювачів, звірка.

<style>
/* ══ 0 · шасі харнеса (не продукт) ═══════════════════════════════════ */
*{box-sizing:border-box}
body{margin:0;font:13px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;
     color:#1C1E24;background:#eceff1;display:flex;flex-direction:column;height:100dvh}
.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-start;max-height:150px;overflow:auto;
     padding:10px 14px;background:#fff;border-bottom:1px solid #d6dade;position:sticky;top:0;z-index:30}
.grp{display:flex;flex-direction:column;gap:4px}
.grp>label{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:#6E6E77}

.meter b.ok{color:#7ee3a8}.meter b.bad{color:#ff8f8f}
.stagewrap{flex:1 1 auto;min-height:0;display:flex;padding:14px}
.stage{flex:1 1 auto;min-height:560px;overflow:hidden;border:1px solid #d6dade;border-radius:10px;background:#fff}
/* КРОК 0 · важіль «кадр». Рамка стенда (padding 14 + кант + радіус 10 + білий фон)
   домальовувала ЩЕ ОДНУ картку поверх острівця, і саме її край око читало як
   третій шар. Вирок про «бутерброд» у такому кадрі був би вироком комбінації,
   якої в продукті немає (маніфест §8.7). Дефолт — край-в-край. */
body[data-frame="edge"] .stagewrap{padding:0}
body[data-frame="edge"] .stage{border:0;border-radius:0;background:transparent}
/* Д7 · службова шапка ховається цілком */
.hid{display:none!important}
.fold{position:sticky;top:0;z-index:31;display:flex;justify-content:flex-end;gap:8px;

.fold button{font:inherit;font-size:11.5px;padding:3px 9px;border:1px solid #c9d2cb;border-radius:6px;
             background:#fff;cursor:pointer;color:#4F4F4F}

/* ══ 1 · геометрія продукту · перенесено з index.html дослівно ════════
   джерела: :348 токени · :357 shell · :358 sidebar · :359-364 brand
            :365-368 side-link · :369-370 side-bottom · :723-724 лого
   ⚠ жодне з цих чисел не вигадане — усі зняті грепом. */
.v2{--ink:#1C1E24;--muted:#6E6E77;--line:#E7E7E7;--card:#fff;--green:#008ECC;--radius:14px;
    --anc-yellow:#FFE241;--anc-yellow-50:#FFF0A0;--anc-yellow-25:#FFF8D0;--anc-blue:#008ECC;
    --anc-blue-25:#BFE3F2;--anc-canvas:#FFFEF6;--anc-plate:#FFFCEC;--anc-text:#1C1E24;
    --anc-text-2:#4F4F4F;--anc-gray:#6E6E77;--anc-border:#E7E7E7;--anc-gray-light:#9B9CA1;
    color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,sans-serif;height:100%}
.v2 b+small{display:block}                                   /* :354 · В-22 */
.v2 *{box-sizing:border-box}
.v2 svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;
        stroke-linecap:round;stroke-linejoin:round}          /* :356 */
.v2 .shell{display:grid;grid-template-columns:220px minmax(0,1fr);height:100%;min-height:0;overflow:hidden}
.v2 .sidebar{display:flex;min-height:0;flex-direction:column;padding:20px 8px;overflow:auto;
             border-right:1px solid var(--line);background:var(--anc-canvas)}
.v2 .brand{display:flex;gap:11px;align-items:center;padding:0 14px 21px;border-bottom:1px solid var(--line)}
.v2 .brand-mark{display:grid;place-items:center;flex:0 0 auto;width:38px;height:38px;
                color:white;background:var(--anc-blue);border-radius:9px}
.v2 .brand-mark svg{width:21px;height:21px}
.v2 .brand b{display:block;font-size:17px;letter-spacing:-.03em}
.v2 .brand small{color:var(--muted);font-size:11px}
.v2 .side-links{display:grid;gap:3px;padding-top:18px}
.v2 .side-link{display:flex;align-items:center;gap:14px;width:100%;min-height:47px;padding:0 18px;
               color:var(--anc-text-2);text-align:left;border:0;border-left:3px solid transparent;
               border-radius:0 8px 8px 0;background:none;font:inherit;cursor:pointer}
.v2 .side-link.active{color:var(--anc-text);background:var(--anc-yellow-25);
                      border-left-color:var(--green);font-weight:700}
.v2 .side-link svg{width:21px}
.v2 .side-bottom{margin-top:auto;display:grid;gap:8px;padding:12px 10px 0}
.v2 .side-bottom button{display:flex;align-items:center;gap:9px;border:0;background:transparent;
                        color:var(--anc-gray);padding:9px;text-align:left;font:inherit;cursor:pointer}
.v2 main{min-width:0;min-height:0;overflow:auto}
/* :723-724 · лого на жовтому колі, знак — заливкою, не обведенням */
.v2 .brand-mark{background:var(--anc-yellow);color:var(--anc-blue);border-radius:50%}
.v2 .brand-mark svg{width:75%;height:75%;fill:currentColor;stroke:none}

/* ══ 2 · заповнювач головної зони (П48 — лише форма й щільність) ══════ */
.v2 .fill{padding:26px 30px}
.v2 .fill h1{margin:0 0 4px;font-size:22px;letter-spacing:-.02em}
.v2 .fill p{margin:0 0 22px;color:var(--muted);font-size:13px}
.v2 .fill .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.v2 .fill .ph{height:146px;border:1px solid var(--line);border-radius:12px;background:#fff}
/* ══ 2б · зліпок реального екрана (П50) ══════════════════════════════════
   Хост прозорий навмисне: тон головної зони лишається за важелем --isl-main.
   Ізоляція — shadow DOM, не префікси: правило продукту фізично не дотягнеться
   до острівця (В-33) і не скасує його мовчки. */
.v2 .snap{display:block;height:100%;overflow:hidden;background:transparent;border-radius:0}
/* G · у «врівень» і «лише панель» у main радіуса немає — зліпок різав кути там,
   де їх не має бути. Радіус живе тільки там, де живе кант. */
.v2[data-shell="island"] .snap{border-radius:var(--isl-radius)}

/* ══ 3 · ТОКЕНИ МАТЕРІАЛЬНОСТІ — важелі оператора ════════════════════
   Жоден із них не існує в продукті: у продукті тінь вшита числом шість разів
   (:382 :464 :500 :508 :528 :640). Тут вона вперше стає керованою.
   Пресет e1 = рівно те, що вже стоїть у продукті — не вигаданий. */
.v2{--isl-surface:#FFFEF6;
    --isl-border:#E7E7E7;
    --isl-border-w:1px;
    --isl-radius:28px;
    --isl-inset:16px;
    /* --isl-blur знято в КРОЦІ 0: backdrop-filter стояв на .sidebar, а в неї
       непрозорий background. Під панеллю не проїжджає нічого — мертвий за
       версткою, маніфест §8.7-б, перший приклад у списку. */
    --isl-shadow:0 3px 2px 1px #1C1E242e;
    --isl-canvas:#F6F5EE;
    --isl-head:#FFFCEC;      /* зона бренду · В-33 plate */
    --isl-foot:transparent;   /* зона замка  */
    --isl-main:#FFFEF6}      /* головна зона · В-33 canvas */
/* .head — обгортка фону шапки. Заливає панель до країв, НЕ чіпаючи .brand,
   тому звірка N1 (.brand height 79) лишається дійсною. */
.v2 .head{margin:-20px -8px 0;padding:20px 8px 0;background:var(--isl-head);
          border-radius:var(--isl-radius) var(--isl-radius) 0 0}
.v2 .side-bottom{background:var(--isl-foot);margin:auto -8px -20px;padding:12px 10px 20px;
                 border-radius:0 0 var(--isl-radius) var(--isl-radius)}
.v2[data-mode="rail"] .side-bottom{padding:12px 0 20px}
.v2[data-shell="flush"] .head,.v2[data-shell="flush"] .side-bottom{border-radius:0}

/* вісь оболонки: врівень (як у продукті) · острівець */
.v2[data-shell="island"] .shell{background:var(--isl-canvas);padding:var(--isl-inset);gap:var(--isl-inset);
                                grid-template-columns:var(--side-w) minmax(0,1fr)}
.v2[data-shell="island"] .sidebar{border:var(--isl-border-w) solid var(--isl-border);
                                  border-radius:var(--isl-radius);background:var(--isl-surface);
                                  box-shadow:var(--isl-shadow)}
.v2[data-shell="island"] main{border:var(--isl-border-w) solid var(--isl-border);
                              border-radius:var(--isl-radius);background:var(--isl-main);box-shadow:var(--isl-shadow)}
.v2[data-shell="flush"] .shell{grid-template-columns:var(--side-w) minmax(0,1fr)}
/* E · лік 0.3-А: правила фону головної у «врівень» не існувало взагалі —
   фарбували лише island і solo, і важіль тону давав 0,00 % піксельної різниці. */
.v2[data-shell="flush"] main{background:var(--isl-main)}
/* == вісь оболонки · третє положення «лише панель» (S54) ==============
   Питання оператора: чому головна зона стала другою карткою, всередині
   якої лежать ще картки. У продукті main власного фону НЕ має — фарбує
   .v2. Це положення знімає з main кант, радіус і тінь, лишаючи острівцем
   саму панель: рівнів глибини два замість трьох. */
.v2[data-shell="solo"] .shell{background:var(--isl-canvas);padding:var(--isl-inset);
                              gap:var(--isl-inset);grid-template-columns:var(--side-w) minmax(0,1fr)}
.v2[data-shell="solo"] .sidebar{border:var(--isl-border-w) solid var(--isl-border);
                                border-radius:var(--isl-radius);background:var(--isl-surface);
                                box-shadow:var(--isl-shadow)}
.v2[data-shell="solo"] main{border:0;border-radius:0;background:var(--isl-main);box-shadow:none}

/* == вісь оболонки · ЧЕТВЕРТЕ положення «без оболонки» (Х29-а) =========
   В-39: рівнів глибини два — фон + острівці. Проміжна поверхня знімається
   ЦІЛКОМ: канва .shell, її padding, фон/кант/радіус/тінь main. П62: це
   знімає ШАР, а не обвід, — тим і відрізняється від «лише панель» (В-38).
   Фон малює сам .v2 наявним важелем «тон · головна» (--isl-main): нового
   токена не заведено навмисно, інакше В-35 судився б удруге на новому
   предметі. Дім (12.11): state.shell → data-shell на .v2. */
.v2[data-shell="bare"]{background:var(--isl-main)}
.v2[data-shell="bare"] .shell{background:transparent;padding:0;gap:var(--isl-inset);
                              grid-template-columns:var(--side-w) minmax(0,1fr)}
.v2[data-shell="bare"] .sidebar{border:var(--isl-border-w) solid var(--isl-border);
                                border-radius:var(--isl-radius);background:var(--isl-surface);
                                box-shadow:var(--isl-shadow)}
.v2[data-shell="bare"] main{border:0;border-radius:0;background:transparent;box-shadow:none}

/* вісь РЕЙКИ (Х29-а) · вимога оператора №2: відчепити рейку від краю екрана.
   «у поле» дає ліворуч той самий зазор, що між рейкою і контентом (--isl-inset).
   Живе ТІЛЬКИ без оболонки: в острівці й лише-панелі рейку вже відсунув
   padding .shell — інакше це був би важіль, мертвий за версткою (§8.7-б).
   ⚠ M3 тримає рейку на провідному краї екрана: це свідоме відхилення,
   яке мусить бути записане вироком, а не протягнуте мовчки. */
.v2[data-shell="bare"][data-rail="field"] .shell{padding-left:var(--isl-inset)}

/* ══ ВЕРТИКАЛЬНА ПОЗИЦІЯ РЕЙКИ (Х29-а2) ══════════════════════════════
   M3 дозволяє вирівнювати групу призначень рейки по верху, центру або низу,
   а шапку з логотипом тримати прибитою вгорі — обидва положення нижче канонічні.
   ⚠ Центр міряється від .shell, а .shell сьогодні дорівнює вікну (body{height:100dvh},
     лік S55). Коли Х29-б винесе шапку окремим РЯДКОМ гріда, центр почне мірятись
     від залишку: рейці тоді знадобиться grid-row:1/-1, інакше вирок поїде мовчки.
   transform, а не margin: не рухає розкладку, тому замір зазорів лишається дійсним,
   і відсотки в margin-top (які рахуються від ШИРИНИ) не стають пасткою. */
.v2[data-railpos="center"] .sidebar{transform:translateY(var(--rail-shift,0px))}
/* центр групи: лого вгорі, замок унизу, пункти посередині.
   side-bottom віддає свій margin-top:auto, інакше три «auto» ділять вільне
   місце на три частини і група стоїть на 1/3, а не по центру. */
/* ⚠ [data-shell][data-mode] тут НЕ прикраса: правило «висоти панелі»
   (.v2[data-fit][data-shell] .sidebar) має вагу 0,3,0 і стоїть НИЖЧЕ —
   без добору ваги воно перебивало stretch, і важіль був мертвий за
   каскадом (§8.7-в). Спіймано заміром, не оком: числа збіглися з «верхом». */
.v2[data-railpos="group"][data-shell][data-mode] .sidebar{align-self:stretch}
.v2[data-railpos="group"][data-shell] .side-links{margin-top:auto;margin-bottom:auto}
.v2[data-railpos="group"][data-shell] .side-bottom{margin-top:0}

/* ══ КУТИ РЕЙКИ (Х29-а3) ══════════════════════════════════════════════
   Вимога оператора: сторона, повернута до краю екрана, рівна; скруглюється
   лише та, що дивиться в бік контексту. Величина лишається на ОДНОМУ
   повзунку «радіус» — тут вона тільки роздається по двох сторонах,
   інакше з'явився б другий орган на ту саму величину (§8.5).
   Дім (12.11): state.corners → data-corners на .v2; токени --isl-r-* — тут. */
.v2{--isl-r-l:var(--isl-radius);--isl-r-r:var(--isl-radius)}
.v2[data-corners="right"]{--isl-r-l:0px}
/* :not(flush) — у «врівень» рейка є борт вікна і радіуса не має зовсім;
   вага 0,4,0 навмисна: правила оболонки нижче мають 0,3,0 (§8.7-в). */
.v2[data-shell]:not([data-shell="flush"]) .sidebar{
   border-radius:var(--isl-r-l) var(--isl-r-r) var(--isl-r-r) var(--isl-r-l)}
.v2:not([data-shell="flush"]) .head{border-radius:var(--isl-r-l) var(--isl-r-r) 0 0}
.v2:not([data-shell="flush"]) .side-bottom{border-radius:0 0 var(--isl-r-r) var(--isl-r-l)}

/* вісь розділювачів */
.v2[data-rule="solid"] .brand,.v2[data-rule="solid"] .side-bottom{border-color:var(--line)}
.v2[data-rule="dash"] .brand{border-bottom-style:dashed}
.v2[data-rule="dash"] .side-bottom{border-top:1px dashed var(--line)}
.v2[data-rule="none"] .brand{border-bottom:0}
.v2[data-rule="solid"] .side-bottom,.v2[data-rule="none"] .side-bottom{border-top:0}
.v2[data-rule="solid"] .side-bottom{border-top:1px solid var(--line)}

/* стан панелі · ширина 72 — тимчасова, вибір 64/72 судиться в кроці 2 */
.v2{--side-w:220px}
.v2[data-mode="rail"]{--side-w:72px}
.v2[data-mode="rail"] .brand{padding:0 0 21px;justify-content:center}
.v2[data-mode="rail"] .brand .brand-text{display:none}
.v2[data-mode="rail"] .side-link{gap:0;padding:0;justify-content:center;border-left-width:0;border-radius:8px}
.v2[data-mode="rail"] .side-link .lbl{display:none}
.v2[data-mode="rail"] .side-bottom button{justify-content:center;gap:0;padding:9px 0}
/* ══ Х27 · ЗАМОК КУРАТОРА РІВНЯЄТЬСЯ З ПУНКТОМ (борг S59 §0.4-А) ═════════════
   Дефект жив ЛИШЕ в розгорнутій панелі: іконка замка стояла на 10 px лівіше
   іконки пункту, підпис — на 16 px. Заміряно, не обчислено.
   Правило стоїть ПІСЛЯ rail-правила вище і має нижчу специфічність (0,2,1
   проти 0,3,1), тож рейка 72 лишається центрованою. */
.v2 .side-bottom button{padding-left:19px;gap:14px}
.v2 .side-bottom button svg{width:21px}
.v2[data-mode="rail"] .side-bottom .lbl{display:none}
.v2 .brand-mark:focus-visible,.v2 .side-link:focus-visible,.v2 .side-bottom button:focus-visible{
   outline:2px solid var(--anc-blue);outline-offset:-2px}   /* П47: offset назовні обрізався б overflow:auto */
.v2 .brand-mark{cursor:pointer;border:0;padding:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ══ 4 · КРОК 0 · висота панелі ═══════════════════════════════════════
   У продукті панель — борт вікна, і тягнутись на всю висоту правильно.
   В острівці панель — картка, і картка мусить жити по своєму вмісту.
   ⚠ П56: вирок про цю висоту виноситься на НАЙДОВШОМУ режимі — шість
   пунктів кураторського (SPEC §8.2), не на чотирьох, що стояли в стенді.
   align-self, а не align-items: інакше по вмісту скоротилась би й main. */
.v2[data-fit="content"][data-shell="island"] .sidebar,
.v2[data-fit="content"][data-shell="bare"] .sidebar,
.v2[data-fit="content"][data-shell="solo"] .sidebar{align-self:start;overflow:visible}
/* margin-top:auto притискав замок до низу — при короткій панелі тримати нічого */
.v2[data-fit="content"][data-shell="island"] .side-bottom,
.v2[data-fit="content"][data-shell="bare"] .side-bottom,
.v2[data-fit="content"][data-shell="solo"] .side-bottom{margin-top:12px}

/* ══ 5 · підказка й заглушки — перенесено з AE_X27_SIDEBAR_v2.html ════
   Дослівно (Д-В2: значення копіюються з живого коду, не відтворюються).
   Тултип окремим шаром, не ::after: .sidebar має overflow:auto (:63)
   і обрізав би псевдоелемент. */
#tip{position:fixed;z-index:99;padding:5px 9px;border-radius:6px;color:#fff;background:#1C1E24;

.v2 .side-link.stub{color:var(--anc-gray-light);cursor:default}
.v2[data-stub="hidden"] .stub{display:none}

<template id="snapCSS"><style>/* ── блок продукту: (no-id) ── */

/* ── Палітра і шрифт. Під брендбук АНЦ міняються лише ці значення. ── */
:host{
  --paper:#F1F4F1; --ink:#16211C; --soft:#5E6E66; --line:#C9D2CB;
  --vtm:#0F6B4A; --zf:#A0761B; --loss:#A8402B; --tape:#FBFCFA;

  /* Радіуси — шкалою, не літералами. Три ролі: велика поверхня,
     орган керування, бульбашка розмови. Підкрутити вигляд усього
     застосунку = змінити тут три числа. */
  --r-lg:16px;   /* картки, brief, чек, помилка, жовта панель */
  --r-md:12px;   /* кнопки, поля, textarea, «назад» */
  --r-bub:14px;  /* репліки в розмові */
  --chat:#E7ECE8;   /* фон панелі розмови: темніший за сторінку й за бульбашку */

  /* Прес. Натиск різкий і короткий, повернення довше і з пружиною —
     тому дві різні тривалості, а не одна. */
  --press-in:90ms; --press-out:280ms;
  --press-ease:cubic-bezier(.34,1.5,.64,1);
}
*{box-sizing:border-box}

/* ── АНТИ-ВЕБ-ПАТЕРН ──────────────────────────────────────────────
   Щоб застосунок не видавав себе за веб-сторінку: без виділення
   тексту пальцем, без меню по довгому натисканню, без сірого
   спалаху по тапу, без гумового відскоку сторінки, без зуму
   подвійним тапом. Поля вводу — виняток, там усе це потрібне. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;overscroll-behavior:none}
body{
  -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
input,textarea{
  -webkit-user-select:text; user-select:text;
  -webkit-touch-callout:default;
}
img{-webkit-user-drag:none;user-drag:none;pointer-events:none}
/* Текст, який має сенс копіювати руками — розбір і репліки клієнта */
.turn,.brief dd,.tape{-webkit-user-select:text;user-select:text}
body{font-family:"Inter","Segoe UI",-apple-system,system-ui,sans-serif;color:var(--ink);
  background:var(--paper);min-height:100dvh;font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:24px 18px calc(60px + env(safe-area-inset-bottom,0px))}
.num{font-family:"SFMono-Regular","Consolas",monospace;font-variant-numeric:tabular-nums}
.hide{display:none !important}

.lede{max-width:60ch;margin:0 0 6px;font-size:27px;font-weight:620;letter-spacing:-.02em}
.sub{max-width:64ch;color:var(--soft);margin:0 0 22px}

button{font:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
/* Ряд фільтрів — один рядок із горизонтальним скролом, а не три абзаци.
   Від'ємні поля прорізають падінг .wrap, щоб ряд ішов від краю екрана
   до краю: інакше він обривається всередині сторінки і читається як
   помилка верстки. Маска гасить чипи саме на краях. */
.tabs{display:flex;flex-wrap:nowrap;gap:6px;margin:0 -18px 16px;padding:2px 18px 4px;
  overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
  /* Снапу тут свідомо НЕМАЄ. На iOS scroll-snap вимикає інерцію скролу
     (WebKit 243582): кожен свайп зупиняється на найближчому чипі, і ряд
     з 7 фільтрів доводиться гортати трьома рухами замість одного кидка.
     Снап доречний каруселі, де кадр мусить стати рівно; список фільтрів
     гортають, а не гортають по кадру. */
  scrollbar-width:none;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%);
          mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;white-space:nowrap;
  font-size:13.5px;padding:6px 13px;border:1px solid var(--line);
  background:#fff;border-radius:20px;cursor:pointer;color:var(--soft);
  transition:transform var(--press-out) var(--press-ease)}
.tabs button:active{transform:scale(.92);transition:transform var(--press-in) ease-out}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#EEF2EF;border-color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px 16px;
  text-align:left;cursor:pointer;color:inherit;display:flex;flex-direction:column;gap:7px;
  transition:transform var(--press-out) var(--press-ease)}
/* Картка велика — натиск має бути ледь помітним. Що більший елемент,
   то меншу частку розміру він втрачає під пальцем. */
.card:active{transform:scale(.985);transition:transform var(--press-in) ease-out}
/* hover лише там, де є миша: на iOS він «залипає» після тапу */
@media(hover:hover){.card:hover{border-color:var(--ink)}}
.card:focus-visible{outline:2px solid var(--vtm);outline-offset:2px}
.ord{font-size:12.5px;color:var(--soft);letter-spacing:.03em}
.card h3{margin:0;font-size:16.5px;font-weight:600}
.card p{margin:0;color:var(--soft);font-size:13.5px}
.cardfoot{margin-top:auto;padding-top:9px;border-top:1px dashed var(--line);
  font-size:13px;display:flex;justify-content:space-between;gap:10px}
.trap{color:var(--loss)}

/* Шапка екрана — завжди дві сходинки: ряд керування, під ним заголовок.
   Раніше кнопка й заголовок стояли в одному рядку з переносом, тому
   довга назва сценарію штовхала верстку і шапка стрибала між одним
   і двома рядками залежно від довжини тексту. Довжина назви не має
   керувати розкладкою. */
.top{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.toptitle{margin:0;font-size:20px;font-weight:620;letter-spacing:-.01em;
  max-width:34ch;line-height:1.25}
/* «Назад» — орган керування, а не посилання в тексті: у застосунку
   підкреслений текст читається як веб-сторінка. Шеврон — інлайновий
   SVG, не символ і не емодзі: гліф ← у різних шрифтах різного розміру. */
.back{display:inline-flex;align-items:center;gap:5px;
  background:#fff;border:1px solid var(--line);color:var(--soft);cursor:pointer;
  border-radius:var(--r-md);padding:6px 12px 6px 9px;font-size:13.5px;line-height:1;
  text-decoration:none;transition:transform var(--press-out) var(--press-ease)}
.back:active{transform:scale(.94);transition:transform var(--press-in) ease-out}
.back svg{width:14px;height:14px;flex:0 0 auto;display:block}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 302px;gap:22px;align-items:start}
/* minmax(0,1fr), а не 1fr. У CSS Grid колонка `1fr` має min-width:auto —
   тобто вона роздувається під найширшу дитину і тягне за собою всю
   сторінку. Десктопне правило вище це враховує, мобільне — ні, тому
   будь-яка дитина, ширша за колонку, робила сторінку ширшою за екран:
   з'являвся горизонтальний скрол, і все «прилипало» до правого краю. */
@media(max-width:880px){.stage{grid-template-columns:minmax(0,1fr)}}

.brief{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:13px 16px;margin-bottom:14px;font-size:13.5px}
.brief dl{display:grid;grid-template-columns:96px 1fr;gap:3px 12px;margin:0}
.brief dt{color:var(--soft)}
.brief dd{margin:0}

/* Згортання довгих рядків брифінгу («Настрій», «Ціль»).
   ⚠ Згорнуте — це max-height:0, а НЕ display:none. dl тут grid у дві
   колонки, елементи лягають потоком: зникла dd звільняє другу колонку,
   і наступний dt заїжджає в неї — розкладка розсипається. Нульова
   висота лишає dd у сітці, колонка зайнята. */
.brief dt.fold{display:flex;align-items:center;gap:5px;cursor:pointer;
  padding:6px 0;margin:-6px 0;user-select:none;-webkit-user-select:none;
  -webkit-tap-highlight-color:transparent}
.brief dt.fold .chev{flex:0 0 auto;transition:transform 240ms cubic-bezier(.32,.72,0,1)}
.brief dt.fold[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.brief dd.fold-b{max-height:340px;overflow:hidden;
  transition:max-height 240ms cubic-bezier(.32,.72,0,1),opacity 150ms linear}
.brief dd.fold-b[data-open="0"]{max-height:0;opacity:0}
@media(prefers-reduced-motion:reduce){
  .brief dt.fold .chev,.brief dd.fold-b{transition:none}
}

/* ── ПАНЕЛЬ РОЗМОВИ ───────────────────────────────────────────────
   Репліки й поле вводу жили просто на сторінці, тому екран читався як
   «текст, поле і кнопка», а не як переписка. Тепер вони в одній
   заглибленій панелі: фон трохи темніший за сторінку, поле вводу —
   білою смугою, притиснутою до низу панелі. Це та сама форма, яку
   людина щодня бачить у месенджері, і впізнає без пояснень.
   Фон панелі мусить бути ТЕМНІШИЙ за білу бульбашку клієнта — інакше
   репліки зникають у ньому. */
.chat{background:var(--chat);border:1px solid var(--line);border-radius:var(--r-lg);
  margin-bottom:14px;overflow:hidden}
/* Від'ємних полів усередині панелі немає свідомо: смуга вводу притиснута
   до країв не витягуванням себе за батька, а тим, що падінг живе на
   внутрішньому блоці. Дитина, ширша за батька, — це те, що ламало сітку. */
.chat-body{padding:12px 12px 0}
.chat-h{display:flex;align-items:center;gap:8px;padding:2px 3px 10px;
  font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--soft)}
.chat-h::after{content:'';flex:1;height:1px;background:var(--line)}
.chat-hint{font-size:12.5px;color:var(--soft);text-align:center;padding:2px 12px 4px}
.log{display:flex;flex-direction:column;gap:12px;margin-bottom:12px;min-height:88px}

/* Крапки «клієнт друкує». Раніше очікування показувала тільки кнопка,
   яка ставала «…» — тобто відповідь готувалась не там, де вона зʼявиться. */
.dots{display:inline-flex;gap:4px;align-items:center;height:14px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--soft);
  animation:dot 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
@media(prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.5}}
.turn{max-width:82%;padding:10px 14px;border-radius:var(--r-bub);white-space:pre-wrap;
  overflow-wrap:anywhere}
.client{background:#fff;border:1px solid var(--line);align-self:flex-start}
.me{background:var(--ink);color:#EEF2EF;align-self:flex-end}
/* РОЗБІР писав наставник, а не клієнт — але виглядав він як репліка
   клієнта, у такій самій білій бульбашці. Читалось так, ніби це клієнт
   раптом заговорив про «принцип лаконічності». Даємо йому власну форму:
   на всю ширину, без хвоста бульбашки, з зеленою межею збоку. */
.review{align-self:stretch;max-width:100%;background:#fff;
  border:1px solid var(--line);border-left:3px solid var(--vtm);
  border-radius:var(--r-bub)}
.review .who{color:var(--vtm)}
.phrase{display:block;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);
  font-size:13.5px}
.phrase b{color:var(--soft);font-weight:600}
.sys{align-self:center;color:var(--soft);font-size:13px;font-style:italic;text-align:center;max-width:90%}
.who{display:block;font-size:11.5px;letter-spacing:.04em;color:var(--soft);margin-bottom:3px}
.me .who{color:#93A79B}

.say{display:flex;gap:8px;align-items:flex-end;
  padding:10px 12px;background:#fff;border-top:1px solid var(--line)}
.say textarea{flex:1;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-md);
  resize:vertical;min-height:62px;background:#fff;color:inherit}
.btn{padding:10px 18px;border:1px solid var(--ink);background:var(--ink);color:#EEF2EF;
  border-radius:var(--r-md);cursor:pointer;
  transition:transform var(--press-out) var(--press-ease)}
.btn:active{transform:scale(.96);transition:transform var(--press-in) ease-out}
.btn[disabled]:active{transform:none}
.btn[disabled]{opacity:.45;cursor:default}
.btn.ghost{background:#fff;color:var(--ink)}

.tape{background:var(--tape);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;
  position:sticky;top:16px;font-size:13.5px}
.tape h4{margin:0 0 10px;font-size:12.5px;letter-spacing:.05em;color:var(--soft);text-transform:uppercase}
.tapeline{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.tapeline.total{border-top:1px solid var(--line);margin-top:8px;padding-top:8px;font-weight:600}
.big{font-size:19px}
.bignum{font-size:32px;font-weight:640;letter-spacing:-.02em}
.tag{font-size:10.5px;padding:1px 5px;border-radius:2px;margin-left:6px;vertical-align:1px}
.t-vtm{background:var(--vtm);color:#fff}
.t-zf{background:var(--zf);color:#fff}
.t-none{background:var(--line);color:var(--ink)}

/* ── Редактор даних (крок Р-1а) ───────────────────────────────────
   Картка САМА не клікається й після Р-1б: усередині неї живе <details>
   із рядками правил, і натиск по всій площі зʼїдав би акордеон — тобто
   одна зона відповідала б на два різні наміри. Вхід у поля — окремою
   кнопкою в підвалі картки. Тому cursor і натиск .card перебиваються. */
.elist{display:grid;grid-template-columns:repeat(auto-fill,minmax(292px,1fr));gap:12px}
.ecard{cursor:default}
.ecard:active{transform:none}
/* Стан картки — той самий словник кольорів, що й у панелі перевірки
   (✓ зелений · ⚠ приглушений · ✗ втрата). Другої палітри для того
   самого вердикту не заводимо: два кольори одного ✗ читались би як
   два різні ✗. */
.est{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.emood{margin:0;color:var(--soft);font-size:13px;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.eline{margin:0;font-size:13.5px;line-height:1.45}
/* Смуга публікації має ВЛАСНИЙ клас, хоч виглядає так само, як рядок
   вердикту. .eline — це рядок, сказаний правилами; гейт рахує їх і звіряє
   суму з вердиктом. Смуга стану, одягнена в той самий клас, додалась би
   до цієї суми й почервонила б твердження про зовсім інший предмет. */
.publine{margin:0;font-size:13.5px;line-height:1.45}
.pubbar{margin:0 0 4px}

.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:13px;color:var(--soft);margin-bottom:4px}
/* 16px на полях — не смак: Safari на iOS підʼїжджає зумом до будь-якого
   поля, дрібнішого за 16, і повернути масштаб назад користувач мусить
   руками. Тому те саме число стоїть на input, textarea і select. */
.field input,.field textarea,.field select{width:100%;max-width:420px;font:inherit;font-size:16px;
  padding:9px 12px;border:1px solid var(--line);
  border-radius:var(--r-md);background:#fff;color:inherit}
.field textarea{resize:vertical;min-height:64px;line-height:1.4}
/* Рідний вигляд select на iOS — сірий прямокутник системного кольору;
   appearance:none знімає його, шеврон домальовується фоном. */
.field select{-webkit-appearance:none;appearance:none;padding-right:34px;
  background-image:linear-gradient(45deg,transparent 50%,var(--soft) 50%),
    linear-gradient(135deg,var(--soft) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.field .flab{display:flex;justify-content:space-between;align-items:baseline;gap:10px;max-width:420px}
.field .flab b{font-weight:600;color:var(--ink)}

/* Підказка правила — під полем, а не в спливному вікні: на телефоні
   вікно ховає рівно те поле, заради якого його відкрили. */
.ehint{max-width:420px;margin:6px 0 0;padding:0 0 0 16px;font-size:12.5px;
  line-height:1.5;color:var(--soft)}
.ehint li{margin:0 0 1px}
.ecount{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--soft)}
.ecount.over{color:var(--loss)}
/* Рядки, які правити не можна, і причина цього — поруч, а не мовчки. */
.ero{max-width:420px;margin:0 0 14px}
.ero .tapeline span:last-child{color:var(--ink);text-align:right;word-break:break-word}
.enote{max-width:520px;margin:0 0 14px;font-size:13px;line-height:1.5;color:var(--soft)}
.everd{max-width:520px;margin:0 0 14px}
.echip{display:inline-block;font-size:12px;padding:1px 7px;border-radius:999px;
  border:1px solid var(--line);color:var(--soft);white-space:nowrap}

/* ── ВИБІРНИК КОДІВ (Р-1г-1) ───────────────────────────────────────
   Обране показується НАЗВАМИ: у файлі живе код, у голові людини —
   назва товару. Код лишається поруч дрібним, бо саме ним говорять
   правила, і людина мусить упізнати рядок вироку. */
.pick{max-width:420px}
.picksel{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
/* Назва обраного НЕ обрізається. «Стрепсілс інтенсив 8,75 мг №16» —
   дозування й кількість стоять у хвості рядка, і обрізана назва в
   аптечному каталозі це інший товар. Тому white-space тут скинутий,
   хоч .echip його й тримає. */
.picksel .echip{white-space:normal;text-align:left}
.pickno{font-size:12.5px;color:var(--soft)}
/* Пул під cats буває до 52 позицій. Без власної прокрутки три вибірники
   розтягли б картку на кілька екранів, і вирок правил унизу перестав би
   бути видимим разом із вибором. */
.picklist{max-height:38dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  margin:0 0 4px;border-top:1px dashed var(--line)}
.pickitem{display:flex;gap:9px;align-items:flex-start;padding:8px 2px;
  border-bottom:1px dashed var(--line);cursor:pointer}
.pickitem:last-child{border-bottom:none}
.pickitem input{flex:0 0 auto;width:19px;height:19px;margin:1px 0 0;accent-color:var(--vtm)}
.pickitem .pn{flex:1;min-width:0;font-size:14px;color:var(--ink);line-height:1.35}
.pickitem .pc{flex:0 0 auto;font-size:12px;color:var(--soft);
  font-variant-numeric:tabular-nums;text-align:right;padding-top:1px}
/* Рядок сум під bv/bm. Це ЧИСЛО, а не вирок: вирок про приріст каже
   правило, і його рядок стоїть нижче у вердикті. Тому кольору тут
   немає — пофарбоване число стало б другою оцінкою того самого. */
.pickgain{max-width:420px;margin:2px 0 0;font-size:12.5px;color:var(--soft);
  font-variant-numeric:tabular-nums}

/* Акордеон. Технічний текст потрібен рідко, а місця на телефоні їсть
   багато: тримаємо його згорнутим. Нативний <details> — щоб не писати
   свій перемикач; дефолтний трикутник Safari гаситься окремим правилом,
   інакше маркерів буде два. */
.acc{border:1px solid var(--line);border-radius:var(--r-md);background:#fff;
  padding:0 14px;margin:0 0 14px;max-width:520px}
.acc summary{list-style:none;cursor:pointer;padding:11px 0;font-size:13.5px;
  color:var(--soft);display:flex;align-items:center;justify-content:space-between;gap:10px}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:'';width:7px;height:7px;flex:0 0 auto;margin-right:2px;
  border-right:1.6px solid var(--soft);border-bottom:1.6px solid var(--soft);
  transform:rotate(45deg) translate(-2px,-2px);transition:transform .18s ease}
.acc[open] summary::after{transform:rotate(-135deg) translate(-2px,-2px)}
.acc .accbody{padding:0 0 13px;font-size:13.5px;color:var(--soft)}
.acc .accbody p{margin:0 0 8px}
.acc .accbody p:last-child{margin:0}
.acc .tapeline{font-size:13px}

.mock{margin-top:22px;border:1px dashed var(--zf);border-radius:var(--r-lg);padding:12px 14px;background:#FFFDF6}
.mock h4{margin:0 0 4px;font-size:12.5px;letter-spacing:.05em;color:var(--zf);text-transform:uppercase}
.mock p{margin:0 0 10px;font-size:12.5px;color:var(--soft)}
.mock label{display:block;font-size:13px;padding:2px 0;cursor:pointer}
.mockcols{columns:2;column-gap:20px}
@media(max-width:640px){.mockcols{columns:1}}

.err{background:#FDF3F1;border:1px solid var(--loss);color:var(--loss);
  border-radius:var(--r-lg);padding:10px 14px;margin-bottom:14px;font-size:13.5px}

/* ── блок продукту: v2-css ── */

/* ═══ v2 · ПК-дизайн (SPEC v0.4) — корінь .v2 · Х21 крок 1 · Х22.1 · Х23.1 · Х24.1 ═══
   Джерело: mockup_X21_v1.html, лише правила, що чіпають DOM оболонки, E6, E1, E2 і E3
   (відбір — v2_probe_v4.js у jsdom: E6 6 станів, E1 7, E2 8 + тост, E3 3; правило з влученням їде цілим списком).
   Класи-двійники старого CSS перейменовані: .tag → .v2-tag · .trap → .v2-trap · .back → .v2-back · .tabs → .v2-tabs. Генерується v2css_port_v3.py — руками не править.

   Геометрія — дзеркало .brand: плитка 38 px стоїть на тій самій вертикалі (8 + 6 + 8 = 8 + 14), відступ 11 px. */

   живе доки: макет не отримав скрол списку (тоді — у порт, П13)

   на 1536×734 чек втрачав ~100 px, список не скролився зовсім. Тепер колонка — flex; чек не стискається; панель
   пропозицій стискається (0 1 auto: поки все вміщається, вигляд той самий — wsd 1.18), скролиться лише .proposals.
   Вирок А (S45): панель не нижча за 381 px = «хром» 245 (шапка + пошук + вкладки + низ, заміряно Chromium)
   + 2 рядки списку 2×68 = 136 — ЧИСЛО ДО DEVICE (1.17). min-content тут не працює: інтринсик-висота
   скрол-списку = весь його вміст (заміряно: панель росла до 12 514 px). Порожній пошук лишає під
   «Нічого не знайдено» порожнє місце до мінімуму — назване, не дефект. Коли чек + мінімум
   пропозицій не вміщаються, колонка скролиться як запасний вихід — сховане = відсутнє, тож нічого не обрізаємо.
   ≤980 не чіпаємо (§11.8). Третій блок — .mock (?mock, П27): сітка на два ряди тут не годилась.

<script>

var state = { shell:'bare', rule:'dash', mode:'rail', elev:'custom',

var LV = null;

var SETS = {

  '4': [['i-play','Тренування',0],['i-doc','Сценарії',1],['i-box','Каталог',0],['i-bars','Результати',1]],
  '6': [['i-grid','Дашборд',1],['i-doc','Сценарії',1],['i-box','Каталог',1],
        ['i-chip','AI / Моделі',1],['i-chat','Промпти',1],['i-gear','Система',1]]
};

function paintRow(ax, v){
  var row = document.querySelector('[data-ax="'+ax+'"]'); if(!row) return;
  var bs = row.querySelectorAll('button');
  for(var i=0;i<bs.length;i++) bs[i].setAttribute('aria-pressed', bs[i].dataset.v===v?'true':'false');
}
function hex2(n){ var s=Math.round(n).toString(16); return s.length<2?'0'+s:s; }
function shadow(){
  var y=+g('rY').value, b=+g('rBl').value, s=+g('rSp').value, a=+g('rA').value;
  g('oY').textContent=y+'px'; g('oBl').textContent=b+'px';
  g('oSp').textContent=s+'px'; g('oA').textContent=(a/100).toFixed(2);
  var v = (y===0&&b===0&&a===0) ? 'none' : '0 '+y+'px '+b+'px '+(s?s+'px ':'')+'#1C1E24'+hex2(a/100*255);
  V2.style.setProperty('--isl-shadow', v);
  return v;
}
function g(id){ return document.getElementById(id); }
function apply(){
  V2.dataset.shell=state.shell; V2.dataset.rule=state.rule; V2.dataset.mode=state.mode;
  V2.dataset.fit=state.fit; V2.dataset.stub=state.stub; V2.dataset.set=state.set;
  V2.dataset.rail=state.rail; V2.dataset.railpos=state.railpos;
  V2.dataset.corners=state.corners;
  document.body.dataset.frame=state.frame;
  var L=g('logo'), open = state.mode==='expanded';

    .forEach(function(k){ paintRow(k, state[k]); });
  paintPage();
  paintNav();
  measure();
}
var rows=document.querySelectorAll('[data-ax]');
for(var i=0;i<rows.length;i++) rows[i].addEventListener('click', function(e){
  var b=e.target.closest('button'); if(!b) return;
  var ax=this.dataset.ax;
  if(ax==='elev'){ var p=ELEV[b.dataset.v];
    g('rY').value=p[0]; g('rBl').value=p[1]; g('rSp').value=p[2]; g('rA').value=p[3]; shadow(); }
  state[ax]=b.dataset.v;
  if(ax==='set') build();
  apply();

/* Д8 · логотип нарешті працює. Flip — крок 3, тут лише перемикання стану. */
/* ══ зліпок реального екрана · S54 крок 1 (П50) ═══════════════════════════
   Ізоляція shadow DOM. Обгортка .v2 всередині тіні обов'язкова: усі правила
   продукту писані як ".v2 …", а зовнішній .v2 крізь межу тіні не видно. */
var SNAP = {ok:false, why:'не запускалось', screen:'picker'};
function snapMount(name){
  var host = g('snapHost'); if(!host) { SNAP.why='немає хоста'; return; }
  try{
    var root = host.shadowRoot || host.attachShadow({mode:'open'});
    var tplCSS = g('snapCSS'), tplSpr = g('snapSprite'), tpl = g('snap'+name.charAt(0).toUpperCase()+name.slice(1));
    if(!tplCSS || !tpl){ SNAP.why='немає лотка'; return; }
    root.innerHTML = '';
    root.appendChild(tplCSS.content.cloneNode(true));
    root.appendChild(tplSpr.content.cloneNode(true));
    var box = document.createElement('div'); box.className = 'v2';
    box.appendChild(tpl.content.cloneNode(true));
    root.appendChild(box);
    /* Х27 хід А · канал важелів сторінки. ОСТАННІМ вузлом тіні: при рівній
       специфічності виграє останнє правило, інакше — 8.7-в «мертвий за каскадом».
       Шаблонів зліпка не чіпає: це окремий вузол style, а не правка snapCSS. */
    LV = document.createElement('style'); LV.id = 'lv-page';
    root.appendChild(LV); paintPage();
    host.firstElementChild && host.firstElementChild.remove();   /* геть запасний заповнювач */
    SNAP.ok = !!root.querySelector('.v2 .page'); SNAP.screen = name;
    SNAP.why = SNAP.ok ? 'ok' : 'лоток порожній';
  }catch(e){ SNAP.why = 'shadow: ' + e.message; }
}
function snapChecks(){
  var host = g('snapHost'), main = V2.querySelector('main'), shell = V2.querySelector('.shell');
  var r = [];
  r.push(['зліпок змонтовано', SNAP.ok, SNAP.why]);
  /* правило продукту НЕ дістає за межі тіні: поза shadow вузлів зліпка немає */
  r.push(['витоку за межі тіні немає', document.querySelector('.scenario-item')===null
          && document.querySelector('.page')===null, 'поза тінню']);
  /* Попередня редакція питала getComputedStyle(main) і світила зелене на
     важелі, якого око не бачило: обгортка зліпка його накривала (Д-И). */
  var toneEl = state.shell==='bare' ? V2 : main;
  var want = g('tMain').value, got = getComputedStyle(toneEl).backgroundColor;
  r.push(['важіль тону оголошений', hex(got)===want.toUpperCase(), got]);
  var vis = toneVisible(main);
  r.push(['тон видно на екрані', vis > 0, vis.toFixed(1) + ' % площі головної']);
  /* хост нічого не фарбує — інакше він вирішував би тон замість важеля (П50) */
  var hb = getComputedStyle(host).backgroundColor;
  r.push(['хост прозорий', hb==='rgba(0, 0, 0, 0)' || hb==='transparent', hb]);
  /* П45 · третє число ОБЧИСЛЕНЕ, не скопійоване з правила, яке ми переносили */
  var inset = parseFloat(getComputedStyle(V2).getPropertyValue('--isl-inset')) || 0;
  var bw    = Math.round(parseFloat(getComputedStyle(main).borderTopWidth)) || 0;
  var pad2  = (state.shell==='island'||state.shell==='solo') ? inset : 0;
  var want2 = shell.clientHeight - pad2*2 - bw*2, got2 = main.clientHeight;
  r.push(['висота main = сцена − відступ×2 − кант×2', Math.abs(want2-got2)<=1, got2+' / '+want2]);
  return r;
}
function hex(rgb){ var m=rgb.match(/\d+/g); if(!m) return rgb;
  return '#'+m.slice(0,3).map(function(x){return ('0'+(+x).toString(16)).slice(-2);}).join('').toUpperCase(); }
/* Частка площі головної зони, де тон реально проступає: сітка проб, у кожній
   спускаємось у тінь і йдемо вгору предками — якщо хоч один непрозорий, точка
   закрита. Рахуємо DOM-ом, без канви: стенд мусить жити з file://. */
function toneVisible(main){
  var host = g('snapHost'); if(!host || !host.shadowRoot) return 100;
  var sr = host.shadowRoot, b = main.getBoundingClientRect(), open = 0, all = 0;
  for(var i=1;i<40;i++) for(var j=1;j<25;j++){
    var x = b.left + b.width*i/40, y = b.top + b.height*j/25; all++;
    var n = sr.elementFromPoint(x,y), covered = false;
    while(n && n !== sr){
      var bg = getComputedStyle(n).backgroundColor;
      if(bg && bg !== 'rgba(0, 0, 0, 0)' && bg !== 'transparent'){ covered = true; break; }
      n = n.parentElement;
    }
    if(!covered) open++;
  }
  return all ? 100*open/all : 0;
}
function snapLine(){
  var r = snapChecks(), s = '\nЗЛІПОК · екран ' + SNAP.screen + '\n';
  r.forEach(function(x){
    s += '  <b class="' + (x[1]?'ok':'bad') + '">' + (x[1]?'✓':'✗') + '</b> ' + x[0] +
         '   <span style="opacity:.65">' + x[2] + '</span>\n'; });

}
/* ══ пункти й підказки — перенесено з AE_X27_SIDEBAR_v2.html ═══════════════

    if(!row[2]&&first){ b.setAttribute('aria-current','page'); first=false; }
    if(row[2]) b.setAttribute('aria-disabled','true');
    b.setAttribute('aria-label', row[1]+(row[2]?' — екран ще не готовий':''));
    b.setAttribute('data-tip', row[1]+(row[2]?' · екран ще не готовий':''));
    var s=document.createElementNS('http://www.w3.org/2000/svg','svg');
    s.setAttribute('aria-hidden','true');
    var u=document.createElementNS('http://www.w3.org/2000/svg','use');
    u.setAttribute('href','#'+row[0]); s.append(u);
    var t=document.createElement('span'); t.className='lbl'; t.textContent=row[1];
    b.append(s,t); return b;
  }));
}
/* Підказка окремим шаром: у рейці підпис сховано (.lbl display:none), і без
   неї пункт втрачає не лише вигляд, а й доступне ім'я. */
function showTip(el){
  var txt=el.getAttribute('data-tip'); if(!txt) return;
  var rail = state.mode==='rail';
  if(!rail && !el.classList.contains('stub')) return;
  var r=el.getBoundingClientRect();
  g('tip').textContent=txt; g('tip').classList.add('on');
  g('tip').style.left=Math.round(r.right+8)+'px';
  g('tip').style.top=Math.round(r.top+r.height/2-g('tip').offsetHeight/2)+'px';
}
function hideTip(){ g('tip').classList.remove('on'); }
['mouseover','focusin'].forEach(function(ev){
  document.addEventListener(ev, function(e){
    var el=e.target.closest && e.target.closest('[data-tip]');
    if(el) showTip(el); else hideTip();
  });
});
['mouseout','focusout'].forEach(function(ev){ document.addEventListener(ev, hideTip); });

  var done=function(ok){ g('fCopy').textContent = ok?'копі ✓':'копі ✗ (виділи стрічку)';
    setTimeout(function(){ g('fCopy').textContent='копі 📋'; }, 1800); };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){done(true);}, function(){done(fallback(txt));});

function fallback(txt){
  try{

}

/* ══ ЗВІРКА · три числа, два ОБЧИСЛЕНІ з кількох правил (П45) ══
   N1 .brand height 79   — еталон заміряно в продукті (S52 §2)
   N2 .side-links        — ОБЧИСЛЕНЕ від ВИДИМОЇ кількості: n×47 + (n−1)×3 + 18
                           (було зашито 4 — при 2 і 6 пунктах це брехало б)
   N3 .side-link 203     — ОБЧИСЛЕНЕ: 220 − 1 − 8 − 8
   Д6-контроль: висота панелі мусить дорівнювати висоті сцени мінус відступ острівця. */
function measure(){
  railShift();
  var flush = state.shell==='flush' && state.mode==='expanded';
  var q=function(s){ return V2.querySelector(s).getBoundingClientRect(); };
  var sb=V2.querySelector('.sidebar');
  var N1=Math.round(q('.brand').height), N2=Math.round(q('.side-links').height), N3=Math.round(q('.side-link').width);
  var ls=V2.querySelectorAll('.side-links .side-link'), nvis=0;
  for(var k=0;k<ls.length;k++) if(getComputedStyle(ls[k]).display!=='none') nvis++;
  var N2want = nvis ? nvis*47 + (nvis-1)*3 + 18 : 0;
  var stEl=document.querySelector('.stage'), stH=stEl.clientHeight;
  var inset=parseInt(getComputedStyle(V2).getPropertyValue('--isl-inset'))||0;
  var pad  = (state.shell==='island'||state.shell==='solo') ? inset : 0;
  var want = stH - 2*pad;
  var got  = Math.round(q('.sidebar').height);
  var ic=q('.side-link svg'), sd=q('.sidebar');
  var off=((ic.left+ic.width/2)-(sd.left+sd.width/2)).toFixed(1);
  /* П52/П57: важіль сторінки судиться ПІКСЕЛЯМИ того місця, куди воно йде,
     а не оголошенням. Ліворуч — від правого краю рейки до краю .page. */
  var pgL='—', pgR='—', hostEl=g('snapHost');
  if(hostEl && hostEl.shadowRoot){
    var pg=hostEl.shadowRoot.querySelector('.v2 .page'), mn=V2.querySelector('main');
    if(pg && mn){ var pr=pg.getBoundingClientRect(), mr=mn.getBoundingClientRect();
      pgL=Math.round(pr.left-sd.right); pgR=Math.round(mr.right-pr.right); }
  }
  var ok=function(v,t){ return '<b class="'+(v===t?'ok':'bad')+'">'+v+(v===t?' ✓':' ✗ (еталон '+t+')')+'</b>'; };
  g('meter').innerHTML =
   'ЗВІРКА З ПРОДУКТОМ (дійсна в режимі «врівень · розгорнуто»)\n'+
   '  N1 .brand height      '+(flush?ok(N1,79):N1+' —')+'   еталон 79\n'+
   '  N2 .side-links height '+(flush?ok(N2,N2want):N2+' —')+'   ОБЧИСЛЕНЕ '+nvis+'×47 + '+(nvis-1)+'×3 + 18 = '+N2want+'\n'+
   '  N3 .side-link width   '+(flush?ok(N3,203):N3+' —')+'   ОБЧИСЛЕНЕ 220 − 1 − 8 − 8\n'+
   'Д6 · ПОВНА ВИСОТА       '+(state.fit==='full'?ok(got,want):got+' — (по вмісту: контроль не діє)')+
   '   сцена '+stH+' − відступ '+inset+'×2\n'+
   'ПОТОЧНИЙ СТАН\n'+
   '  кадр '+state.frame+'   висота панелі '+state.fit+'   пунктів видимих '+nvis+' з '+state.set+'\n'+
   '  .sidebar '+Math.round(sd.width)+'×'+got+'   пункт '+N3+'×'+Math.round(q('.side-link').height)+
   '   центр іконки vs вісь рейки '+off+'\n'+
   '  скрол '+(sb.scrollHeight>sb.clientHeight?'Є ⚠':'нема')+
   '   тінь '+getComputedStyle(V2).getPropertyValue('--isl-shadow').trim()+'\n'+
   '  позиція рейки '+(leverWhy('railpos')?'н/д':state.railpos)+
   '   зсув '+railShift()+' px   стеля '+(leverWhy('railCap')?'н/д':g('rCap').value+' px')+
   '   верх рейки '+Math.round(sd.top-V2.querySelector('.shell').getBoundingClientRect().top)+' px\n'+
   '  шасі '+state.shell+'   рейка '+(leverWhy('rail')?'н/д':state.rail)+
   '   зазор рейка→контент '+pgL+' px   праворуч '+pgR+' px\n'+
   '  сторінка '+state.page+
   '   підзаголовок '+state.sub+'\n'
   + lockLine() + snapLine();
}

var LN = null;
function paintNav(){
  if(!LN){ LN = document.createElement('style'); LN.id = 'lv-nav';
           document.head.appendChild(LN); }

  /* вісь 3 · висота дотику */

     навмисно НЕ жовтий: вирок S53. Активний пункт із hover не змішуємо. */
  if(state.hover === 'neutral')
    css += '.v2 .side-link:not(.active):hover{background:#1C1E2414}';

     форма малювалась із чистого аркуша і П63 могло зміряти різницю. */
  css += '.v2 .side-link{position:relative}'
       + '.v2 .side-link.active{border-left-color:transparent;background:none;'
       + 'border-radius:0 8px 8px 0;margin:0;color:var(--anc-text);font-weight:700}'
       + '.v2 .side-link.active::after{content:none}';

  if(state.actform === 'left')    css += BAR_L;

                                       + 'left:18px;right:18px;bottom:0;height:3px;'
                                       + 'background:var(--green);border-radius:3px 3px 0 0}';
  if(state.actform === 'fill')    css += FILL;

  LN.textContent = css;
}

/* ══ Х27 · Л-РЕГІСТР ВАЖЕЛІВ (Lens_stagebench_manifest §3 п.13) ══════════════
   ДІМ (12.11):
     · живе значення важеля — var state (рядки-важелі) або сам DOM-контрол;
     · КАНОН — LEVER_LOCK нижче + SPEC §14 «ЛОК важелів Х27»; п.13-в:
       запис лише в одне з двох вважається незробленим.
     ⚠ АДРЕСУ ВИПРАВЛЕНО. До v15 тут стояв SPEC §13.3 — грепом видно, що §13.3
       це «Вироки, прийняті тут» про МІСТ ДО ДАНИХ (11 пунктів: potential, brand,
       difficulty…), а токенів «В-NN» у всьому SPEC нуль. Два різні регістри під
       однією адресою — дефект маршруту; канон важелів їде у власний §14.

       У ПРОДУКТІ дому нема: логотип там панель не перемикає (борг Х27 кроку 3).
     · токени --isl-* — оголошені в .v2 у таблиці стилів цього стенда (:117–:129).
       У продукті їх теж нема; вони народжені Х27 і мусять приїхати разом із вироками.

   ⚠ НУМЕРАЦІЯ — ВЛАСНА СЕРІЯ Л-NN, не В-NN.
   Грепом по всіх самері: діапазон В-33…В-49 роздано ДВІЧІ — треку екранів
   (S48/S49: бейдж E1, номер замовлення, скрол пропозицій, палітра…) і треку
   Х27 (S53…S59: оболонка, тон, форма активного, дотик). Тобто В-46 означає
   і «бейдж у рядку назви», і «заливка+смуга». Перенумерування зачепило б шість
   витіснених самері; тому серія В- заморожена як є, а вироки ВАЖЕЛІВ дістають
   власну серію Л-NN. Походження несе сам рядок: «Л-06 · В-46/S59».

   п.13-е: фіксація в стенді ≠ канон. Тут лежать ТІЛЬКИ вироки; усе інше

var LEVER_LOCK = {

};

/* п.13-б: мертвий важіль не потрапляє в 📋 — інакше його число стає хибним каноном.
   ⚠ Ловиться лише прихований важіль. Повний детектор чотирьох класів §8.7
   (верстка · каскад · оптика) — БОРГ, названий, не закритий. */
function leverDead(grp){ return getComputedStyle(grp).display === 'none'; }
/* §8.7 · скасований важіль називає ВИНУВАТЦЯ. Сірий важіль без причини
   оператор читає як поламаний стенд і йде його обходити. */
function leverWhy(k){
  if(k==='rail')   return state.shell==='bare' ? null
                        : 'не діє при оболонка=' + state.shell + ' — рейку вже відсунув padding .shell';
  if(k==='canvas') return (state.shell==='island'||state.shell==='solo') ? null
                        : 'канви немає при оболонка=' + state.shell;
  if(k==='railpos') return state.shell==='flush' ? 'не діє при оболонка=врівень — рейка там борт вікна' : null;
  if(k==='railCap') return state.railpos==='center' ? null
                        : 'стеля діє лише при позиції=центр';
  if(k==='fit')     return state.railpos==='group' ? 'при центрі групи панель завжди на висоту вікна' : null;
  /* §8.7-а · мертвий за ВЕРСТКОЮ: у SETS['6'] усі шість рядків — заглушки,
     build() не ставить .active нікому, і форма активного не має на чому
     проступити. Важіль мусить назвати винуватця, а не сіріти мовчки. */
  if(k==='actform') return state.set==='6' ? 'при наборі 6 куратор жоден пункт не активний — усі заглушки (SETS, Д-В2)' : null;
  if(k==='corners') return state.shell==='flush' ? 'не діє при оболонка=врівень — рейка там борт вікна' : null;
  return null;
}
/* Зсув рахується, а не задається: вільне місце ділиться навпіл і ОБРІЗАЄТЬСЯ
   стелею. Стеля — вимога оператора «щоб рейка не відірвалась від контексту»;
   заміряний побічний зиск — панель перестає їздити при зміні набору пунктів.
   Дім (12.11): state.railpos → data-railpos на .v2 · --rail-shift на .v2, пишеться тут. */
function railShift(){
  var sh = V2.querySelector('.shell'), sd = V2.querySelector('.sidebar');
  if(state.railpos !== 'center' || state.shell === 'flush'){
    V2.style.setProperty('--rail-shift','0px'); return 0; }
  var cs = getComputedStyle(sh);
  var free = sh.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - sd.offsetHeight;
  var cap  = +g('rCap').value;
  var shift = Math.max(0, Math.min(free/2, cap));
  V2.style.setProperty('--rail-shift', shift + 'px');
  return Math.round(shift);
}
function lockScan(){
  var gs = leverGrps(), live = 0, locked = 0, diff = [], zombie = [];
  for(var i=0;i<gs.length;i++){
    var grp = gs[i], k = grp.dataset.k;
    var mark = grp.querySelector('.lk');
    if(!mark){ mark = document.createElement('span'); mark.className = 'lk';
               grp.querySelector('label').appendChild(mark); }
    var has  = Object.prototype.hasOwnProperty.call(LEVER_LOCK, k);
    var dead = leverDead(grp);
    var now  = leverLive(grp);
    var why = leverWhy(k); dead = dead || !!why;
    grp.classList.toggle('dead', !!dead);
    if(dead){ mark.className = 'lk lk-no';
              mark.textContent = '(мертвий' + (why ? ': ' + why : '') + ')';
              /* п.16 маніфеста: ЛОК на мертвому важелі = вирок недійсний.
                 До v17 цей рядок виходив із циклу мовчки, і регістр показував
                 покриття, у якому один вирок ні на що не спирався. */
              if(has) zombie.push(k + ' (ЛОК ' + LEVER_LOCK[k] + ' · ' + (why || 'важіль прихований') + ')');
              continue; }
    live++;
    if(!has){ mark.className = 'lk lk-no'; mark.textContent = 'нема ЛОКу'; continue; }
    locked++;
    if(String(now) === String(LEVER_LOCK[k])){ mark.className = 'lk lk-ok'; mark.textContent = '= ЛОК'; }
    else { mark.className = 'lk lk-bad'; mark.textContent = 'ЛОК ' + LEVER_LOCK[k];
           diff.push(k + ' (живе ' + now + ' ≠ ЛОК ' + LEVER_LOCK[k] + ')'); }
  }
  return { live: live, locked: locked, diff: diff, zombie: zombie };
}
function lockLine(){
  var r = lockScan();
  return '\nЛОК-РЕГІСТР (§3 п.13)\n' +
    '  покриття  <b class="' + (r.locked===r.live?'ok':'bad') + '">ЛОК ' + r.locked + '/' + r.live +
    ' важелів</b>   добір за ознакою data-k\n' +
    '  розбіжності  ' + (r.diff.length ? r.diff.join(' · ') : '—') + '\n' +
    '  ⚠ ЛОК на мертвому важелі (п.16)  ' +
      (r.zombie.length ? '<b class="bad">' + r.zombie.join(' · ') + '</b>' : '—') + '\n';
}

g('oCap').textContent = g('rCap').value + 'px';
g('rCap').addEventListener('input', function(){ g('oCap').textContent = this.value + 'px'; measure(); });
bind('rR','oR','--isl-radius','px'); bind('rI','oI','--isl-inset','px');
g('rR').value=28; g('rI').value=0;
V2.style.setProperty('--isl-radius','28px'); V2.style.setProperty('--isl-inset','0px');
g('oR').textContent='28px'; g('oI').textContent='0px';
/* ══ СТАРТОВА ПОЗИЦІЯ = ПАСПОРТ ОПЕРАТОРА (чат, 13.09.2026) ═══════════
   Канал 📋 device→назад, маніфест §2 п.8. Не канон (п.13-е): канон —
   LEVER_LOCK + SPEC §14, і регістр далі чесно показує «нема ЛОКу». */
[['tHead','--isl-head','#FFF9D9'],['tBody','--isl-surface','#FFFFFF'],
 ['tFoot','--isl-foot','transparent'],['tMain','--isl-main','#FFFEF6']]
  .forEach(function(p){ g(p[0]).value=p[2]; V2.style.setProperty(p[1],p[2]); });

g('doorBtn').setAttribute('data-tip','Куратор');
