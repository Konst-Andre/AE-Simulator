# Гейт цілісності даних AE-Simulator.
# живе доки: tools/ae_validate.js лишається гейтом даних
#
# Запускається на кожен push і кожен pull request. Нічого не деплоїть,
# нічого не міняє — тільки читає data/*.json і каже ✓ або ✗.
# ✗ = червоний хрестик біля коміту + лист авторові правки.
#
# У переліку paths стоять не лише дані, які гейт перевіряє, а й файли, у яких
# живуть самі правила та довідники: tools/ae_rules.js (правила) і
# prompts/characters.md (перелік характерів). Без них правку довідника можна
# залити повз гейт, і дані стануть невірними без жодного червоного.
# ⚠ ПЕРЕЛІК ЗМІНЕНО В S23. Раніше тут стояв тільки prompts/characters.md, а
# judge.md був виключений свідомо: ae_validate його не читає, і шлях без
# перевірки за ним — видимість нагляду. Тепер за prompts/** стоїть справжня
# перевірка: третій крок піднімає сторінку цілком, а boot() зупиняється
# виїмкою на порожньому чи перейменованому промпті. Твердження про ЗМІСТ
# judge.md і далі живуть у tools/smoke_step2.js, який запускається руками.
#
# Другий крок — tools/smoke_rules_v1.js. Він тут єдиний зі смоуків, бо єдиний
# не має зашитого BASE і не потребує jsdom: читає файли відносно кореня репо.
# ae_validate каже, чи дані ЧИСТІ; smoke_rules каже, чи правила мають ЗУБИ —
# на підкинутому рядку вони мусять почервоніти саме своїм повідомленням.
# Без другого кроку зелений перший означав би тільки «жодне правило не
# спрацювало», що однаково правда і для правильних даних, і для видаленої
# перевірки.
#
# Третій крок (S23) — tools/smoke_edit_ui_v1.js: екран редактора даних.
# Він судить МАРШРУТ вердикту на картки і ЧЕРНЕТКУ картки сценарію, тобто
# ламається він від правки index.html — саме тому index.html доданий у paths.
# Без цього рядка правка сторінки проходила б повз гейт, який її й охороняє
# (12.12-е). Ціна кроку — jsdom, тому перед ним стоїть окремий npm install:
# решта смоуків у CI не тому, що не потрібні, а тому, що мають зашитий BASE;
# цей бере корінь збірки першим аргументом і тому переносний.
name: Перевірка даних
on:
  push:
    paths: ['data/**', 'config.json', 'index.html', 'tools/ae_validate.js', 'tools/ae_rules.js', 'tools/smoke_rules_v1.js', 'tools/smoke_edit_ui_v1.js', 'prompts/**']
  pull_request:
    paths: ['data/**', 'config.json', 'index.html', 'tools/ae_validate.js', 'tools/ae_rules.js', 'tools/smoke_rules_v1.js', 'tools/smoke_edit_ui_v1.js', 'prompts/**']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: node tools/ae_validate.js
        run: node tools/ae_validate.js
      - name: node tools/smoke_rules_v1.js
        run: node tools/smoke_rules_v1.js
      - name: jsdom для смоука екрана
        run: npm install --no-save jsdom
      - name: node tools/smoke_edit_ui_v1.js
        run: node tools/smoke_edit_ui_v1.js .
